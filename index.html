he data is."}, {"t": "AND, OR, NOT in nested IF", "task": "In Inventory!N2:N41, show Markdown if the pair is unsold AND has been listed more than 60 days AND is NOT deadstock (DS). Otherwise show Hold.", "steps": ["Write your formula in N2 and fill it down. Stuck? Reveal the answer below."], "answer": "`=IF(AND(I2=\"\",M2>60,NOT(E2=\"DS\")),\"Markdown\",\"Hold\")`", "why": "Markdown flags feed the weekly sale and the Decision sheet's count."}, {"t": "WEEKDAY and WORKDAY", "task": "For sold pairs, fill Inventory!O2:O41 with the weekday number of the sale (Monday = 1) and P2:P41 with a ship-by date 2 workdays after the sale that skips the dates in Holidays!A2:A11. Leave both blank for unsold pairs.", "steps": ["O2: `=IF(I2=\"\",\"\",WEEKDAY(I2,2))`", "P2: `=IF(I2=\"\",\"\",WORKDAY(I2,2,Holidays!$A$2:$A$11))`, formatted as Short Date.", "Fill both down."], "tip": "WEEKDAY's return_type 2 makes Monday = 1 and Sunday = 7. The default (1) makes Sunday = 1.", "why": "Customers ask when their order ships, so staff need the ship-by date."}, {"t": "COUNTIF, SUMIF, AVERAGEIF", "task": "On the Brands sheet, for each brand in A4:A8, fill in: B = how many pairs (COUNTIF), C = total cost (SUMIF on Cost), D = average cost (AVERAGEIF).", "steps": ["B4: `=COUNTIF(Inventory!$B$2:$B$41,A4)`", "C4: `=SUMIF(Inventory!$B$2:$B$41,A4,Inventory!$F$2:$F$41)`", "D4: `=AVERAGEIF(Inventory!$B$2:$B$41,A4,Inventory!$F$2:$F$41)`", "Fill B4:D4 down to row 8."], "why": "The brand report shows where the money is tied up."}, {"t": "SUMIFS, AVERAGEIFS, COUNTIFS, MAXIFS, MINIFS", "task": "On the Brands sheet, for each brand: E = revenue from SOLD pairs only (SUMIFS on Price where Sold isn't blank), F = average price of DS pairs (AVERAGEIFS), G = count of DS pairs (COUNTIFS), H = highest price (MAXIFS), I = lowest price (MINIFS).", "steps": ["E4: `=SUMIFS(Inventory!$G$2:$G$41,Inventory!$B$2:$B$41,A4,Inventory!$I$2:$I$41,\"<>\")`", "F4: `=AVERAGEIFS(Inventory!$G$2:$G$41,Inventory!$B$2:$B$41,A4,Inventory!$E$2:$E$41,\"DS\")`", "G4: `=COUNTIFS(Inventory!$B$2:$B$41,A4,Inventory!$E$2:$E$41,\"DS\")`", "H4: `=MAXIFS(Inventory!$G$2:$G$41,Inventory!$B$2:$B$41,A4)`", "I4: `=MINIFS(Inventory!$G$2:$G$41,Inventory!$B$2:$B$41,A4)`", "Fill E4:I4 down to row 8."], "trap": "In the IFS versions the range you sum or average comes FIRST. In SUMIF and AVERAGEIF it comes LAST. The exam loves this difference.", "answer": "\"<>\" means not blank.", "why": "This tells the owner which brands actually sell and what they sell for."}, {"t": "XLOOKUP and VLOOKUP", "task": "On the Lookup sheet: B4 returns the Model for the SKU in B3 using XLOOKUP, showing Not found if it's missing. B5 returns the Price using VLOOKUP with an exact match.", "steps": ["B4: `=XLOOKUP(B3,Inventory!A2:A41,Inventory!C2:C41,\"Not found\")`", "B5: `=VLOOKUP(B3,Inventory!$A$2:$G$41,7,FALSE)`", "Change B3 to MC-1099 and check that B4 shows Not found."], "trap": "Leaving off VLOOKUP's FALSE gives an approximate match and quietly returns wrong rows.", "why": "Staff use this lookup at the counter to quote a price from a SKU."}, {"t": "HLOOKUP, INDEX, MATCH", "task": "On the Lookup sheet: B8 returns the shipping rate for the zone in B7 from the horizontal table on Shipping!B1:G2 (HLOOKUP). B10 returns the Brand for the SKU in B3 using INDEX and MATCH.", "steps": ["B8: `=HLOOKUP(B7,Shipping!$B$1:$G$2,2,FALSE)`", "B10: `=INDEX(Inventory!$B$2:$B$41,MATCH(B3,Inventory!$A$2:$A$41,0))`"], "tip": "MATCH's 0 means exact match. INDEX/MATCH can look left, which VLOOKUP can't.", "why": "The same lookup tool quotes shipping and confirms the brand."}, {"t": "Consolidate", "task": "On the Consolidated sheet starting at A1, use Consolidate to SUM the brand sales from Q1!A1:C6, Q2!A1:C6, and Q3!A1:C6, using the labels in the top row and left column. Each sheet lists brands in a different order.", "steps": ["Click Consolidated!A1 and choose [[Data > Consolidate]]. Function: Sum.", "Click in Reference, select Q1!A1:C6, and click Add. Repeat for Q2 and Q3.", "Check Top row and Left column. Click OK."], "trap": "Without both label boxes checked, Excel adds by position and mixes up the brands.", "why": "The bank wants year-to-date sales in one table. The Decision sheet totals it."}, {"t": "Goal Seek", "task": "On the Breakeven sheet, use Goal Seek to find how many pairs (B2) the shop must sell for Profit (B6) to equal 6000.", "steps": ["[[Data > What-If Analysis > Goal Seek]].", "Set cell: B6. To value: 6000. By changing cell: B2. Click OK, then OK again."], "answer": "250 pairs", "why": "The owner needs to know how many pairs it takes to hit the profit goal."}, {"t": "Scenario Manager", "task": "On the Projection sheet, create three scenarios that change B2 (pairs per month) and B3 (average price): Expected 200 and 175, Best 260 and 190, Worst 140 and 160. Then create a Scenario Summary report for result cell B6.", "steps": ["Go to the Projection sheet. Choose [[Data > What-If Analysis > Scenario Manager]] and click Add.", "Type Expected as the Scenario name. In Changing cells, type B2:B3. Click OK.", "The Scenario Values box opens with TWO separate boxes, one labeled $B$2 and one labeled $B$3. Type 200 in the $B$2 box and 175 in the $B$3 box. One plain number per box: no commas, $ signs, or words. Click Add to start the next scenario.", "Name it Best and keep B2:B3 as the changing cells. Click OK, then type 260 in the $B$2 box and 190 in the $B$3 box. Click Add.", "Name it Worst. Click OK, then type 140 in the $B$2 box and 160 in the $B$3 box. Click OK to go back to Scenario Manager.", "Click Summary, choose Scenario summary, and set Result cells to B6. Click OK. A new Scenario Summary sheet shows the profit for each scenario."], "answer": "Profit for Expected = 4,000, Best = 11,500, Worst = -1,700 (a loss).", "trap": "#VALUE! in the summary's result rows means a scenario holds text instead of a number, usually because both numbers were typed into the first box (like 200, 175). Open Scenario Manager, select that scenario, click Edit, then OK, and put one number in each box. Delete the old Scenario Summary sheet and click Summary again. If B2 or B3 on Projection now shows text, retype 200 and 175 there.", "why": "The bank wants to see best, expected, and worst cases side by side."}, {"t": "PMT, NPER, and forecasting with IF and AND", "task": "On the Loan sheet: B6 = the monthly payment on the loan (PMT). B10 = how many months it takes to pay off the loan at the payment in B9 (NPER). B12 = Pay off in 2 years if B10 is 24 or less AND B9 is 1200 or less, otherwise Extend.", "steps": ["B6: `=PMT(B3/12,B4*12,-B2)`", "B10: `=NPER(B3/12,-B9,B2)`", "B12: `=IF(AND(B10<=24,B9<=1200),\"Pay off in 2 years\",\"Extend\")`"], "trap": "Divide the annual rate by 12 and multiply the years by 12. Payments are money going out, so they're negative.", "answer": "B6 is about $777.66. B10 is about 27.3 months, so B12 shows Extend.", "why": "This is the loan itself: the monthly payment and how fast it can be paid off."}, {"t": "FILTER and SORTBY", "task": "On the Reports sheet: in A3, use FILTER to list every Nike pair priced over 200 (columns A:G of Inventory), returning None if nothing matches. In J3, use SORTBY to list SKU, Brand, and Model sorted by Price from high to low.", "steps": ["A3: `=FILTER(Inventory!A2:G41,(Inventory!B2:B41=\"Nike\")*(Inventory!G2:G41>200),\"None\")`", "J3: `=SORTBY(Inventory!A2:C41,Inventory!G2:G41,-1)`"], "tip": "Inside FILTER, * means AND and + means OR.", "why": "Consignment buyers want the premium Nike list, and the window display goes by price."}, {"t": "Trace precedents and dependents", "task": "On the Audit sheet, trace the precedents of B12 and the dependents of C3. Which cells feed directly into B12?", "steps": ["Click Audit!B12 (Net) and choose [[Formulas > Trace Precedents]]. Blue arrows point from the cells it reads.", "Click Audit!C3, Brickell's revenue. It's a plain number, not a formula, and that's on purpose: Trace Dependents works on any cell and shows which formulas USE it. Choose [[Formulas > Trace Dependents]]. Arrows run to D3, E3, F3, and B10.", "Clear them with [[Formulas > Remove Arrows]]."], "answer": "B12 = B10 - B11, so its direct precedents are B10 and B11. Click Trace Precedents again to see the next level.", "tip": "Precedents are the cells a formula reads from, so use them on a formula cell. Dependents are the formulas that read from a cell, so use them on an input like C3. If Trace Dependents shows nothing, no formula uses that cell.", "why": "Before trusting the store P&L, the owner wants to know what feeds Net."}, {"t": "Watch Window", "task": "Add a watch on Audit!B12, then change Audit!C3 to 9000 and watch the value update.", "steps": ["Click B12 and choose [[Formulas > Watch Window]], then Add Watch.", "Change C3 to 9000. The Watch Window updates even when B12 is off-screen."], "tip": "If you don't see Watch Window, update Excel. Older Mac builds didn't have it.", "why": "Keep an eye on Net while you fix the inputs."}, {"t": "Error checking and Evaluate Formula", "task": "Audit!D2:D7 has a #DIV/0! error and E5 has an inconsistent formula. Use Error Checking to find both. Fix D2:D7 so the error shows 0 instead, and fix E5 to match its neighbors. Then step through F2 with Evaluate Formula.", "steps": ["[[Formulas > Error Checking]] jumps to each error and explains it.", "Change D2 to `=IFERROR(C2/B2,0)` and fill down to D7.", "Click E5. The green triangle warns that it's inconsistent. Copy E4's formula into E5.", "Click F2 and choose [[Formulas > Evaluate Formula]]. Click Evaluate repeatedly to watch each step."], "tip": "If your Mac build doesn't have Evaluate Formula, select part of the formula in the formula bar and press {{Fn+F9}} to see that piece's value. Press {{Esc}} afterward.", "why": "Until these errors are fixed, the Decision sheet shows a wrong Net and a #DIV/0!."}, {"t": "Record, name, and edit a macro", "task": "Record a macro named HighlightMarkdowns that applies bold and a yellow fill to the selected cells. Then edit it in the VBA editor so the fill is orange (RGB 255, 165, 0). Save the file as .xlsm.", "steps": ["Select any cell. Choose [[Developer > Record Macro]] (enable the Developer tab in [[Excel > Preferences > Ribbon & Toolbar]] if you don't see it).", "Macro name: HighlightMarkdowns (no spaces). Store in: This Workbook. Click OK.", "Press {{Cmd+1}} to open Format Cells. On the Font tab, set Font style to Bold. On the Fill tab, pick yellow. Click OK, then click [[Developer > Stop Recording]].", "[[Developer > Macros]], select HighlightMarkdowns, and click Edit.", "In the code, change the .Color line to `.Color = RGB(255, 165, 0)`. Close the editor.", "[[File > Save As]] and choose Excel Macro-Enabled Workbook (.xlsm)."], "trap": "Macro names can't contain spaces or start with a number. Saving as .xlsx deletes your macro.", "why": "Highlighting the markdown pairs is a weekly routine, so a macro does it in one click."}], "goal": "A complete decision workbook: priced and tiered inventory, a brand report, a staff lookup tool, consolidated sales, breakeven and scenario analysis, loan math, a corrected store P&L, a weekly markdown macro, and a Decision sheet that fills in from all of it."}, {"id": "2-4", "world": 2, "name": "Pivot Peak", "domain": "Manage advanced charts and tables", "exam": "MO-211 Domain 4 (25-30%)", "scenario": "Coconut Grove Concert Series", "story": "The summer series just ended. Sponsors want a wrap-up that answers one question: what should be booked next year, and where?", "files": [["L2-4_Concert_Series.xlsx", "Practice workbook"]], "items": ["Dual-Axis Combo", "Box & Whisker", "Funnel", "Histogram", "Sunburst", "Waterfall", "PivotTables", "Slicers", "Grouping", "Calculated Fields", "Value Field Settings", "PivotCharts"], "quests": [{"t": "Dual-axis combo chart", "task": "From Monthly!A1:C7, create a chart where Tickets is a clustered column and Revenue is a line on the secondary axis. Title it Tickets vs Revenue.", "steps": ["Select A1:C7 and choose [[Insert > Column > Clustered Column]].", "Right-click the Revenue bars and choose Change Series Chart Type. Pick Line.", "Right-click the Revenue line and choose Format Data Series. Under Series Options, choose Secondary Axis.", "Click the chart title and type Tickets vs Revenue."], "tip": "Use a secondary axis when two series have very different scales, like hundreds of tickets against tens of thousands of dollars.", "why": "Sponsors see ticket volume and revenue together, even though they're on very different scales."}, {"t": "Box & Whisker", "task": "Create a Box & Whisker chart from Prices!A1:B121 showing ticket prices by venue.", "steps": ["Select A1:B121.", "[[Insert > Statistical Chart > Box and Whisker]]."], "why": "Shows which venues support higher ticket prices."}, {"t": "Funnel", "task": "Create a Funnel chart from Funnel!A1:B6 (marketing stages) and title it Ticket Purchase Funnel.", "steps": ["Select A1:B6.", "[[Insert > Waterfall, Funnel, Stock... > Funnel]].", "If the chart has no title, add one: [[Chart Design > Add Chart Element > Chart Title > Above Chart]].", "Click the title and type Ticket Purchase Funnel."], "tip": "Sponsors see this chart without the data next to it, so the title has to say what it shows.", "why": "Shows where people drop off between seeing an ad and buying a ticket."}, {"t": "Histogram", "task": "Create a Histogram of attendee ages from Ages!A1:A201.", "steps": ["Select A1:A201 and choose [[Insert > Statistical Chart > Histogram]].", "Look at the labels under the bars, like [14, 21.3]. Each label is a bin: the age range that bar counts.", "Click the age labels and press {{Cmd+1}} to open Format Axis. On Mac you'll see Gap Width, Tick Marks, and Number Format here."], "tip": "A bin is the range of values one histogram bar counts. Excel picks the bins automatically. Windows Excel lets you set a Bin width in Format Axis, but Mac Excel doesn't show bin settings there, so on Mac the automatic bins are what you get.", "trap": "Make sure you chose Histogram, not Clustered Column. A histogram groups the ages into ranges. A column chart would draw one bar per person.", "why": "Shows which age groups sponsors are actually reaching."}, {"t": "Sunburst", "task": "Create a Sunburst chart from Genres!A1:C13 (Genre > Artist > Revenue).", "steps": ["Select A1:C13.", "[[Insert > Hierarchy Chart > Sunburst]]."], "why": "Shows which artists drove each genre's revenue."}, {"t": "Waterfall", "task": "Create a Waterfall chart from Profit!A1:B9 and set Ending Balance as a total.", "steps": ["Select A1:B9 and choose [[Insert > Waterfall, Funnel, Stock... > Waterfall]].", "Click the Ending Balance bar once, then click it again so only that bar is selected.", "Right-click it, choose Format Data Point, and check Set as total."], "trap": "Without Set as total, the last bar floats like a change instead of sitting on the axis.", "why": "Shows how the season went from starting balance to ending balance."}, {"t": "Create a PivotTable", "task": "Create a PivotTable on a new worksheet from Sales!A1:H301. Put Genre in Rows, Venue in Columns, and Sum of Revenue in Values. Rename the sheet Pivot.", "steps": ["Click in the data and choose [[Insert > PivotTable]]. Choose New Worksheet and click OK.", "Drag Genre to Rows, Venue to Columns, and Revenue to Values.", "Rename the sheet tab Pivot."], "why": "This is the core analysis: revenue by genre and venue."}, {"t": "Modify field selections and options", "task": "In the PivotTable, move Venue to Filters, add Artist under Genre in Rows, and switch the report layout to Tabular Form.", "steps": ["In the PivotTable Fields pane, drag Venue from Columns to Filters.", "Drag Artist into Rows below Genre.", "[[Design > Report Layout > Show in Tabular Form]]."], "why": "Sponsors want to filter by venue and see artists within each genre."}, {"t": "Create slicers", "task": "Add a slicer for Venue and use it to show only Bayfront Park.", "steps": ["Click in the PivotTable and choose [[PivotTable Analyze > Insert Slicer]].", "Check Venue and click OK.", "Click Bayfront Park on the slicer. Click the clear filter icon on the slicer when you're done."], "why": "Slicers let sponsors click through venues during the meeting."}, {"t": "Group PivotTable data", "task": "Create a second PivotTable on the same sheet starting at J3 with Date in Rows and Sum of Tickets in Values. Group the dates by Months and Quarters.", "steps": ["Click in Sales data, choose [[Insert > PivotTable]], choose Existing Worksheet, and set the location to Pivot!$J$3.", "Drag Date to Rows and Tickets to Values.", "Right-click any date and choose Group. Select Months and Quarters, then click OK."], "tip": "Recent Excel versions may group dates automatically. If they're already grouped, open Group anyway and set exactly what the task asks for.", "why": "Ticket sales by month and quarter show when to schedule big shows."}, {"t": "Add a calculated field", "task": "In the first PivotTable, add a calculated field named Profit that equals Revenue minus Cost.", "steps": ["Click in the PivotTable and choose [[PivotTable Analyze > Fields, Items & Sets > Calculated Field]].", "Name: Profit. Formula: `=Revenue-Cost` (double-click field names to insert them). Click Add, then OK."], "why": "Revenue isn't the whole story. Profit is what pays for next year."}, {"t": "Configure value field settings", "task": "In the first PivotTable, show Sum of Revenue in Currency format with 0 decimals. Then add Revenue to Values a second time and show it as % of Grand Total.", "steps": ["In the Values area, click the (i) next to Sum of Revenue. Click Number Format, choose Currency with 0 decimals, and click OK.", "Drag Revenue into Values again. Click its (i), open the Show data as list, choose % of Grand Total, and click OK."], "why": "Currency and percent of total make the numbers easy to present."}, {"t": "Create and style a PivotChart", "task": "Create a Clustered Column PivotChart from the first PivotTable, apply chart Style 6, and use a field button to filter Genre to Latin and Jazz.", "steps": ["Click in the PivotTable and choose [[PivotTable Analyze > PivotChart]], then Clustered Column.", "Click the chart and choose Style 6 from the Chart Design gallery.", "Use the Genre filter button on the chart (or the PivotTable's Row Labels filter) to check only Latin and Jazz."], "why": "A PivotChart puts the best genres on the slide."}, {"t": "Drill down into details", "task": "Drill into the data behind one Latin artist's revenue to see the individual sales rows.", "steps": ["Go to the main PivotTable on the Pivot sheet. Under Latin in the Genre column, find an artist such as Los Mangos.", "Look across that artist's row to the Sum of Revenue column (the dollar amount, not the % column).", "Double-click that number. Excel opens a new sheet listing every sale behind it, and every row says Latin in the Genre column.", "If your PivotTable shows a Latin Total row, double-clicking its revenue number works too. It lists every Latin sale."], "tip": "The exam calls this drilling down. Double-clicking for details works on both Mac and Windows.", "why": "When a sponsor asks what's behind a number, you can show the exact sales."}], "goal": "A finished season wrap-up for sponsors: specialty charts telling the season's story, plus PivotTables, slicers, and a PivotChart that show which genres and venues earned the most."}], "codes": [["{{Cmd+1}}", "Open Format Cells", "Number formats, borders, protection"], ["{{Cmd+T}}", "In a formula: cycle $ references. On a range: create a table", "1-3, 1-4"], ["{{Ctrl+G}}", "Go To a cell or named range", "1-1"], ["{{Cmd+F}}", "Find", "1-1"], ["{{Ctrl+H}}", "Find and Replace", "1-1"], ["{{Cmd+K}}", "Insert hyperlink", "1-1"], ["{{Ctrl+Cmd+V}}", "Paste Special", "1-2"], ["{{Cmd+D}} / {{Cmd+R}}", "Fill down / fill right", "Everywhere"], ["{{Ctrl+`}}", "Show or hide formulas", "1-1"], ["{{Cmd+=}}", "Calculate now (manual calculation)", "2-1"], ["[[Formulas > Calculation Options > Automatic]]", "Numbers crossed out with a line, or not updating? Excel is in Manual calculation, often left over from Level 2-1. Switch back to Automatic. The setting applies to every open workbook.", "2-1, TOSA"], ["{{Ctrl+;}}", "Type today's date as a fixed value (TODAY() changes every day; this doesn't)", "F-2"], ["{{Shift+F3}}", "Insert Function dialog", "Formulas"], ["{{Cmd+Shift+Arrow}}", "Select to the edge of the data", "Everywhere"], ["{{Cmd+Arrow}}", "Jump to the edge of the data", "Everywhere"], ["{{Ctrl+U}}", "Edit the active cell (same as F2 on Windows)", "Everywhere"], ["{{Cmd+Z}} / {{Cmd+Y}}", "Undo / redo", "Everywhere"], ["{{Cmd+S}}", "Save", "Everywhere"], ["[[File > Browse Version History]]", "View and restore an earlier version of a workbook. Only works on files saved to OneDrive or SharePoint, so you can't try it on your Mac, but the exam can ask about it. Click a version, then Restore.", "Exam only"], ["[[Excel > Preferences > Ribbon & Toolbar]]", "Turn on the Developer tab and edit the Quick Access Toolbar", "1-1, 2-1, 2-3"]], "exam": [["THE FORMAT", "MOS 365 exams are hands-on. You complete tasks inside real Excel files instead of answering multiple-choice questions. Expect about 50 minutes, split into several small projects with a handful of tasks each."], ["THE SCORE", "Scores run from 1 to 1000, and 700 is the usual passing mark. Associate (MO-210) comes first. Expert (MO-211) assumes you already know everything in World 1."], ["READ THE WHOLE TASK", "Most lost points come from doing almost what was asked: the wrong cell, the wrong sheet, Count instead of Count Numbers. Read the task twice and match every detail."], ["DON'T FIX WHAT ISN'T BROKEN", "Only change what the task asks for. Extra formatting or a moved range can make a task count as wrong."], ["SKIP, THEN COME BACK", "Stuck for more than a minute? Mark the task for review, move on, and return at the end. Every task is worth points."], ["PRACTICE LIKE IT'S REAL", "Replay each level without opening walkthroughs and time yourself. When you can clear a level cold, you're ready for that domain."]], "tosa": {"levels": [{"id": "E-1", "world": "E", "track": "tosa", "name": "Tab Town", "domain": "Environment: sheets, navigation, views", "exam": "TOSA Environment & Methods · Basic band (351-550)", "band": "Basic", "scenario": "Café Cubano", "story": "The café's workbook has grown messy: a sheet called Notes that nobody can find, an old menu still hanging around, and months in the wrong order. The owner wants it organized before the accountant opens it.", "goal": "An organized workbook: renamed, colored, and reordered tabs, a new April sheet, the old menu gone, frozen headers, a hidden cost column, a zoomed-in sheet, and a landscape sheet ready to print.", "files": [["TE-1_Cafe_Cubano_Workbook.xlsx", "Practice workbook"]], "items": ["Rename sheets", "Tab colors", "Insert sheets", "Move sheets", "Delete sheets", "Freeze panes", "Hide columns", "Zoom", "Orientation"], "quests": [{"t": "Rename a sheet", "why": "Notes could mean anything. The accountant is looking for the staff notes.", "task": "Rename the Notes sheet to Staff Notes.", "steps": ["Double-click the Notes tab (or right-click it and choose Rename).", "Type Staff Notes and press {{Return}}."]}, {"t": "Color the month tabs", "why": "Colored tabs make the monthly sheets easy to find.", "task": "Give the Jan, Feb, and Mar tabs any tab color.", "steps": ["Click the Jan tab, then {{Shift}}-click the Mar tab to select all three.", "Right-click one of them, choose Tab Color, and pick a color.", "Click another tab to ungroup the sheets."], "trap": "While sheets are grouped, anything you type goes onto all of them. Always ungroup when you're done."}, {"t": "Insert a new sheet", "why": "April starts next week.", "task": "Insert a new sheet named Apr directly after Mar.", "steps": ["Click the Mar tab, then click the + button at the end of the tabs (or right-click and choose Insert).", "Rename the new sheet Apr.", "If it isn't right after Mar, drag its tab there."]}, {"t": "Move a sheet", "why": "The accountant reads the Summary first, so it belongs right after the Mission sheet.", "task": "Move the Summary sheet so it's the second tab, right after Mission.", "steps": ["Drag the Summary tab to the left until the small arrow sits between Mission and Jan, then let go.", "Or right-click Summary, choose Move or Copy, and pick Jan under Before sheet."]}, {"t": "Delete an old sheet", "why": "The Old Menu sheet has 2024 prices. Keeping it around invites mistakes.", "task": "Delete the Old Menu sheet.", "steps": ["Right-click the Old Menu tab and choose Delete. Click Delete to confirm."], "trap": "Deleting a sheet can't be undone with {{Cmd+Z}}. Check the tab name before you confirm."}, {"t": "Freeze the headers", "why": "Jan has 31 rows. When you scroll, the headers and the day names should stay on screen.", "task": "On Jan, freeze the top row and the first column at the same time.", "steps": ["On the Jan sheet, click B2.", "Choose [[View > Freeze Panes]]. Everything above and to the left of B2 stays put."], "tip": "Freeze Panes freezes the rows above and the columns to the left of the selected cell."}, {"t": "Hide the cost column", "why": "Staff can see Jan, but the owner doesn't want food cost on screen while they work.", "task": "Hide column F (Food Cost) on the Jan sheet.", "steps": ["On Jan, right-click the F column header and choose Hide."], "tip": "To unhide it later, select columns E and G, right-click, and choose Unhide."}, {"t": "Zoom in", "why": "Feb gets read on the small laptop at the register.", "task": "Set the Feb sheet's zoom to 125%.", "steps": ["Click the Feb tab.", "Choose [[View > Zoom]], type 125, and click OK. (Or use the zoom slider in the bottom-right corner.)"], "tip": "Zoom is saved separately for each sheet."}, {"t": "Landscape for printing", "why": "Mar is wider than it is tall, so it prints cut off in portrait.", "task": "Set the Mar sheet to Landscape orientation.", "steps": ["Click the Mar tab.", "Choose [[Page Layout > Orientation > Landscape]]."]}]}, {"id": "E-2", "world": "E", "track": "tosa", "name": "Print Port", "domain": "Environment: page setup and printing", "exam": "TOSA Environment & Methods · Productive band (551-725)", "band": "Productive", "scenario": "Bayside Books", "story": "The spring catalog prints as 14 pages of chopped-off columns with no headers after page 1. The owner wants a catalog that prints cleanly for the front counter, with the wholesale cost column left out.", "goal": "A printable catalog: a print area that skips the cost column, headers on every page, narrow margins, a header and page-number footer, one page wide, a manual break on the Authors sheet, printed gridlines, and a title in the file properties.", "files": [["TE-2_Bayside_Catalog_Print.xlsx", "Practice workbook"]], "items": ["Print area", "Print titles", "Margins", "Headers and footers", "Scale to fit", "Page breaks", "Page Layout view", "Print gridlines", "File properties"], "quests": [{"t": "Set the print area", "why": "Column G holds wholesale costs. Customers should never see them on the printout.", "task": "Set the Catalog print area to A1:F121.", "steps": ["On Catalog, select A1:F121.", "Choose [[Page Layout > Print Area > Set Print Area]]."]}, {"t": "Repeat the header row", "why": "From page 2 on, nobody knows which column is the price.", "task": "Set row 1 of Catalog to print at the top of every page.", "steps": ["Choose [[Page Layout > Print Titles]].", "In Rows to repeat at top, type $1:$1 (or click row 1). Click OK."]}, {"t": "Narrow margins", "why": "Narrow margins fit more books on each page.", "task": "Set Catalog's margins to Narrow.", "steps": ["Choose [[Page Layout > Margins > Narrow]]."]}, {"t": "Header and page numbers", "why": "Loose pages get shuffled. Page 3 of 5 tells you where each one goes.", "task": "Give Catalog a header that says Bayside Books Spring Catalog, and a footer showing Page 1 of ? (the page number and the number of pages).", "steps": ["Choose [[File > Page Setup]] and click the Header/Footer tab.", "Click Customize Header, type Bayside Books Spring Catalog in the center section, and click OK.", "Open the Footer menu and pick Page 1 of ?. Click OK."]}, {"t": "Fit all columns on one page", "why": "The last column spills onto its own pages. Scaling fixes the width and lets the length run as long as it needs.", "task": "Scale Catalog to fit 1 page wide, with the height left automatic.", "steps": ["On the Page Layout tab, set Width to 1 page and leave Height on Automatic."], "trap": "Setting the height to 1 page squeezes 120 rows onto one sheet of paper. Leave it on Automatic."}, {"t": "Insert a manual page break", "why": "The Authors list should split between A to L and M to Z.", "task": "On the Authors sheet, insert a page break above row 41.", "steps": ["On Authors, click the row 41 header.", "Choose [[Page Layout > Breaks > Insert Page Break]]."], "tip": "Manual breaks are ignored when a sheet is scaled to fit, which is why this one goes on Authors and not Catalog."}, {"t": "Print the gridlines", "why": "The counter staff read across long rows, and gridlines keep their eyes on the right book.", "task": "Turn on Print for gridlines on the Catalog sheet.", "steps": ["Click the Catalog tab.", "On the Page Layout tab, under Gridlines, check Print."]}, {"t": "Page Layout view", "why": "Page Layout view shows the margins, header, and footer exactly as they'll print.", "task": "Switch the Catalog sheet to Page Layout view and save it that way.", "steps": ["Click the Catalog tab and choose [[View > Page Layout]].", "Scroll to check the header and footer, then save."]}, {"t": "Set the file title", "why": "The file title shows in search and in the printout's properties.", "task": "Set the workbook's Title property to Spring Catalog.", "steps": ["Choose [[File > Properties]] and click the Summary tab.", "Type Spring Catalog in Title and click OK."]}]}, {"id": "E-3", "world": "E", "track": "tosa", "name": "Lockdown Lighthouse", "domain": "Environment: protection, names, links, notes", "exam": "TOSA Environment & Methods · Advanced band (726-875)", "band": "Advanced", "scenario": "Bay Fitness", "story": "The front desk uses this workbook to sign up new members, and twice this month someone typed over a price formula. The manager wants the inputs open, everything else locked, the admin sheet out of sight, and clear help for the staff.", "goal": "A safe signup workbook: inputs unlocked and the sheet protected, help messages and a note for staff, a named rate table, a typo fixed everywhere, a hyperlink to the rates, a hidden admin sheet, and a protected structure.", "files": [["TE-3_Bay_Fitness_Signup.xlsx", "Practice workbook"]], "items": ["Unlock cells", "Input messages", "Notes", "Protect Sheet", "Named ranges", "Find and Replace", "Hyperlinks", "Hide sheets", "Protect Workbook"], "quests": [{"t": "Unlock the input cells", "why": "Protection only blocks locked cells. Every cell starts locked, so the inputs have to be unlocked first.", "task": "Unlock Signup!B3:B8.", "steps": ["Select Signup!B3:B8 and press {{Cmd+1}}.", "On the Protection tab, uncheck Locked and click OK."]}, {"t": "Add an input message", "why": "New staff don't know what Plan wants. A message that pops up when they click the cell helps.", "task": "Add an input message to the existing validation on Signup!B5. Title: Plan. Message: Choose Basic, Plus, or Premium.", "steps": ["Click Signup!B5 and choose [[Data > Data Validation]].", "On the Input Message tab, check Show input message when cell is selected.", "Type the title Plan and the message Choose Basic, Plus, or Premium. Click OK."]}, {"t": "Leave a note", "why": "Staff keep asking whether the start date can be in the past.", "task": "Add a note to Signup!B7 that says Start date can't be before today.", "steps": ["Click Signup!B7 and choose [[Review > Notes > New Note]] (or right-click and choose New Note).", "Type Start date can't be before today, then click outside the note."], "tip": "Add notes before you protect the sheet. Protection blocks new notes."}, {"t": "Protect the signup sheet", "why": "Now the formulas are safe and only the input cells can be typed in.", "task": "Protect the Signup sheet (a password is optional).", "steps": ["Click the Signup tab and choose [[Review > Protect Sheet]].", "Leave the default options checked and click OK.", "Try typing in B10. Excel should block it."]}, {"t": "Name the rate table", "why": "PlanRates is easier to read in a formula than Rates!$A$2:$B$5.", "task": "Name Rates!A2:B5 PlanRates.", "steps": ["Select Rates!A2:B5.", "Click the Name Box (left of the formula bar), type PlanRates, and press {{Return}}."]}, {"t": "Fix a typo everywhere", "why": "Premium is misspelled as Premuim all over the Rates sheet, so lookups for Premium fail.", "task": "On the Rates sheet, replace every Premuim with Premium.", "steps": ["Click the Rates tab.", "Press {{Ctrl+H}} (or [[Edit > Find > Replace]]).", "Find what: Premuim. Replace with: Premium. Click Replace All."], "trap": "Run it from the Rates sheet. The Signup sheet is protected now, and a search that reaches it can stop with a protection warning."}, {"t": "Link to the rates", "why": "Staff should jump to the rates with one click.", "task": "In Links!A2, add a hyperlink that goes to cell A1 on the Rates sheet. Display text: See plan rates.", "steps": ["Click Links!A2 and press {{Cmd+K}}.", "Choose This Document. Pick Rates and type A1 as the cell reference.", "Set Display to See plan rates and click OK."]}, {"t": "Hide the admin sheet", "why": "Admin holds staff discount codes. The front desk doesn't need to see it.", "task": "Hide the Admin sheet.", "steps": ["Right-click the Admin tab and choose Hide."]}, {"t": "Protect the workbook structure", "why": "Without structure protection, anyone can right-click and unhide Admin.", "task": "Protect the workbook structure (a password is optional).", "steps": ["Choose [[Review > Protect Workbook]].", "Check Structure and click OK.", "Right-click a tab. Unhide, Delete, and Rename should be grayed out."], "tip": "Protect Sheet guards cells. Protect Workbook guards the sheets themselves: adding, deleting, renaming, hiding, and unhiding."}]}, {"id": "E-4", "world": "E", "track": "tosa", "name": "Macro Mountain", "domain": "Environment: macros, buttons, accessibility", "exam": "TOSA Environment & Methods · Expert band (876-1000)", "band": "Expert", "scenario": "Coconut Grove Concert Series", "story": "Every month the box office formats a new sales sheet by hand, the same way, for 20 minutes. The manager wants it done with one button. The city's grant also requires that the workbook pass an accessibility check.", "goal": "An automated, accessible workbook: a recorded FormatReport macro, run on March, attached to a button, saved as .xlsm, plus alt text on the chart, an unmerged title, and a descriptive table name.", "files": [["TE-4_Concert_Box_Office.xlsx", "Practice workbook"]], "items": ["Developer tab", "Record Macro", "Run a macro", "Form control buttons", "Assign Macro", ".xlsm", "Alt text", "Merged cells", "Table names", "Check Accessibility"], "quests": [{"t": "Show the Developer tab", "note": true, "why": "Recording macros and adding buttons live on the Developer tab, which is off by default.", "task": "Turn on the Developer tab.", "steps": ["Choose [[Excel > Settings]] (or Preferences) and click Ribbon & Toolbar.", "Under Main Tabs, check Developer and click Save."]}, {"t": "Record the FormatReport macro", "why": "Record the steps once, then replay them on every new month.", "task": "On the Feb sheet, record a macro named FormatReport, stored in This Workbook, that makes A1:E1 bold and formats C2:D21 as Currency. Then save as an Excel Macro-Enabled Workbook (.xlsm).", "steps": ["Click the Feb tab before you start recording.", "Choose [[Developer > Record Macro]]. Name: FormatReport. Store macro in: This Workbook. Click OK.", "Select A1:E1 and press {{Cmd+B}}. Select C2:D21 and choose Currency from the Number Format box.", "Choose [[Developer > Stop Recording]].", "Choose [[File > Save As]], set File Format to Excel Macro-Enabled Workbook (.xlsm), and click Save."], "trap": "Don't click other sheet tabs while recording. The macro would record the click and always jump to that sheet."}, {"t": "Run the macro on March", "why": "This is the payoff: the same 20 minutes of formatting in one second.", "task": "Run FormatReport on the Mar sheet.", "steps": ["Click the Mar tab.", "Choose [[Developer > Macros]], select FormatReport, and click Run.", "Mar's header is bold and its prices are currency."]}, {"t": "Add a button for the macro", "why": "Box office staff shouldn't have to dig through menus. A button on the sheet runs it.", "task": "On the Mar sheet, add a Button (form control) assigned to FormatReport.", "steps": ["On Mar, choose [[Developer > Button]] and drag a button out to the right of the data.", "In Assign Macro, pick FormatReport and click OK.", "Right-click the button, choose Edit Text, and type Format this month. Save the .xlsm."], "tip": "Turn in the .xlsm file. A plain .xlsx can't hold macros."}, {"t": "Add alt text to the chart", "why": "A screen reader can't see a chart. Alt text says what it shows.", "task": "Give the chart on the Summary sheet alt text that describes it (at least a few words).", "steps": ["Right-click the chart's border on Summary and choose Edit Alt Text.", "Type a description, like Column chart of ticket sales by month, January to March."]}, {"t": "Unmerge the title", "why": "Merged cells confuse screen readers and break sorting. Accessibility checks flag them.", "task": "Unmerge Summary!A1:F1, keeping the title in A1.", "steps": ["Click Summary!A1 and choose [[Home > Merge & Center]] to turn it off (or [[Home > Merge & Center > Unmerge Cells]]).", "Optional: select A1:F1, press {{Cmd+1}}, and on the Alignment tab choose Center Across Selection. It looks the same, with no merge."]}, {"t": "Give the table a real name", "why": "Table1 tells a screen-reader user nothing. tblShows says what's inside.", "task": "Rename the table on the Shows sheet from Table1 to tblShows.", "steps": ["Click in the table on Shows.", "On the Table tab, type tblShows in the Table Name box and press {{Return}}."]}, {"t": "Run the accessibility check", "note": true, "why": "Check Accessibility lists everything a screen-reader user would trip over, with a fix for each one.", "task": "Run Check Accessibility and fix anything it still finds.", "steps": ["Choose [[Review > Check Accessibility]].", "Click each item in the Accessibility pane to see why it matters and how to fix it."]}]}, {"id": "F-1", "world": "F", "track": "tosa", "name": "Sum Street", "domain": "Functions: calculation basics", "exam": "TOSA Functions · Basic band (351-550)", "band": "Basic", "scenario": "Café Cubano Coffee Co.", "story": "The café just hired Yami as a weekend shift lead. Every night she closes out the register by hand, and it takes forever. The owner wants a weekly sheet that adds itself up, so Yami only types the day's numbers.", "goal": "A self-totaling weekly closeout: daily totals, profit and sales tax, a week-total row, a Closeout summary with the best and slowest days, goal flags, and a tip pool that works again.", "files": [["TF-1_Cafe_Cubano_Closeout.xlsx", "Practice workbook"]], "items": ["Enter values", "+ - * /", "SUM", "Copy formulas", "Relative refs", "AVERAGE", "MAX", "MIN", "COUNT", "IF", "#NAME?", "#DIV/0!", "####"], "quests": [{"t": "Enter the missing day", "why": "Sunday's register tape is still in the drawer. Every total in the workbook is short until Sunday is typed in.", "task": "On the Week sheet, type Sunday's sales into C10:F10: Coffee 412, Pastries 236, Sandwiches 318, Drinks 154.", "steps": ["Click the Week tab, then click C10.", "Type 412 and press {{Tab}} to move right. Type 236, {{Tab}}, 318, {{Tab}}, 154, and press {{Return}}."], "tip": "{{Tab}} moves right and {{Return}} moves down. Typing a row with {{Tab}} and finishing with {{Return}} jumps back to the start of the next row.", "trap": "Type only the number. A typed $ or comma is fine, but a space or the letter O instead of a zero turns the cell into text, and SUM skips text."}, {"t": "Add a row with SUM", "why": "Total Sales is the number the owner checks first every morning.", "task": "In Week!G4, add up Monday's four sales columns (C4:F4) with SUM. Copy the formula down to G10.", "steps": ["Click G4 and type `=SUM(C4:F4)`, then press {{Return}}.", "Click G4 again. Drag the fill handle (the small square at the bottom right of the cell) down to G10."], "tip": "[[Home > AutoSum]] (the Σ button) writes the SUM for you. Check that it picked C4:F4 before you press {{Return}}.", "answer": "`=SUM(C4:F4)`. In G10 it becomes `=SUM(C10:F10)` on its own."}, {"t": "Subtract and multiply", "why": "Sales aren't profit. The owner also has to set aside 7% sales tax for the state every week.", "task": "On the Week sheet, fill Profit (I4:I10) with Total Sales minus Expenses, and Sales Tax (J4:J10) with Total Sales times 0.07.", "steps": ["In I4 type `=G4-H4` and press {{Return}}.", "In J4 type `=G4*0.07` and press {{Return}}.", "Select I4:J4 and drag the fill handle down to row 10."], "tip": "Excel's math symbols: + add, - subtract, * multiply, / divide, ^ power. Excel does * and / before + and -, so use parentheses when you need a different order.", "answer": "`=G4-H4` and `=G4*0.07`"}, {"t": "Copy a formula across", "why": "The Week Total row is what Yami reads to the owner over the phone.", "task": "In Week!C11, total the Coffee column (C4:C10) with SUM. Copy the formula to the right through J11.", "steps": ["Click C11 and type `=SUM(C4:C10)`, then press {{Return}}.", "Click C11 and drag the fill handle right to J11.", "Click E11 and look at the formula bar. It says `=SUM(E4:E10)`. The column letter moved with the copy."], "tip": "This is a relative reference: when you copy a formula, its cell addresses shift by the same amount you moved it. That's why one formula can fill a whole row.", "answer": "`=SUM(C4:C10)`, copied to J11"}, {"t": "AVERAGE, MAX, and MIN", "why": "The owner plans staffing around the typical day, the busiest day, and the slowest day.", "task": "On the Closeout sheet, show the average daily sales (B3), the best day's sales (B4), and the slowest day's sales (B5), all from Week!G4:G10.", "steps": ["Click the Closeout tab.", "B3: `=AVERAGE(Week!G4:G10)`", "B4: `=MAX(Week!G4:G10)`", "B5: `=MIN(Week!G4:G10)`"], "tip": "You can type the range or click over to the Week sheet and drag across G4:G10 while you're in the middle of the formula. Excel writes Week! for you."}, {"t": "COUNT the days", "why": "B7 is a check on the average, and right now it shows #DIV/0!. That error means the formula divides by zero or by an empty cell, here B6.", "task": "In Closeout!B6, count how many days have a number in Week!G4:G10.", "steps": ["Click Closeout!B6 and type `=COUNT(Week!G4:G10)`.", "Look at B7. The #DIV/0! is gone, and B7 matches the average in B3."], "tip": "COUNT counts cells that hold numbers. COUNTA counts every cell that isn't empty, text included.", "answer": "`=COUNT(Week!G4:G10)` returns 7."}, {"t": "Flag the goal with IF", "why": "The café's daily goal is $600. The owner wants every day marked so she can see the pattern at a glance.", "task": "In Week!K4:K10, show Goal if Total Sales is 600 or more and Below if it isn't.", "steps": ["In K4 type `=IF(G4>=600,\"Goal\",\"Below\")` and press {{Return}}.", "Fill K4 down to K10.", "Check the Closeout sheet. Days that hit the goal and the Verdict fill in."], "tip": "IF has three parts: the test, what to show if the test is TRUE, and what to show if it's FALSE. Words go in \"quotes\". Numbers don't.", "trap": "Use >= (greater than or equal to). With > alone, a day of exactly $600 would show Below.", "answer": "`=IF(G4>=600,\"Goal\",\"Below\")`"}, {"t": "Fix a #NAME? error", "why": "The tip pool splits tips by hours worked. Nobody has been paid correctly since someone typed the total-hours formula wrong.", "task": "On the Tips sheet, B10 shows #NAME?. Fix the formula so it adds up the hours in B4:B7.", "steps": ["Click Tips!B10 and look at the formula bar: `=SUMM(B4:B7)`.", "#NAME? means Excel doesn't recognize a name in the formula. SUMM isn't a function.", "Retype it as `=SUM(B4:B7)` and press {{Return}}.", "Tips per hour (B11) and every share in column C fill in."], "answer": "`=SUM(B4:B7)`"}, {"t": "Fix the #### column", "why": "Yami prints the Week sheet for the owner, and the dates column prints as ####.", "task": "Widen Week column B so the dates show instead of ####.", "steps": ["Point at the line between the B and C column headers until the cursor turns into a double arrow.", "Double-click to AutoFit column B. The dates appear, like Monday, March 2."], "trap": "#### isn't an error in the data. The column is just too narrow for the value. Don't retype the dates."}]}, {"id": "F-2", "world": "F", "track": "tosa", "name": "Logic Lagoon", "domain": "Functions: logic, dates, and lookups", "exam": "TOSA Functions · Productive band (551-725)", "band": "Productive", "scenario": "Sunshine Surf Rentals", "story": "Every board rental comes with a $100 deposit. Staff keep arguing about who gets their deposit back, and late fees get forgotten. The owner wants the workbook to make the call for every rental.", "goal": "A deposit and late-return tracker: real dates from the booking app, due dates, rates and late fees looked up from the rate card, an automatic Refund or Hold decision, a call list, and a dashboard that counts it all.", "files": [["TF-2_Surf_Rentals_Deposits.xlsx", "Practice workbook"]], "items": ["DATE", "Date math", "VLOOKUP", "$Absolute refs", "Nested IF", "INDEX/MATCH", "AND", "OR", "NOT", "TODAY", "YEAR", "COUNTA", "COUNT", "SUM/AVERAGE/MAX"], "quests": [{"t": "Build dates with DATE", "why": "The booking app exports the year, month, and day in separate columns. Excel can't do date math until they're one real date.", "task": "On the Rentals sheet, fill Start Date (G2:G41) with a real date built from Year (D), Month (E), and Day (F).", "steps": ["In G2 type `=DATE(D2,E2,F2)` and press {{Return}}. It shows 3/2/2026 (or similar).", "Double-click the fill handle on G2 to fill down to G41."], "tip": "Excel stores every date as a number: days since January 1, 1900. That's why you can add and subtract dates.", "answer": "`=DATE(D2,E2,F2)`"}, {"t": "Calculate due dates", "why": "A board is late if it comes back after its due date, so every rental needs one.", "task": "Fill Due Date (I2:I41) with Start Date plus Days.", "steps": ["In I2 type `=G2+H2` and fill down to I41.", "If you see numbers like 46087 instead of dates, select I2:I41 and choose Short Date from the Number Format box on the Home tab."], "answer": "`=G2+H2`"}, {"t": "Look up the rate with an absolute range", "why": "Rates live in one place, the Rates sheet. When the owner changes a price, every rental should update.", "task": "Fill Daily Rate (L2:L41) by looking up the Board Type in Rates!A2:C7 with VLOOKUP and an exact match. Then fill Rental Cost (M2:M41) with Days times Daily Rate.", "steps": ["In L2 type `=VLOOKUP(C2,Rates!$A$2:$C$7,2,FALSE)`.", "In M2 type `=H2*L2`.", "Select L2:M2 and double-click the fill handle."], "tip": "The $ signs lock the rate table so it doesn't slide down as you fill. Press {{Cmd+T}} while the cursor is in a reference to add them.", "trap": "Without the $ signs, row 41's formula would look in Rates!A41:C46, which is empty, and return #N/A.", "answer": "`=VLOOKUP(C2,Rates!$A$2:$C$7,2,FALSE)` and `=H2*L2`"}, {"t": "Days late with a nested IF", "why": "Late fees are charged per day. Boards still out (no Returned date) aren't charged yet.", "task": "Fill Days Late (N2:N41): 0 if Returned (J) is blank, otherwise Returned minus Due Date if it came back late, otherwise 0.", "steps": ["In N2 type `=IF(J2=\"\",0,IF(J2>I2,J2-I2,0))`.", "Fill down to N41. If you see dates, change the format to General."], "tip": "A nested IF is an IF inside another IF. Read it from the outside in: first is it blank, then is it late.", "answer": "`=IF(J2=\"\",0,IF(J2>I2,J2-I2,0))`"}, {"t": "Late fees with INDEX and MATCH", "why": "Each board type has its own late fee per day, in column C of the rate card.", "task": "Fill Late Fee (O2:O41) with Days Late times the board type's late fee, found with INDEX and MATCH on the Rates sheet.", "steps": ["In O2 type `=N2*INDEX(Rates!$C$2:$C$7,MATCH(C2,Rates!$A$2:$A$7,0))`.", "Fill down to O41."], "tip": "MATCH finds the position of the board type in the list (the 0 means exact). INDEX returns the item at that position from the late-fee column.", "answer": "`=N2*INDEX(Rates!$C$2:$C$7,MATCH(C2,Rates!$A$2:$A$7,0))`"}, {"t": "Refund or Hold with AND and NOT", "why": "This is the rule staff kept arguing about. A deposit comes back only if the board was returned, on time, and NOT damaged.", "task": "Fill Deposit (P2:P41) with Refund when Returned isn't blank AND Days Late is 0 AND Damage is NOT Y. Otherwise show Hold.", "steps": ["In P2 type `=IF(AND(J2<>\"\",N2=0,NOT(K2=\"Y\")),\"Refund\",\"Hold\")`.", "Fill down to P41."], "tip": "<> means not equal. J2<>\"\" means J2 isn't blank.", "answer": "`=IF(AND(J2<>\"\",N2=0,NOT(K2=\"Y\")),\"Refund\",\"Hold\")`"}, {"t": "Build a call list with OR", "why": "The owner calls every customer who damaged a board or kept it 3 or more days late.", "task": "Fill Follow-up (Q2:Q41) with Call if Damage is Y OR Days Late is 3 or more. Otherwise show OK.", "steps": ["In Q2 type `=IF(OR(K2=\"Y\",N2>=3),\"Call\",\"OK\")`.", "Fill down to Q41."], "tip": "AND needs every test to be TRUE. OR needs just one.", "answer": "`=IF(OR(K2=\"Y\",N2>=3),\"Call\",\"OK\")`"}, {"t": "Stamp the date with TODAY and YEAR", "why": "The dashboard gets printed and pinned up, so it needs a date stamp and the season year.", "task": "On the Dashboard sheet, show today's date in B3 with TODAY, and the year of that date in B4 with YEAR.", "steps": ["B3: `=TODAY()`", "B4: `=YEAR(B3)`"], "tip": "TODAY updates every time the workbook recalculates, so tomorrow it shows tomorrow's date. To type a fixed date instead, press {{Ctrl+;}}. ({{Cmd+;}} types the current time.)", "trap": "TODAY has empty parentheses, but you still have to type them."}, {"t": "COUNTA and COUNT", "why": "The owner wants to know how many rentals were logged and how many boards came back. The dashboard works out how many are still out.", "task": "On the Dashboard sheet, count every rental ID in Rentals!A2:A41 in B6 (COUNTA), and count the returned dates in Rentals!J2:J41 in B7 (COUNT).", "steps": ["B6: `=COUNTA(Rentals!A2:A41)`", "B7: `=COUNT(Rentals!J2:J41)`", "B8 (Boards still out) now fills in."], "trap": "The rental IDs are text, so COUNT would return 0. COUNT only counts numbers, and dates are numbers."}, {"t": "Season stats", "why": "These four numbers go into the owner's end-of-season report.", "task": "On the Dashboard sheet: B10 = total Rental Cost (Rentals!M2:M41), B11 = total Late Fee (O2:O41), B12 = average rental length in Days (H2:H41), B13 = the longest delay in Days Late (N2:N41).", "steps": ["B10: `=SUM(Rentals!M2:M41)`", "B11: `=SUM(Rentals!O2:O41)`", "B12: `=AVERAGE(Rentals!H2:H41)`", "B13: `=MAX(Rentals!N2:N41)`"]}]}, {"id": "F-3", "world": "F", "track": "tosa", "name": "Lookup Library", "domain": "Functions: text, dates, and lookups", "exam": "TOSA Functions · Advanced band (726-875)", "band": "Advanced", "scenario": "Bayside Books", "story": "A supplier just sent a shipment and an import file to match. The codes are in the supplier's format, the dates came through as text, and the prices have too many decimals. The new website needs it all cleaned up before Friday.", "goal": "A website-ready import: new store SKUs, genre names, real received dates and return deadlines, rounded sale prices, a check on the SKUs staff typed by hand, a working price lookup, and a sorted genre list.", "files": [["TF-3_Bayside_Books_Import.xlsx", "Practice workbook"]], "items": ["REPLACE", "MID", "HLOOKUP", "DATEVALUE", "MONTH", "DAY", "EDATE", "ROUND", "INT", "EXACT", "INDEX/MATCH", "Fix #N/A", "SORT", "UNIQUE"], "quests": [{"t": "Swap a prefix with REPLACE", "why": "The supplier's codes start with SPX. The store's system needs the same code starting with BAY.", "task": "On the Import sheet, fill New SKU (H2:H31) by replacing the first 3 characters of the Supplier Code (A) with BAY.", "steps": ["In H2 type `=REPLACE(A2,1,3,\"BAY\")`. SPX-FIC-0153 becomes BAY-FIC-0153.", "Double-click the fill handle to fill down to H31."], "tip": "REPLACE(text, start, how many characters, new text). Its cousin SUBSTITUTE swaps by matching text instead of by position.", "answer": "`=REPLACE(A2,1,3,\"BAY\")`"}, {"t": "Pull the genre code with MID", "why": "The 3 letters in the middle of the code are the genre. The website menu is built from them.", "task": "Fill Genre Code (I2:I31) with the 3 characters that start at position 5 of the Supplier Code.", "steps": ["In I2 type `=MID(A2,5,3)`.", "Fill down to I31."], "answer": "`=MID(A2,5,3)` returns FIC from SPX-FIC-0153."}, {"t": "Genre names with HLOOKUP", "why": "Customers don't know what FAN means. The website shows the full genre name.", "task": "Fill Genre (J2:J31) by looking up the Genre Code in the horizontal table Genres!B1:G3. Return the name from row 2, with an exact match.", "steps": ["In J2 type `=HLOOKUP(I2,Genres!$B$1:$G$3,2,FALSE)`.", "Fill down to J31."], "tip": "VLOOKUP searches down the first column. HLOOKUP searches across the first row. XLOOKUP can do both.", "answer": "`=HLOOKUP(I2,Genres!$B$1:$G$3,2,FALSE)`"}, {"t": "Turn text into dates with DATEVALUE", "why": "The Received column came in as text like 2026-03-14. Text can't be sorted by date or used in date math.", "task": "Fill Received Date (K2:K31) by converting the text in F with DATEVALUE. Format K2:K31 as Short Date.", "steps": ["In K2 type `=DATEVALUE(F2)`. You'll see a number like 46095. That's the date's serial number.", "Fill down to K31.", "Select K2:K31 and choose Short Date from the Number Format box on the Home tab."], "trap": "Text dates sit on the left side of the cell. Real dates sit on the right. That's a quick way to spot text pretending to be a date.", "answer": "`=DATEVALUE(F2)`"}, {"t": "Split dates with MONTH and DAY", "why": "The website groups new arrivals by month, and the store's display shows the day each book arrived.", "task": "Fill Month (L2:L31) and Day (M2:M31) from the Received Date in K.", "steps": ["L2: `=MONTH(K2)`", "M2: `=DAY(K2)`", "Select L2:M2 and fill down to row 31. If you see dates, change the format to General."]}, {"t": "Return deadlines with EDATE", "why": "Unsold books can go back to the supplier for 3 months after they arrive.", "task": "Fill Return By (N2:N31) with the date 3 months after the Received Date. Format it as Short Date.", "steps": ["In N2 type `=EDATE(K2,3)` and fill down to N31.", "Format N2:N31 as Short Date."], "tip": "EDATE adds whole months and handles short months for you. Adding 90 days would land on the wrong day.", "answer": "`=EDATE(K2,3)`"}, {"t": "Clean prices with ROUND and INT", "why": "The website needs the sale price rounded to cents. The newsletter ads say from $14, using whole dollars only.", "task": "Fill Sale Price (O2:O31) with List Price times (1 minus Discount), rounded to 2 decimals. Fill Ad Price (P2:P31) with the whole-dollar part of the Sale Price.", "steps": ["O2: `=ROUND(D2*(1-E2),2)`", "P2: `=INT(O2)`", "Select O2:P2 and fill down to row 31."], "trap": "Formatting a cell to 2 decimals only hides the extra digits. ROUND actually changes the value. The exam tests the difference.", "answer": "`=ROUND(D2*(1-E2),2)` and `=INT(O2)`. INT always rounds down, so 14.99 becomes 14."}, {"t": "Check typed SKUs with EXACT", "why": "Staff typed the new SKUs by hand into the old system. The website is case-sensitive, so bay-fic-0153 won't match BAY-FIC-0153.", "task": "Fill SKU OK? (Q2:Q31) with TRUE when the Staff SKU (G) matches the New SKU (H) exactly, capital letters included.", "steps": ["In Q2 type `=EXACT(G2,H2)` and fill down to Q31.", "The Summary sheet now counts the SKUs staff need to retype."], "trap": "A plain =G2=H2 ignores capital letters and says TRUE for bay-fic-0153. Only EXACT checks case.", "answer": "`=EXACT(G2,H2)`"}, {"t": "Repair a lookup with INDEX and MATCH", "why": "The counter's price lookup shows #N/A. The old VLOOKUP searches for a title in column A, but the titles are in column B. VLOOKUP can only search the first column of its range.", "task": "On the Lookup sheet, replace the formula in B3 with INDEX and MATCH so it returns the Sale Price (Import!O2:O31) for the title in B2. Then fill B4 with the Return By date (Import!N2:N31) the same way.", "steps": ["Click Lookup!B3. Delete the old formula and type `=INDEX(Import!$O$2:$O$31,MATCH($B$2,Import!$B$2:$B$31,0))`.", "In B4 type `=INDEX(Import!$N$2:$N$31,MATCH($B$2,Import!$B$2:$B$31,0))` and format it as Short Date.", "Type a different title from the Import sheet into B2 to test it."], "tip": "#N/A means the lookup couldn't find what it was looking for. Check the lookup value and which column it searches.", "answer": "`=INDEX(Import!$O$2:$O$31,MATCH($B$2,Import!$B$2:$B$31,0))`"}, {"t": "A sorted list with SORT and UNIQUE", "why": "The website's genre menu should list each genre code in this shipment once, in A to Z order, and update itself next shipment.", "task": "In Genres!A7, list each Genre Code from Import!I2:I31 once, sorted A to Z, with one formula.", "steps": ["Click Genres!A7 and type `=SORT(UNIQUE(Import!I2:I31))`.", "The results spill down from A7. A blue border marks the spill range."], "tip": "This is a dynamic array. One formula fills many cells, and the list grows or shrinks when the data changes.", "trap": "#SPILL! means something is in the way of the output. Clear the cells below A7.", "answer": "`=SORT(UNIQUE(Import!I2:I31))`"}]}, {"id": "F-4", "world": "F", "track": "tosa", "name": "Database Dunes", "domain": "Functions: conditional and database analysis", "exam": "TOSA Functions · Advanced band (726-875)", "band": "Advanced", "scenario": "Biscayne Bay Fitness", "story": "The owner presents to her investors next week. They want to know who the members are, what they're worth, and whether the gym's own report can be trusted. She also promised a free month to one random member.", "goal": "An investor-ready analytics sheet: plan counts, lifetime revenue, database-function totals driven by a criteria box, cost per class, a fixed report with documented formulas, a coach-filtered subtotal, and a random raffle draw.", "files": [["TF-4_Bay_Fitness_Analytics.xlsx", "Practice workbook"]], "items": ["COUNTIF", "COUNTIFS", "MID", "LET", "SUMPRODUCT", "Notes", "DSUM", "DCOUNT", "Criteria ranges", "Fix formulas", "SUBTOTAL", "Filter", "RAND"], "quests": [{"t": "Count with COUNTIF", "why": "Investors ask first how many members are on the top plan.", "task": "In Analytics!B3, count the members on the Premium plan (Members!C2:C81).", "steps": ["Click Analytics!B3 and type `=COUNTIF(Members!C2:C81,\"Premium\")`."], "answer": "`=COUNTIF(Members!C2:C81,\"Premium\")`"}, {"t": "Two conditions with COUNTIFS", "why": "Paused members don't pay. The real number is Premium members who are also Active.", "task": "In Analytics!B4, count members whose Plan is Premium AND whose Status (Members!H2:H81) is Active.", "steps": ["B4: `=COUNTIFS(Members!C2:C81,\"Premium\",Members!H2:H81,\"Active\")`"], "tip": "COUNTIFS takes range, criteria pairs. Every pair has to be true for a row to count."}, {"t": "Join year with MID", "why": "Member IDs look like BBF-2023-0412. The 4 digits in the middle are the year they joined, and the report counts 2025 joiners.", "task": "Fill Join Year (Members!I2:I81) with the 4 characters that start at position 5 of the Member ID.", "steps": ["In Members!I2 type `=MID(A2,5,4)`.", "Double-click the fill handle to fill down to I81.", "Check Analytics!B8. Members who joined in 2025 now has a count."], "answer": "`=MID(A2,5,4)`"}, {"t": "Cost per class with LET", "why": "Investors want to know what a class costs each member. A member who takes 0 classes would cause a #DIV/0! error.", "task": "Fill Cost per Class (Members!J2:J81) using LET: name the fee (E) fee and the classes per month (G) cls, then return 0 if cls is 0, otherwise fee divided by cls. Format the column as Currency.", "steps": ["In J2 type `=LET(fee,E2,cls,G2,IF(cls=0,0,fee/cls))`.", "Fill down to J81 and apply Currency from the Number Format box."], "tip": "LET gives a value a name you can reuse. Long formulas are easier to read, and Excel works out each named value only once.", "answer": "`=LET(fee,E2,cls,G2,IF(cls=0,0,fee/cls))`"}, {"t": "Lifetime revenue with SUMPRODUCT", "why": "The headline number for investors is how much the current members have paid in total.", "task": "In Analytics!B5, multiply each member's Monthly Fee (E2:E81) by their Months Active (F2:F81) and add up all the results, in one formula.", "steps": ["B5: `=SUMPRODUCT(Members!E2:E81,Members!F2:F81)`"], "tip": "SUMPRODUCT multiplies the ranges row by row, then adds up the products. Without it you'd need a helper column.", "answer": "`=SUMPRODUCT(Members!E2:E81,Members!F2:F81)`"}, {"t": "Document a formula with a note", "why": "An investor will hover over the big number and ask how it was calculated.", "task": "Add a note to Analytics!B5 that says: Monthly fee times months active, added up for every member.", "steps": ["Right-click Analytics!B5 and choose New Note.", "Type the sentence and click outside the note. A red triangle marks the cell."], "tip": "On Mac, a Note is the classic yellow sticky note. A Comment is a threaded conversation. For documenting a formula, use a Note."}, {"t": "DSUM and DCOUNT with a criteria range", "why": "The owner wants a what-if box. She types any plan and status, and the totals update without anyone editing a formula.", "task": "On the Criteria sheet, type Plus in A2 and Active in B2. Then in Analytics!B6 use DSUM to total Monthly Fee for the rows that match, and in B7 use DCOUNT to count them (count the Classes/Month field).", "steps": ["On Criteria, type Plus in A2 and Active in B2. The headers in row 1 already match the Members headers.", "Analytics!B6: `=DSUM(Members!A1:J81,\"Monthly Fee\",Criteria!A1:B2)`", "Analytics!B7: `=DCOUNT(Members!A1:J81,\"Classes/Month\",Criteria!A1:B2)`", "Try it: change Criteria!A2 to Basic and watch B6 and B7 change. Set it back to Plus."], "tip": "Database functions take the whole table (headers included), the column to add or count, and a criteria range. Criteria on the same row mean AND. Criteria on separate rows mean OR.", "trap": "The criteria headers must match the table headers exactly, spaces and all."}, {"t": "Repair the report", "why": "Two numbers in the old report are wrong, and the investors would catch it.", "task": "Fix Analytics!B10 so the average fee includes every member (E2:E81). Fix Analytics!B11 so the Active rate divides by the members only (H2:H81), not the header.", "steps": ["Click B10. The formula averages E2:E80, so the last member is missing. Change it to `=AVERAGE(Members!E2:E81)`.", "Click B11. COUNTA(Members!H1:H81) counts the header too, so it divides by 81. Change it to `=COUNTIF(Members!H2:H81,\"Active\")/COUNTA(Members!H2:H81)`."], "tip": "Click a formula cell and click into the formula bar. Excel outlines each range in color on the sheet, which makes a range that's one row short easy to spot.", "trap": "These formulas don't show an error. They just give a slightly wrong answer, which is more dangerous."}, {"t": "SUBTOTAL with a filter", "why": "Each coach gets a bonus based on their members' fees. SUM would add every member. SUBTOTAL adds only the rows you can see.", "task": "In Members!E82, total Monthly Fee (E2:E81) with SUBTOTAL function 9. Then filter the Members sheet so only Coach Victor's members show.", "steps": ["Members!E82: `=SUBTOTAL(9,E2:E81)`", "Click the filter arrow on the Coach header (D1), uncheck Select All, check Victor, and apply.", "E82 now shows Victor's total only. Leave the filter on."], "tip": "SUBTOTAL's first argument picks the math: 9 is SUM, 1 is AVERAGE, 2 is COUNT. Add 100 (109, 101) to also skip rows you hid by hand.", "answer": "`=SUBTOTAL(9,E2:E81)`"}, {"t": "Draw a winner with RAND", "why": "One member wins a free month. A random key for every member makes the draw fair.", "task": "On the Raffle sheet, fill Random Key (B2:B81) with RAND.", "steps": ["In Raffle!B2 type `=RAND()` and fill down to B81.", "Analytics!B13 shows the member with the highest key.", "Press {{Cmd+=}} to draw again. Every recalculation gives new keys."], "tip": "RAND returns a random decimal between 0 and 1. RANDBETWEEN(1,100) returns a whole number in a range."}]}, {"id": "F-5", "world": "F", "track": "tosa", "name": "Finance Fortress", "domain": "Functions: finance, scheduling, and advanced references", "exam": "TOSA Functions · Expert band (876-1000)", "band": "Expert", "scenario": "Everglades Eco Tours", "story": "The owner wants to buy a second airboat and launch a night gator tour. Before she signs anything, she wants the loan math, a check on the dealer's offer, a payoff test for the new tour, and a training schedule for her guides.", "goal": "An expansion decision workbook: named loan inputs, the bank payment, the dealer's real APR, the night tour's NPV, guide seniority and training schedules, a two-way price lookup, a rolling three-month revenue window, and one formula that makes the final call.", "files": [["TF-5_Eco_Tours_Expansion.xlsx", "Practice workbook"]], "items": ["Named ranges", "PMT", "RATE", "NPV", "DATEDIF", "NETWORKDAYS", "WORKDAY", "2-way INDEX/MATCH", "OFFSET", "Combined formulas"], "quests": [{"t": "Name the loan inputs", "why": "Names make the loan formulas readable to the owner and her accountant. =PMT(AnnualRate/12...) explains itself.", "task": "On the Financing sheet, name B3 Price, B4 DownPayment, B5 AnnualRate, and B6 LoanYears.", "steps": ["Click Financing!B3, click in the Name Box (left of the formula bar), type Price, and press {{Return}}.", "Repeat for B4 (DownPayment), B5 (AnnualRate), and B6 (LoanYears).", "Check your work in [[Formulas > Name Manager]]."], "trap": "Names can't have spaces. If you press {{Return}} without typing in the Name Box first, you just move to the next cell."}, {"t": "The bank payment with PMT", "why": "This is the monthly cost of the bank loan.", "task": "In Financing!B8, calculate the monthly payment on the amount borrowed (Price minus DownPayment) at AnnualRate over LoanYears, using your names.", "steps": ["B8: `=PMT(AnnualRate/12,LoanYears*12,-(Price-DownPayment))`"], "tip": "Monthly payments need a monthly rate (divide by 12) and a number of months (multiply by 12). The minus sign makes the payment show as a positive number.", "answer": "`=PMT(AnnualRate/12,LoanYears*12,-(Price-DownPayment))` is about $1,106.23 a month."}, {"t": "The dealer's real rate with RATE", "why": "The dealer only quoted a monthly payment. RATE reveals the interest rate hiding inside it.", "task": "In Financing!B13, calculate the dealer offer's annual rate: RATE over B11 months, a payment of B10 (as money going out), on B12 financed, times 12.", "steps": ["B13: `=RATE(B11,-B10,B12)*12`", "Format B13 as a percentage. B15 now says which deal is better."], "answer": "`=RATE(B11,-B10,B12)*12` is about 8.5%, higher than the bank's 6.9%, so the bank loan wins."}, {"t": "Is the night tour worth it? NPV", "why": "Money in year 5 is worth less than money today. NPV discounts each year's cash and subtracts the upfront cost.", "task": "On the Investment sheet, calculate the net present value in B13: NPV of the yearly cash flows B6:B10 at the rate in B12, plus the upfront cost in B3.", "steps": ["B13: `=NPV(B12,B6:B10)+B3`", "B3 is already negative, so adding it subtracts the cost. B14 shows the decision."], "trap": "Don't put B3 inside NPV. NPV assumes its first value comes one year from now, and the upfront cost is paid today.", "answer": "`=NPV(B12,B6:B10)+B3` is about $9,738. A positive NPV means the tour pays for itself."}, {"t": "Seniority with DATEDIF", "why": "Senior guides lead the night tour, and seniority is measured in whole years and months.", "task": "On the Guides sheet, fill Years (D5:D12) with the whole years from Hire Date (C) to the As of date in B2, and Months (E5:E12) with the leftover months.", "steps": ["D5: `=DATEDIF(C5,$B$2,\"y\")`", "E5: `=DATEDIF(C5,$B$2,\"ym\")`", "Select D5:E5 and fill down to row 12."], "tip": "DATEDIF doesn't appear in Excel's function list or AutoComplete, but it works. Units: \"y\" years, \"m\" months, \"d\" days, \"ym\" months left over after the years.", "answer": "`=DATEDIF(C5,$B$2,\"y\")` and `=DATEDIF(C5,$B$2,\"ym\")`"}, {"t": "Training days with NETWORKDAYS", "why": "Guides are paid for training on workdays only, not on weekends or holidays.", "task": "Fill Training Days (H5:H12) with the number of workdays from Training Start (F) to Training End (G), skipping the dates in Holidays!A2:A8.", "steps": ["H5: `=NETWORKDAYS(F5,G5,Holidays!$A$2:$A$8)`", "Fill down to H12."], "answer": "`=NETWORKDAYS(F5,G5,Holidays!$A$2:$A$8)`. Both the start and end dates count."}, {"t": "Certification deadlines with WORKDAY", "why": "The state needs each guide's certification paperwork 10 workdays after training ends.", "task": "Fill Cert Due (I5:I12) with the date 10 workdays after Training End, skipping the holidays. Format it as Short Date.", "steps": ["I5: `=WORKDAY(G5,10,Holidays!$A$2:$A$8)`", "Fill down to I12 and format as Short Date."], "tip": "NETWORKDAYS counts the workdays between two dates. WORKDAY goes the other way: it finds the date a number of workdays away."}, {"t": "Two-way lookup with INDEX and MATCH", "why": "Prices change by tour AND by season. The quote needs both a row match and a column match.", "task": "In Decision!B5, return the price for the tour in B3 and the season in B4 from the Rates grid (Rates!B2:D7), using INDEX with two MATCH functions.", "steps": ["B5: `=INDEX(Rates!$B$2:$D$7,MATCH(B3,Rates!$A$2:$A$7,0),MATCH(B4,Rates!$B$1:$D$1,0))`", "Change B4 to Low and back to Peak to test it."], "tip": "The first MATCH finds the row and the second finds the column. INDEX returns the cell where they cross.", "answer": "`=INDEX(Rates!$B$2:$D$7,MATCH(B3,Rates!$A$2:$A$7,0),MATCH(B4,Rates!$B$1:$D$1,0))`"}, {"t": "A rolling window with OFFSET", "why": "The owner judges the business on its latest 3 months. A new month is added every month, so the range has to move by itself.", "task": "In Decision!B7, add up Revenue for the last 3 months that have data in Bookings!C2:C13, using OFFSET and COUNT.", "steps": ["B7: `=SUM(OFFSET(Bookings!C1,COUNT(Bookings!C2:C13)-2,0,3,1))`", "COUNT finds how many months are filled in (10). OFFSET starts at C1, moves down 8 rows to August, and takes 3 rows.", "Test it: type 70000 in Bookings!C12 (November). B7 now adds September to November. Delete it again."], "tip": "OFFSET(start, rows down, columns right, height, width) builds a range on the fly. Results that change as data grows are what make OFFSET Expert-level.", "answer": "`=SUM(OFFSET(Bookings!C1,COUNT(Bookings!C2:C13)-2,0,3,1))`"}, {"t": "One formula makes the call", "why": "The owner wants a single cell that says go or wait, based on the NPV and on how heavy the airboat payment is.", "task": "In Decision!B11, show Expand if the night tour's NPV (Investment!B13) is above 0 AND the payment share in B9 is under 0.1. Otherwise show Wait a season.", "steps": ["B11: `=IF(AND(Investment!B13>0,B9<0.1),\"Expand\",\"Wait a season\")`"], "answer": "`=IF(AND(Investment!B13>0,B9<0.1),\"Expand\",\"Wait a season\")` shows Expand."}]}, {"id": "F-6", "world": "F", "track": "tosa", "name": "Lambda Lair", "domain": "Functions: custom functions and debugging", "exam": "TOSA Functions · Expert band (876-1000)", "band": "Expert", "scenario": "Coconut Grove Concert Series", "story": "The ticket office is staffed by volunteers who keep copying long formulas and breaking them. Ticket codes arrive in three different formats from three sellers. The manager wants custom functions anyone can reuse, and a promoter report that finally gives the right answers.", "goal": "A reusable ticket toolkit: a tested LAMBDA saved as TICKETTOTAL, clean ticket numbers pulled out with REGEX, a running total of tickets with SCAN, a sold-out count with REDUCE, and a promoter report with its logic and lookup errors fixed.", "files": [["TF-6_Concert_Toolkit.xlsx", "Practice workbook"]], "items": ["LAMBDA", "Named functions", "REGEXEXTRACT", "SCAN", "REDUCE", "Nested IF order", "IFNA", "Debugging"], "quests": [{"t": "Test a LAMBDA in a cell", "why": "Before the manager saves a custom function for everyone, she wants to see it work on one ticket.", "task": "In Toolkit!B4, write a LAMBDA with three inputs (p for price, q for quantity, f for fee) that returns ROUND(p*q*(1+f),2), and call it right away on Tickets!D2, C2, and E2.", "steps": ["Click Toolkit!B4.", "Type `=LAMBDA(p,q,f,ROUND(p*q*(1+f),2))(Tickets!D2,Tickets!C2,Tickets!E2)` and press {{Return}}.", "B4 shows the total for the first ticket, fee included."], "tip": "The first set of parentheses defines the function. The second set calls it. Without the second set, Excel shows #CALC! because the function has nothing to work on.", "answer": "`=LAMBDA(p,q,f,ROUND(p*q*(1+f),2))(Tickets!D2,Tickets!C2,Tickets!E2)`"}, {"t": "Save it as a named function", "why": "A named LAMBDA works like a built-in function. Volunteers type =TICKETTOTAL( and never touch the math.", "task": "Define a name TICKETTOTAL that refers to =LAMBDA(p,q,f,ROUND(p*q*(1+f),2)). Then fill Tickets!H2:H41 with =TICKETTOTAL(D2,C2,E2).", "steps": ["Choose [[Formulas > Define Name]].", "Name: TICKETTOTAL. Refers to: `=LAMBDA(p,q,f,ROUND(p*q*(1+f),2))`. Click OK.", "In Tickets!H2 type `=TICKETTOTAL(D2,C2,E2)` and double-click the fill handle to fill down to H41."], "trap": "Leave off the (D2,C2,E2) at the end in Refers to. The name stores the function. You call it later in the cells.", "answer": "Name: TICKETTOTAL = `=LAMBDA(p,q,f,ROUND(p*q*(1+f),2))`. H2: `=TICKETTOTAL(D2,C2,E2)`"}, {"t": "Pull ticket numbers out with REGEXEXTRACT", "why": "One seller writes TKT-00412-VIP, another writes tkt 412 ga, and a third writes Ticket#00412. The box office only needs the number.", "task": "Fill Tickets!F2:F41 with the first run of digits in the Ticket Code (A), using REGEXEXTRACT.", "steps": ["In F2 type `=REGEXEXTRACT(A2,\"[0-9]+\")`.", "Fill down to F41. Every row now shows just the digits, like 00412."], "tip": "[0-9] means any digit and + means one or more of them. REGEX functions are Microsoft 365 only.", "answer": "`=REGEXEXTRACT(A2,\"[0-9]+\")`"}, {"t": "A running total with SCAN", "why": "The manager wants to see the season's tickets add up night by night.", "task": "In Nights!C2, use SCAN to return a running total of the tickets in B2:B13. It should spill down to C13.", "steps": ["In Nights!C2 type `=SCAN(0,B2:B13,LAMBDA(a,b,a+b))`.", "The results spill down to C13. C13 equals the season total."], "tip": "SCAN starts at 0, adds each value in turn, and shows every step along the way.", "answer": "`=SCAN(0,B2:B13,LAMBDA(a,b,a+b))`"}, {"t": "Count sell-outs with REDUCE", "why": "A night with 350 or more tickets counts as a sell-out, and sponsors pay a bonus for each one.", "task": "In Toolkit!B6, use REDUCE to count how many nights in Nights!B2:B13 sold 350 or more tickets.", "steps": ["In Toolkit!B6 type `=REDUCE(0,Nights!B2:B13,LAMBDA(a,b,IF(b>=350,a+1,a)))`."], "tip": "REDUCE works like SCAN but returns only the final value. Here the running value a goes up by 1 each time a night sells 350 or more.", "answer": "`=REDUCE(0,Nights!B2:B13,LAMBDA(a,b,IF(b>=350,a+1,a)))`"}, {"t": "Fix a nested IF in the wrong order", "why": "No promoter has ever shown as Platinum, even the ones who sold over $10,000. The formula checks the tiers in the wrong order.", "task": "Fix Audit!C2:C9 so Sales (B) of 10,000 or more shows Platinum, 5,000 or more shows Gold, and anything else shows Standard.", "steps": ["Click Audit!C2 and read the formula: `=IF(B2>=5000,\"Gold\",IF(B2>=10000,\"Platinum\",\"Standard\"))`.", "A $12,000 promoter passes the first test (5,000 or more) and stops at Gold, so the Platinum test never runs.", "Change C2 to `=IF(B2>=10000,\"Platinum\",IF(B2>=5000,\"Gold\",\"Standard\"))` and fill down to C9."], "trap": "Nested IFs stop at the first TRUE. Always test the biggest threshold first.", "answer": "`=IF(B2>=10000,\"Platinum\",IF(B2>=5000,\"Gold\",\"Standard\"))`"}, {"t": "Trap #N/A with IFNA", "why": "Two promoters aren't on the commission list yet, so their lookups show #N/A, and that error breaks the total in Audit!D11.", "task": "Wrap the lookups in Audit!D2:D9 with IFNA so a missing promoter shows 0 instead of #N/A.", "steps": ["Click Audit!D2. It holds `=XLOOKUP(A2,Rates!A2:A7,Rates!B2:B7)*B2`.", "Change it to `=IFNA(XLOOKUP(A2,Rates!$A$2:$A$7,Rates!$B$2:$B$7),0)*B2` and fill down to D9.", "D11 (the total) now shows a number."], "tip": "IFNA only catches #N/A, so a real mistake like #DIV/0! still shows. IFERROR hides every error, which can bury problems.", "answer": "`=IFNA(XLOOKUP(A2,Rates!$A$2:$A$7,Rates!$B$2:$B$7),0)*B2`"}]}, {"id": "M-1", "world": "M", "track": "tosa", "name": "Style Street", "domain": "Formatting: fonts, fills, borders, number formats, alignment", "exam": "TOSA Formatting · Basic band (351-550)", "band": "Basic", "scenario": "South Beach Surf Rentals", "story": "The shop's price list is a wall of plain numbers. Customers can't tell a daily rate from a deposit, the dates look like code, and the notes run off the page. The owner wants it clean enough to tape to the counter by Saturday.", "goal": "A counter-ready price list: a bold merged title, styled headers, currency, percent and long-date formats, wrapped notes, full borders, a Total-style totals row, and a matching header on the Lessons sheet.", "files": [["TM-1_Surf_Price_List.xlsx", "Practice workbook"]], "items": ["Font size and bold", "Merge & Center", "Fill color", "Currency", "Percent", "Long Date", "Wrap text", "Column width", "Borders", "Cell styles", "Format Painter"], "quests": [{"t": "Make the title stand out", "why": "A title in plain 11-point text disappears. Customers should see the shop name first.", "task": "Make Prices!A1 bold and size 16.", "steps": ["Click Prices!A1.", "On the Home tab, click Bold (or press {{Cmd+B}}).", "In the Font Size box on the Home tab, choose 16."]}, {"t": "Merge & Center the title", "why": "Centering the title over the table makes the sheet look like one finished piece.", "task": "Merge and center Prices!A1:G1.", "steps": ["Select Prices!A1:G1.", "Choose [[Home > Merge & Center]]."], "tip": "Merge only titles. Merged cells inside data break sorting, filtering, and copying."}, {"t": "Style the header row", "why": "Headers that look different from the data tell the reader where the table starts.", "task": "Make Prices!A3:G3 bold, give it any fill color, and center the text.", "steps": ["Select Prices!A3:G3.", "Click Bold, then pick a color from the Fill Color bucket on the Home tab.", "Click Center in the alignment group."]}, {"t": "Format the rates as currency", "why": "45 could mean anything. $45.00 is a price.", "task": "Format Prices!C4:D15 (Daily Rate and Weekly Rate) as Currency with 2 decimal places.", "steps": ["Select Prices!C4:D15.", "Press {{Cmd+1}}. On the Number tab, choose Currency, set Decimal places to 2, and click OK."], "tip": "Formats change how a number looks, not the number itself. The cell still
