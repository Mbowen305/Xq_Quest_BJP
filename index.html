y"]], "eval": [], "say": "Fill a 10-by-3 block with random whole numbers from 50 to 150.", "out": "Practice data that changes every time the workbook recalculates. See %%random%%.", "from": "2-2"}]}, {"id": "ar-rules", "h": "Rules for every dynamic array", "blocks": [{"t": "list", "items": ["Type the formula in one cell only. The other cells are filled by the spill.", "Leave room. If anything sits where the results need to go, you get #SPILL!.", "Dynamic arrays can't spill inside an Excel table. Put them outside the table.", "Point at a whole spill range with `#`: `=COUNTA(Genres!A7#)`.", "To keep a snapshot that won't change, copy the spill range and use [[Edit > Paste Special]] with Values (@@1-2@@)."]}]}, {"id": "ar-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-210 names SORT and UNIQUE (@@1-4@@), and RANDBETWEEN and SEQUENCE (@@1-2@@). MO-211 adds FILTER, SORTBY, and RANDARRAY (@@2-2@@, @@2-3@@). TOSA Advanced asks for \"dynamic array formulas.\" Expect questions on what #SPILL! means, which argument sets descending order, and how FILTER combines two conditions."}]}], "group": "Dynamic Arrays", "levels": ["1-2", "1-4", "2-2", "2-3", "F-3"], "kw": "COUNTA DATE FILTER RANDARRAY SEQUENCE SORT SORTBY UNIQUE SORT, SORTBY, UNIQUE, FILTER, SEQUENCE, RANDARRAY One formula, a whole list of results"}, {"id": "random", "title": "RAND and RANDBETWEEN", "tag": "CODEX · DYNAMIC ARRAYS", "sub": "Random numbers for draws, tests, and practice data", "lead": "Random numbers have real business uses: a fair raffle, a random sample of customers to survey, or fake data to test a workbook before the real numbers arrive. Excel's random functions are volatile, so they pick new numbers every time the workbook recalculates.", "sections": [{"id": "rn-rand", "h": "RAND: a random decimal", "blocks": [{"t": "sig", "s": "RAND()", "args": []}, {"t": "p", "x": "RAND returns a random decimal from 0 up to (but never including) 1, like 0.73519. It takes no arguments, but it still needs its parentheses."}, {"t": "ex", "f": "=RAND()", "parts": [["RAND()", "A new random decimal between 0 and 1"]], "eval": [], "say": "Give this member a random number.", "out": "A random key for each member. The member with the highest key wins the raffle. Press {{Cmd+=}} to draw again.", "from": "F-4"}, {"t": "tip", "x": "Sorting a list by a RAND column shuffles it. That's a quick way to pick a random sample: add RAND, sort, and take the top 20 rows."}]}, {"id": "rn-between", "h": "RANDBETWEEN: a random whole number", "blocks": [{"t": "sig", "s": "RANDBETWEEN(bottom, top)", "args": [["bottom", "required", "The smallest number it can return"], ["top", "required", "The largest number it can return"]]}, {"t": "p", "x": "RANDBETWEEN returns a random whole number from bottom to top, and both ends can come up."}, {"t": "ex", "f": "=RANDBETWEEN(5001,5012)", "parts": [["5001", "The lowest ticket number"], ["5012", "The highest ticket number"]], "eval": [], "say": "Draw a random ticket number from 5001 to 5012.", "out": "The winning raffle ticket in D4 of the Loyalty Raffle sheet. The winner's name appears next to it, and a new ticket is drawn every time the workbook recalculates.", "from": "1-2"}]}, {"id": "rn-freeze", "h": "Freezing random numbers", "blocks": [{"t": "p", "x": "Because random functions are volatile, the numbers change after every edit anywhere in the workbook. To keep one draw, select the cells, copy them, and use [[Edit > Paste Special]] with Values. The formulas become fixed numbers."}, {"t": "trap", "x": "A raffle winner picked with RAND will change the next time anyone edits the file. Freeze the winner, or write it down, before you announce it."}]}, {"id": "rn-compare", "h": "Which one to use", "blocks": [{"t": "table", "head": ["You want", "Use"], "rows": [["One random decimal from 0 to 1", "`RAND()`"], ["One random whole number in a range", "`RANDBETWEEN(bottom, top)`"], ["A whole block of random numbers at once", "`RANDARRAY(rows, cols, min, max, TRUE)` (see %%arrays%%)"]]}]}, {"id": "rn-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-210 names RANDBETWEEN (@@1-2@@), and MO-211 names RANDARRAY. TOSA Advanced lists RAND. A typical question: \"What happens to RAND's result when you edit another cell?\" It changes."}]}], "group": "Dynamic Arrays", "levels": ["F-4", "1-2"], "kw": "RAND RANDARRAY RANDBETWEEN RAND and RANDBETWEEN Random numbers for draws, tests, and practice data"}, {"id": "finance", "title": "PMT, NPER, RATE, NPV", "tag": "CODEX · FINANCE", "sub": "Loans, interest, and whether an investment pays off", "lead": "The finance functions answer the questions every business owner asks before signing anything. What's the monthly payment? How long until it's paid off? What rate is hiding in this offer? Is this investment worth it? They all share two rules: match the rate to the payment period, and keep money coming in and money going out on opposite signs.", "sections": [{"id": "fn-rules", "h": "The two rules", "blocks": [{"t": "p", "x": "**Rule 1: match the period.** Loans quote an annual rate, but payments are monthly. Divide the annual rate by 12 and multiply the years by 12, so every argument is in months."}, {"t": "p", "x": "**Rule 2: signs show direction.** Money you receive is positive and money you pay out is negative. A loan you receive is positive (you got the cash), so its payments come back negative. Put a minus sign in front of the loan amount to make the payment show as a positive number."}, {"t": "table", "head": ["Argument", "Means", "Monthly loan example"], "rows": [["`rate`", "The interest rate per period", "`AnnualRate/12`"], ["`nper`", "The number of periods", "`LoanYears*12`"], ["`pmt`", "The payment each period", "A negative number, money going out"], ["`pv`", "Present value: the amount borrowed today", "The loan amount"], ["`fv`", "Future value: what's left at the end", "0 for a loan paid off in full (the default)"], ["`type`", "When payments happen", "0 at the end of each period (the default), 1 at the start"]]}]}, {"id": "fn-pmt", "h": "PMT: the payment", "blocks": [{"t": "sig", "s": "PMT(rate, nper, pv, [fv], [type])", "args": [["rate", "required", "The interest rate per period"], ["nper", "required", "The total number of payments"], ["pv", "required", "The amount borrowed"], ["fv, type", "optional", "Usually left off"]]}, {"t": "ex", "f": "=PMT(AnnualRate/12,LoanYears*12,-(Price-DownPayment))", "parts": [["AnnualRate/12", "The monthly rate"], ["LoanYears*12", "The number of monthly payments"], ["-(Price-DownPayment)", "The amount borrowed, made negative so the payment shows as positive"]], "eval": [], "say": "Find the monthly payment on the amount borrowed, at the monthly rate, over the number of months.", "out": "About $1,106.23 a month for the airboat loan. The named ranges make it read like a sentence.", "from": "F-5"}, {"t": "trap", "x": "Forgetting to divide the rate by 12 gives a payment that's far too high, because Excel thinks the annual rate is charged every month."}]}, {"id": "fn-nper", "h": "NPER: how many payments", "blocks": [{"t": "sig", "s": "NPER(rate, pmt, pv, [fv], [type])", "args": [["rate", "required", "The interest rate per period"], ["pmt", "required", "The payment each period, as a negative number"], ["pv", "required", "The amount borrowed"]]}, {"t": "ex", "f": "=NPER(B3/12,-B9,B2)", "parts": [["B3/12", "The monthly rate"], ["-B9", "The planned monthly payment, money going out"], ["B2", "The loan amount"]], "eval": [], "say": "How many months will it take to pay off this loan at this payment?", "out": "About 27.3 months. The shop's goal was 24, so the forecast says Extend.", "from": "2-3"}, {"t": "trap", "x": "If the payment is too small to cover the interest, the loan never gets paid off and NPER returns #NUM!."}]}, {"id": "fn-rate", "h": "RATE: the hidden interest rate", "blocks": [{"t": "sig", "s": "RATE(nper, pmt, pv, [fv], [type], [guess])", "args": [["nper", "required", "The number of payments"], ["pmt", "required", "The payment each period, as a negative number"], ["pv", "required", "The amount financed"], ["fv, type, guess", "optional", "Usually left off. guess helps if RATE can't find an answer"]]}, {"t": "p", "x": "RATE works backward. Give it the payment and the number of payments, and it finds the interest rate per period. Multiply by 12 for the annual rate."}, {"t": "ex", "f": "=RATE(B11,-B10,B12)*12", "parts": [["B11", "The number of monthly payments in the dealer's offer"], ["-B10", "The monthly payment, as money going out"], ["B12", "The amount financed"], ["*12", "Turn the monthly rate into an annual rate"]], "eval": [], "say": "Find the annual interest rate hiding inside the dealer's monthly payment.", "out": "About 8.5%, higher than the bank's 6.9%, so the bank loan wins.", "from": "F-5"}]}, {"id": "fn-npv", "h": "NPV: is the investment worth it?", "blocks": [{"t": "sig", "s": "NPV(rate, value1, [value2], ...)", "args": [["rate", "required", "The discount rate: what the money could earn somewhere else, per period"], ["value1, ...", "required", "The cash flows, one per period, starting one period from today"]]}, {"t": "p", "x": "Money in the future is worth less than money today, because money today can be invested. NPV shrinks each future cash flow by the discount rate and adds them up. Then you subtract the cost paid today. A positive NPV means the investment earns more than the discount rate."}, {"t": "ex", "f": "=NPV(B12,B6:B10)+B3", "parts": [["B12", "The discount rate"], ["B6:B10", "The night tour's cash flow in years 1 to 5"], ["+B3", "The upfront cost, already negative, added outside NPV"]], "eval": [], "say": "Find what the next five years of cash are worth today, then subtract the upfront cost.", "out": "About $9,738. Positive, so the night tour pays for itself.", "from": "F-5"}, {"t": "trap", "x": "**Keep today's cost outside NPV.** NPV assumes its first value arrives one year from now. Put the upfront cost inside and it gets discounted as if it were paid next year, which makes the investment look better than it is."}]}, {"id": "fn-more", "h": "Related functions", "blocks": [{"t": "table", "head": ["Function", "Answers"], "rows": [["`FV(rate, nper, pmt, [pv])`", "How much will savings grow to?"], ["`PV(rate, nper, pmt, [fv])`", "How much is a stream of future payments worth today?"], ["`IPMT` / `PPMT`", "How much of one payment is interest, and how much pays down the loan?"], ["`IRR(values)`", "What rate of return does this investment earn?"]]}]}, {"id": "fn-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-211 names PMT for financial data and NPER inside a forecast with AND and IF (@@2-3@@). TOSA Expert names PMT, NPV, and RATE (@@F-5@@). Expect questions on dividing the rate by 12, on why a payment shows as negative, and on where the upfront cost goes in an NPV formula."}]}], "group": "Finance", "levels": ["F-5", "2-3"], "kw": "FV IRR NPER NPV PMT PV RATE PMT, NPER, RATE, NPV Loans, interest, and whether an investment pays off"}, {"id": "let-lambda", "title": "LET and LAMBDA", "tag": "CODEX · ADVANCED FORMULAS", "sub": "Naming values and building your own functions", "lead": "LET and LAMBDA bring an idea from programming into Excel: give things names. LET names the pieces inside one formula, so a long formula reads like a set of steps. LAMBDA turns a formula into your own function, with its own name, that anyone can use like SUM.", "sections": [{"id": "ll-let", "h": "LET: name the pieces of a formula", "blocks": [{"t": "sig", "s": "LET(name1, name_value1, calculation_or_name2, [name_value2, ...])", "args": [["name1", "required", "A short name, like `fee`. Names follow the same rules as named ranges: no spaces, and nothing that looks like a cell address"], ["name_value1", "required", "The value or calculation that name1 stands for"], ["calculation_or_name2", "required", "If you stop here, this is the calculation: the formula that uses the names and gives the result. If you keep going, it's the next name"], ["name_value2, ...", "optional", "The next name's value, then more name-and-value pairs. Whatever comes last is always the calculation"]]}, {"t": "p", "x": "LET works in pairs: a name, then its value, then the next name and value, and finally the calculation. Excel works out each value once, then uses the names wherever they appear in the calculation."}, {"t": "p", "x": "**Reading Excel's hint.** The hint says `calculation_or_name2` because the third argument does one of two jobs. In `=LET(fee,E2,fee*12)` it's the calculation. In `=LET(fee,E2,cls,G2,fee/cls)` it's the second name, cls. The rule never changes: the last argument is the calculation."}, {"t": "ex", "f": "=LET(fee,E2,cls,G2,IF(cls=0,0,fee/cls))", "parts": [["fee,E2", "Pair 1: fee means the Monthly Fee in E2"], ["cls,G2", "Pair 2: cls means the Classes/Month in G2"], ["IF(cls=0,0,fee/cls)", "The calculation: 0 if there are no classes, otherwise the fee divided by the classes"]], "eval": [], "say": "Call the fee \"fee\" and the classes \"cls.\" If cls is 0, show 0. Otherwise, divide fee by cls.", "out": "The cost per class, with no #DIV/0! for members who take no classes.", "from": "F-4"}, {"t": "ex", "f": "=LET(c,F2,p,G2,(p-c)/p)", "parts": [["c,F2", "c is the cost"], ["p,G2", "p is the price"], ["(p-c)/p", "Profit divided by price"]], "eval": [], "say": "With c as the cost and p as the price, divide the profit by the price.", "out": "The profit margin, as a decimal ready for Percent format.", "from": "2-3"}, {"t": "p", "x": "**Why use LET?** Readability is the first reason. `(p-c)/p` says what it means. Speed is the second: if a slow lookup appears three times in a formula, LET can run it once and reuse the result. That's the \"optimize formula performance\" skill TOSA Expert asks about."}, {"t": "trap", "x": "The calculation must be last, and there must be one. An odd number of arguments before it means a name is missing its value."}]}, {"id": "ll-lambda", "h": "LAMBDA: build your own function", "blocks": [{"t": "sig", "s": "LAMBDA([parameter1, parameter2, ...], calculation)", "args": [["parameter1, ...", "optional", "Names for the inputs your function will take, like `p`, `q`, and `f`"], ["calculation", "required", "The last argument: the formula, written with the parameter names"]]}, {"t": "p", "x": "A LAMBDA is a recipe with blanks in it. The parameters are the blanks, and the calculation is the recipe. On its own, a LAMBDA has nothing to work on and shows #CALC!. You have to call it with values, either right away in the cell or later by name."}, {"t": "ex", "f": "=LAMBDA(p,q,f,ROUND(p*q*(1+f),2))(Tickets!D2,Tickets!C2,Tickets!E2)", "parts": [["LAMBDA(p,q,f,", "Three inputs: price, quantity, and fee rate"], ["ROUND(p*q*(1+f),2)", "The recipe: price times quantity, plus the fee, rounded to cents"], ["(Tickets!D2,Tickets!C2,Tickets!E2)", "The second set of parentheses calls it with real values"]], "eval": [], "say": "Define a function of price, quantity, and fee, then run it on this ticket's numbers.", "out": "One ticket's total. This is how you test a LAMBDA before naming it.", "from": "F-6"}]}, {"id": "ll-named", "h": "Named functions: LAMBDA plus a name", "blocks": [{"t": "p", "x": "To reuse a LAMBDA, save it as a name. Use [[Formulas > Define Name]], type a name, and put the LAMBDA in Refers to, **without** the values on the end. From then on, the name works like a built-in function anywhere in the workbook."}, {"t": "ex", "f": "=TICKETTOTAL(D2,C2,E2)", "parts": [["TICKETTOTAL(", "Your own function, defined in the Name Manager as `=LAMBDA(p,q,f,ROUND(p*q*(1+f),2))`"], ["D2,C2,E2", "The price, quantity, and fee for this row, in the same order as the parameters"]], "eval": [], "say": "Run TICKETTOTAL on this row's price, quantity, and fee.", "out": "The total for every ticket. Volunteers never see or break the math inside.", "from": "F-6"}, {"t": "trap", "x": "The order of the inputs matters. TICKETTOTAL expects price, quantity, fee. Call it with quantity first and you get a wrong total, with no error."}, {"t": "tip", "x": "Named functions live in the workbook. Copy a sheet that uses one into another workbook and the name comes along."}]}, {"id": "ll-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-211 names LET among its logical functions (@@2-3@@). TOSA Advanced names LET and \"named variables,\" and TOSA Expert names LAMBDA, including custom reusable functions. Expect questions on why a LAMBDA shows #CALC!, which argument of LET is the result, and how to call a named LAMBDA."}]}], "group": "Advanced Formulas", "levels": ["F-4", "F-6", "2-3"], "kw": "IF LAMBDA LET ROUND TICKETTOTAL LET and LAMBDA Naming values and building your own functions"}, {"id": "lambda-helpers", "title": "SCAN and REDUCE", "tag": "CODEX · ADVANCED FORMULAS", "sub": "Walking through a list one value at a time", "lead": "SCAN and REDUCE take a list and a small LAMBDA, then walk through the list one value at a time while carrying a running result, called the accumulator. SCAN shows every step along the way. REDUCE shows only the final result. They let one formula do what used to need a helper column.", "sections": [{"id": "lh-how", "h": "How the accumulator works", "blocks": [{"t": "p", "x": "Both functions take a starting value, a list, and a LAMBDA with exactly two inputs. The first input (often called `a`) is the running result so far. The second (often called `b`) is the current value from the list. Whatever the LAMBDA returns becomes the new running result for the next step."}, {"t": "table", "head": ["Step", "a (running result)", "b (current value)", "a+b becomes the new a"], "rows": [["Start", "0", "(nothing yet)", "0"], ["1", "0", "212", "212"], ["2", "212", "288", "500"], ["3", "500", "351", "851"]]}, {"t": "p", "x": "That table is a running total of the first three nights in @@F-6@@. SCAN would return 212, 500, 851. REDUCE would return just 851."}]}, {"id": "lh-scan", "h": "SCAN: show every step", "blocks": [{"t": "sig", "s": "SCAN([initial_value], array, lambda)", "args": [["initial_value", "optional", "Where the running result starts, like 0"], ["array", "required", "The list to walk through"], ["lambda", "required", "A LAMBDA with two inputs: the running result and the current value"]]}, {"t": "ex", "f": "=SCAN(0,B2:B13,LAMBDA(a,b,a+b))", "parts": [["0", "Start the running total at 0"], ["B2:B13", "The tickets sold each night"], ["LAMBDA(a,b,a+b)", "Each step: the total so far plus tonight's tickets"]], "eval": [], "say": "Starting at 0, add each night's tickets to the total and show the total after every night.", "out": "A running total that spills down from C2 to C13. C13 equals the season total.", "from": "F-6"}]}, {"id": "lh-reduce", "h": "REDUCE: only the final answer", "blocks": [{"t": "sig", "s": "REDUCE([initial_value], array, lambda)", "args": [["initial_value", "optional", "Where the running result starts"], ["array", "required", "The list to walk through"], ["lambda", "required", "A LAMBDA with two inputs: the running result and the current value"]]}, {"t": "ex", "f": "=REDUCE(0,Nights!B2:B13,LAMBDA(a,b,IF(b>=350,a+1,a)))", "parts": [["0", "Start the count at 0"], ["Nights!B2:B13", "Each night's tickets"], ["LAMBDA(a,b,IF(b>=350,a+1,a))", "Each step: if tonight sold 350 or more, add 1 to the count. If not, keep the count the same"]], "eval": [], "say": "Starting at 0, go night by night and add 1 for every night that sold 350 or more.", "out": "5 sell-out nights out of 12, which decides the sponsor bonus.", "from": "F-6"}, {"t": "tip", "x": "COUNTIF could count sell-outs too: `=COUNTIF(Nights!B2:B13,\">=350\")`. REDUCE earns its place when the rule is something COUNTIF can't express, like counting nights that beat the night before."}]}, {"id": "lh-more", "h": "More LAMBDA helpers", "blocks": [{"t": "table", "head": ["Function", "What it does"], "rows": [["`MAP(array, lambda)`", "Runs the LAMBDA on each value and returns a list of results, the same size as the input"], ["`BYROW(array, lambda)`", "Runs the LAMBDA on each row and returns one result per row"], ["`BYCOL(array, lambda)`", "Runs the LAMBDA on each column"], ["`MAKEARRAY(rows, cols, lambda)`", "Builds a grid, with the LAMBDA working out each cell from its row and column number"]]}]}, {"id": "lh-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "TOSA Expert names SCAN and REDUCE with LAMBDA and \"iterative and dynamic calculations.\" Expect a question that gives a short SCAN or REDUCE formula and a small list, and asks for the result. Work it out step by step with a table like the one above. MOS doesn't test these."}]}], "group": "Advanced Formulas", "levels": ["F-6"], "kw": "BYCOL BYROW COUNTIF IF LAMBDA MAKEARRAY MAP REDUCE SCAN SCAN and REDUCE Walking through a list one value at a time"}, {"id": "regex", "title": "REGEXTEST, REGEXEXTRACT, REGEXREPLACE", "tag": "CODEX · ADVANCED FORMULAS", "sub": "Matching text by pattern", "lead": "The other text functions need to know where something is or exactly what it says. Regular expressions (regex for short) describe what something looks like instead: \"a run of digits,\" \"three capital letters, a dash, then five digits.\" That's how one formula can pull the ticket number out of TKT-00412-VIP, tkt 412 ga, and Ticket#00412. The REGEX functions are new in Microsoft 365.", "sections": [{"id": "rx-pattern", "h": "The pattern language", "blocks": [{"t": "p", "x": "A pattern is text in quotes. Most characters match themselves, so `\"TKT\"` matches TKT. A few characters have special jobs:"}, {"t": "table", "head": ["Pattern", "Matches", "Example"], "rows": [["`[0-9]` or `\\d`", "Any one digit", "`\"\\d\"` matches the 4 in TKT-4"], ["`[A-Z]`", "Any one capital letter", "`\"[A-Z]\"` matches T"], ["`[a-z]`", "Any one lowercase letter", "`\"[a-z]+\"` matches tkt in tkt 331 ga, the first run of lowercase letters"], ["`.`", "Any one character at all", "`\"T.T\"` matches TKT"], ["`+`", "One or more of the thing before it", "`\"[0-9]+\"` matches 00412"], ["`*`", "Zero or more of the thing before it", "`\"TKT-0*\"` matches TKT- with or without zeros after it"], ["`?`", "The thing before it is optional", "`\"colou?r\"` matches color and colour"], ["`{3}`", "Exactly 3 of the thing before it", "`\"[A-Z]{3}\"` matches FIC"], ["`^`", "The start of the text", "`\"^TKT\"` means it must start with TKT"], ["`$`", "The end of the text", "`\"VIP$\"` means it must end with VIP"], ["`\\s`", "A space", "`\"tkt\\s331\"` matches tkt 331"], ["`|`", "Or", "`\"VIP|GA|BAL\"` matches VIP, GA, or BAL"], ["`( )`", "A group", "`\"(\\d+)-VIP\"` groups the digits"]]}, {"t": "trap", "x": "`*` means something different here than in COUNTIF. In criteria strings, `*` means any text. In a regex, it means \"zero or more of the thing before it,\" and `.*` is \"any text.\""}]}, {"id": "rx-extract", "h": "REGEXEXTRACT: pull out what matches", "blocks": [{"t": "sig", "s": "REGEXEXTRACT(text, pattern, [return_mode], [case_sensitivity])", "args": [["text", "required", "The text to search"], ["pattern", "required", "The pattern, in quotes"], ["return_mode", "optional", "0 (the default) returns the first match. 1 returns every match as a spilled list. 2 returns the groups from the first match"], ["case_sensitivity", "optional", "0 (the default) is case-sensitive. 1 ignores case"]]}, {"t": "ex", "f": "=REGEXEXTRACT(A2,\"[0-9]+\")", "parts": [["A2", "A ticket code in any of the three formats"], ["\"[0-9]+\"", "One or more digits in a row"]], "eval": [], "say": "Pull out the first run of digits in the ticket code.", "out": "02128 from TKT-02128-BAL, 331 from tkt 331 ga, and 01845 from Ticket#01845. The result is text, so wrap it in VALUE if you need a number.", "from": "F-6"}]}, {"id": "rx-test", "h": "REGEXTEST: does it match?", "blocks": [{"t": "sig", "s": "REGEXTEST(text, pattern, [case_sensitivity])", "args": [["text", "required", "The text to check"], ["pattern", "required", "The pattern"], ["case_sensitivity", "optional", "0 (the default) is case-sensitive. 1 ignores case"]]}, {"t": "p", "x": "REGEXTEST returns TRUE when the text contains a match, and FALSE when it doesn't. It's a format checker."}, {"t": "ex", "f": "=REGEXTEST(A2,\"^TKT-\\d{5}-(VIP|GA|BAL)$\")", "parts": [["^TKT-", "Must start with TKT and a dash"], ["\\d{5}", "Then exactly 5 digits"], ["-(VIP|GA|BAL)$", "Then a dash and VIP, GA, or BAL, and nothing after that"]], "eval": [], "say": "Is this ticket code in the official format?", "out": "TRUE for TKT-00104-VIP and TKT-02128-BAL. FALSE for tkt 331 ga and Ticket#01845, which tells the box office which seller's codes need fixing."}, {"t": "tip", "x": "REGEXTEST also works as a conditional formatting rule, which highlights every code in the wrong format."}]}, {"id": "rx-replace", "h": "REGEXREPLACE: swap what matches", "blocks": [{"t": "sig", "s": "REGEXREPLACE(text, pattern, replacement, [occurrence], [case_sensitivity])", "args": [["text", "required", "The original text"], ["pattern", "required", "The pattern to find"], ["replacement", "required", "What to put in place of each match. `\"\"` deletes it"], ["occurrence", "optional", "0 (the default) replaces every match. 1 replaces only the first"], ["case_sensitivity", "optional", "0 case-sensitive (default), 1 ignore case"]]}, {"t": "ex", "f": "=REGEXREPLACE(A2,\"\\s+\",\" \")", "parts": [["A2", "Text with messy spacing"], ["\"\\s+\"", "Any run of one or more spaces"], ["\" \"", "Replace each run with a single space"]], "eval": [], "say": "Squeeze every run of spaces down to one space.", "out": "The same idea as TRIM for the spaces in the middle, written as a pattern. REGEXREPLACE can clean anything you can describe."}]}, {"id": "rx-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "TOSA Expert says \"use regular expressions (REGEX).\" Expect a pattern and a piece of text, with a question about what matches. Read the pattern one piece at a time from left to right. MOS doesn't test regex."}]}], "group": "Advanced Formulas", "levels": ["F-6"], "kw": "REGEXEXTRACT REGEXREPLACE REGEXTEST REGEXTEST, REGEXEXTRACT, REGEXREPLACE Matching text by pattern"}, {"id": "names-tables", "title": "Named ranges and structured references", "tag": "CODEX · ADVANCED FORMULAS", "sub": "Formulas that read like sentences", "lead": "`=PMT(AnnualRate/12,LoanYears*12,-(Price-DownPayment))` explains itself. `=PMT(B5/12,B6*12,-(B3-B4))` doesn't. Named ranges and table references replace cell addresses with words. Formulas become easier to read, harder to break, and they keep working when the data grows.", "sections": [{"id": "nt-names", "h": "Named ranges", "blocks": [{"t": "p", "x": "A **named range** is a name that stands for a cell or range. Once it's defined, you can use the name anywhere you'd type the address."}, {"t": "steps", "items": ["Select the cells. Click the Name Box (left of the formula bar), type the name, and press {{Return}}.", "Or use [[Formulas > Define Name]], which also lets you set the scope and add a comment.", "Review, edit, or delete names in [[Formulas > Name Manager]]."]}, {"t": "ex", "f": "=AVERAGE(MenuPrices)", "parts": [["AVERAGE(", "Average the values"], ["MenuPrices", "The name for Menu!D4:D23"]], "eval": [], "say": "Average the menu prices.", "out": "The average price. If someone asks what the formula does, the formula tells them.", "from": "1-2"}, {"t": "table", "head": ["Rule", "Allowed", "Not allowed"], "rows": [["Start with a letter or underscore", "`Price`, `_rate`", "`2026Sales`"], ["No spaces", "`AnnualRate`, `Annual_Rate`", "`Annual Rate`"], ["Can't look like a cell address", "`TaxRate`", "`TAX2026` (that's a real cell, column TAX, row 2026)"], ["Case doesn't matter", "`PRICE` and `price` are the same name", "Two names that differ only in capitals"]]}, {"t": "trap", "x": "Pressing {{Return}} without clicking into the Name Box first just moves to the next cell. Click the box, type, then press {{Return}}."}, {"t": "tip", "x": "A name is always absolute. `PlanRates` in @@E-3@@ points at the same cells no matter where the formula is copied, so it never needs `$` signs."}]}, {"id": "nt-scope", "h": "Scope: workbook or sheet", "blocks": [{"t": "p", "x": "A name's **scope** decides where it works. Workbook scope, the default, means the name works on every sheet. Sheet scope means it only works on one sheet, so two sheets can each have their own `Total`. Set the scope in the Define Name dialog. It can't be changed later in Name Manager, so delete and re-create a name to change it."}]}, {"id": "nt-structured", "h": "Structured references: formulas for tables", "blocks": [{"t": "p", "x": "When data is formatted as a table (@@1-3@@, @@D-3@@, @@M-2@@), formulas can refer to its columns by name. These **structured references** grow with the table, so a formula that totals a column picks up new rows automatically."}, {"t": "table", "head": ["You write", "It means"], "rows": [["`tblSales[Total]`", "The whole Total column, data rows only"], ["`[@Qty]`", "The Qty value in this row (only inside the table)"], ["`[@[Monthly Fee]]`", "This row's Monthly Fee. A column name with a space needs a second pair of brackets"], ["`tblSales[#Totals]`", "The table's Total Row"], ["`tblSales[#Headers]`", "The header row"], ["`tblSales[#All]`", "Everything: headers, data, and totals"], ["`tblSales`", "The data rows of the whole table"]]}, {"t": "ex", "f": "=[@Qty]*[@Price]", "parts": [["[@Qty]", "This row's quantity"], ["*", "Times"], ["[@Price]", "This row's price"]], "eval": [], "say": "Multiply this row's quantity by this row's price.", "out": "Typed once in the Total column, it fills the whole column by itself. That's a calculated column.", "from": "1-4"}, {"t": "ex", "f": "=SUM(tblSales[Total])", "parts": [["SUM(", "Add up"], ["tblSales[Total]", "Every value in the Total column of tblSales"]], "eval": [], "say": "Add up the Total column of the sales table.", "out": "Total revenue. Add a sale to the table and the total includes it, with no formula edit.", "from": "1-4"}, {"t": "tip", "x": "You rarely type structured references. Start a formula, click a table column's cells, and Excel writes the reference for you."}, {"t": "trap", "x": "Fill a structured reference to the **right** and the column names shift, like a relative reference. Copy and paste doesn't shift them. To lock a column, write it as a range of one: `tblSales[[Total]:[Total]]`."}]}, {"id": "nt-why", "h": "Why tables beat plain ranges in formulas", "blocks": [{"t": "table", "head": ["Problem with a plain range", "How a table fixes it"], "rows": [["`=SUM(C2:C80)` misses row 81 when you add a sale", "`=SUM(tblSales[Total])` grows with the table"], ["A chart's range has to be updated every month", "A chart built on a table grows by itself (@@D-3@@)"], ["A formula in one row gets typed differently than the others", "A calculated column keeps every row the same"], ["`C2:C80` says nothing about what's in it", "`tblSales[Total]` says exactly what it is"]]}]}, {"id": "nt-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-210 names \"define a named range,\" \"name a table,\" and \"insert structured references\" (@@1-2@@, @@1-3@@, @@1-4@@). TOSA Expert asks for \"named ranges and defined names\" and \"tables with structured formulas.\" Expect questions on what `[@Qty]` means, why a name can't be TAX2026, and what happens to a table total when a row is added."}]}], "group": "Advanced Formulas", "levels": ["1-2", "1-3", "1-4", "E-3", "F-5", "D-3", "M-2"], "kw": "AVERAGE PMT SUM Named ranges and structured references Formulas that read like sentences"}]</script>
<script>
/* Excel Quest Codex renderer. Needs esc() and fmt() from the main script. Exposes window.XQCodex.
   Routes: #codex (index), #codex-<id> (chapter). */
(function(){
const COLORS = 5;
function cfmt(fmt, s){
  let h = fmt(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/@@([0-9A-Z]-\d+)@@/g, '<a class="lvl-link" href="#level-$1">Level $1</a>');
  h = h.replace(/%%([a-z0-9-]+)(?:\|([^%]+))?%%/g, (m,id,label)=>`<a class="cx-link" href="#codex-${id}">${label||id}</a>`);
  return h;
}
/* Wrap each part's token in the formula with a colored span. Each part claims the first spot not already claimed. */
function anatomy(esc, f, parts){
  const claimed = [];
  const free = (a,b) => claimed.every(([x,y]) => b<=x || a>=y);
  const marks = parts.map((p,i)=>{
    let at=-1, from=0;
    while((from=f.indexOf(p[0], from))!==-1){ if(free(from, from+p[0].length)){ at=from; break; } from++; }
    if(at>=0) claimed.push([at, at+p[0].length]);
    return {at, len:p[0].length, i};
  }).filter(m=>m.at>=0).sort((a,b)=>a.at-b.at);
  let out='', pos=0;
  marks.forEach(m=>{ out += esc(f.slice(pos, m.at)) + `<span class="tk tk${m.i%COLORS}">${esc(f.slice(m.at, m.at+m.len))}</span>`; pos = m.at+m.len; });
  return out + esc(f.slice(pos));
}
function block(esc, fmt, b){
  const F = s => cfmt(fmt, s);
  switch(b.t){
    case 'p': return `<p>${F(b.x)}</p>`;
    case 'list': return `<ul class="cx-list">${b.items.map(x=>`<li>${F(x)}</li>`).join('')}</ul>`;
    case 'steps': return `<ol class="steps cx-steps">${b.items.map(x=>`<li><span>${F(x)}</span></li>`).join('')}</ol>`;

    case 'ex': return `<figure class="anat">
      <div class="anat-top"><b>FORMULA ANATOMY</b>${b.from?`<a class="lvl-link" href="#level-${esc(b.from)}">from Level ${esc(b.from)}</a>`:''}</div>

      ${b.out?`<p class="anat-out"><b>RESULT</b> ${F(b.out)}</p>`:''}
    </figure>`;
  }
  return '';
}
const lvChips = (esc, ls) => ls && ls.length ? `<div class="cx-used"><b>USED IN</b>${ls.map(l=>`<a href="#level-${esc(l)}">${esc(l)}</a>`).join('')}</div>` : '';

function index(esc, fmt, all){

function filter(root, q){
  q = (q||'').trim().toLowerCase(); let shown = 0;
  root.querySelectorAll('.cx-card').forEach(a=>{ const hit = !q || a.dataset.kw.includes(q) || a.textContent.toLowerCase().includes(q); a.hidden = !hit; if(hit) shown++; });

function questCard(lv,q,i){

      <div class="q-title"><h3>${esc(q.t)}</h3><span class="badge ${note?'side':'main'}">${note?'BEST PRACTICE · NOT GRADED':'MAIN QUEST · '+GXP+' XP'}</span></div>
      ${note?'':`<label class="clear locked" title="The grader clears this quest"><input type="checkbox" ${done?'checked':''} disabled> ${done?'Cleared':'Graded quest'}</label>`}
    </div>
    <div class="q-body">
      ${note?`<p class="why"><b>NOTE</b> Not graded and worth no XP, because it leaves no trace in the file. Practice it anyway: the exam can ask about it.</p>`:''}

      ${g?(g.p?`<div class="grade pass"><span class="lbl">PASS</span><span>The grader found this done correctly.</span></div>`:`<div class="grade fail"><span class="lbl">NOT YET</span><span>${esc(g.h||'Not done yet.')}</span></div>`):''}

        <ol class="steps">${q.steps.map(s=>`<li><span>${fmt(s)}</span></li>`).join('')}</ol>
      </details>

      ${q.answer?`<div class="spoil"><button type="button" data-spoil aria-expanded="false">Reveal answer</button><div class="ans" hidden>${fmt(q.answer)}</div></div>`:''}

function failList(lv){

}
function quizItem(x, n){

  return `<article class="kc-item frame" id="kc-${x.id}">

function cyrb53(str, seed){ let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1 = Math.imul(h1^(h1>>>16),2246822507) ^ Math.imul(h2^(h2>>>13),3266489909);
  h2 = Math.imul(h2^(h2>>>16),2246822507) ^ Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2) + (h1>>>0); }

/* ---------- practice test (adaptive, estimate only) ---------- */
const RANK = {Basic:1, Productive:2, Advanced:3, Expert:4}, BDIFF = {1:-1.5, 2:-0.5, 3:0.5, 4:1.5};
const MODES = {quick:{n:20, secs:34*60, key:'_test', name:'QUICK CHECK', lvl:'TOSA Practice', type:'Practice Test'},
               full:{n:35, secs:60*60, key:'_mock', name:'FULL MOCK EXAM', lvl:'TOSA Mock', type:'Mock Exam'}};
const TM = () => MODES[(T && T.mode) || 'quick'];
const andList = a => a.length<3 ? a.join(' and ') : a.slice(0,-1).join(', ')+', and '+a[a.length-1];
let T = null, tTimer = null;
function pickItem(level){
  const used = new Set(T.items.map(x=>x.id));
  for(const d of [0,1,-1,2,-2,3,-3]){ const lv = level+d; if(lv<1||lv>4) continue;
    let pool = QUIZ.filter(x=>RANK[x.band]===lv && !used.has(x.id)); if(!pool.length) continue;
    // spread the questions across the open domains: prefer the domain asked least so far
    const dom = x => x.lvl[0], asked = {}; T.items.forEach(i=>{ const q=QUIZ.find(z=>z.id===i.id); asked[dom(q)]=(asked[dom(q)]||0)+1; });
    const low = Math.min(...pool.map(x=>asked[dom(x)]||0)); pool = pool.filter(x=>(asked[dom(x)]||0)===low);
    return pool[Math.floor(Math.random()*pool.length)]; }
  return null;
}
function estimate(items){
  const p = (th,b) => 0.25 + 0.75/(1+Math.exp(-1.7*(th-b)));
  let best=0, bestLL=-Infinity;
  for(let th=-4; th<=4.0001; th+=0.01){ let ll = -(th*th)/(2*1.5*1.5);
    items.forEach(x=>{ const pr=p(th, BDIFF[RANK[x.band]]); ll += x.ok ? Math.log(pr) : Math.log(1-pr); });
    if(ll>bestLL){ bestLL=ll; best=th; } }
  const pts = [[-3.25,1],[-1.5,351],[-0.5,551],[0.5,726],[1.5,876],[2.3,1000]];
  let sc; if(best<=pts[0][0]) sc=1; else if(best>=pts[pts.length-1][0]) sc=1000;
  else for(let i=1;i<pts.length;i++){ if(best<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; sc=y0+(y1-y0)*(best-x0)/(x1-x0); break; } }
  return Math.max(1, Math.min(1000, Math.round(sc)));
}
function startTest(mode){
  T = {mode: MODES[mode] ? mode : 'quick', items:[], level:2, start:Date.now(), done:false, cur:null};
  T.cur = pickItem(T.level); tick(); clearInterval(tTimer); tTimer = setInterval(tick, 1000);
}
function secsLeft(){ return T ? Math.max(0, TM().secs - Math.floor((Date.now()-T.start)/1000)) : TM().secs; }
function tick(){ if(!T || T.done) { clearInterval(tTimer); return; } const s=secsLeft(); const el=document.getElementById('t-timer'); if(el) el.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s<=0) finishTest(); }
function answerTest(pick){
  const x = T.cur; const ok = pick===x.a;
  T.items.push({id:x.id, band:x.band, pick, ok});
  T.level = ok ? Math.min(4, T.level+1) : Math.max(1, T.level-1);
  if(T.items.length>=TM().n){ finishTest(); return; }
  T.cur = pickItem(T.level); if(!T.cur){ finishTest(); return; }
  route();
}
function finishTest(){
  if(!T || T.done) return; T.done = true; clearInterval(tTimer);
  T.score = T.items.length ? estimate(T.items) : 1;
  const t = tsave[TM().key] || {runs:0, best:0};
  t.runs = (t.runs||0)+1; t.best = Math.max(t.best||0, T.score); t.last = {score:T.score, n:T.items.length, right:T.items.filter(x=>x.ok).length, at:new Date().toISOString().slice(0,10)};
  tsave[TM().key] = t; persist(); route();
}

/* ---------- router ---------- */
function route(){
  const h = (location.hash||'#map').slice(1);
  let html, nav='map';
  if(h.startsWith('level-')){ const id=h.slice(6); track = isT(id)?'tosa':'mos'; nav = 'map'; html = levelScreen(id); }
  else if(h==='tosa' || /^world-[A-Z]$/.test(h)){ track='tosa'; nav='map'; html = tosaMapScreen(); }
  else if(h==='tosa-test'){ track='tosa'; nav='map'; html = testScreen(); }
  else if(window.XQFM && XQFM.owns(h)){ html = XQFM.screen(h, {MOS, TOSA, levelStats}); nav = h==='backup' ? 'map' : 'modeling'; }
  else if(h==='codex' || h.startsWith('codex-')){ html = codexScreen(h); nav='codex'; }
  else if(h==='codes'){ html = codesScreen() + (window.XQFM ? XQFM.codes({MOS, TOSA, levelStats}) : ''); nav='codes'; }
  else if(h==='exam' || h.startsWith('exam-')){ html = examScreen(); nav='exam'; }
  else { track='mos'; html = mapScreen(); }
  app.innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if(h.startsWith('world-') || h.startsWith('exam-')){ const el=document.getElementById(h); if(el) el.scrollIntoView(); }
  else if(h!=='tosa-test' || !T || T.done || !T.items.length) window.scrollTo(0,0);
  updateHud();
  if(window.XQFM) XQFM.after(h, {MOS, TOSA, levelStats});
}

async function turnIn(file){
  const lid = (location.hash||'').replace('#level-','');
  const msg = document.getElementById('turnin-msg');
  if(!file || !msg) return;
  if(!/\.xls[xm]$/i.test(file.name)){ msg.className='turnin-msg err'; msg.textContent='That isn\'t an Excel workbook. Turn in the .xlsx (or .xlsm) file you saved.'; return; }
  if(typeof JSZip==='undefined'){ msg.className='turnin-msg err'; msg.textContent='The grader couldn\'t load. Check your internet connection and reload the page.'; return; }
  msg.className='turnin-msg'; msg.textContent='Grading ' + file.name + '...';
  try {
    const res = await XQ.grade(lid, await file.arrayBuffer());
    const lv = ALL.find(l=>l.id===lid), sv = S(lid);
    sv._g = sv._g || {}; sv._gs = sv._gs || {};
    let passed=0, total=0;
    lv.quests.forEach((q,i)=>{ if(q.side) return; const r=res[i]; if(!r) return; total++; const k=qkey(lid,i);
      sv._g[k] = r.pass ? {p:1} : {p:0, h:r.hint}; if(r.pass){ passed++; sv[k]=1; } });
    sv._gs[lid] = {passed, total};
    persist(); route();
    const m2 = document.getElementById('turnin-msg');
    m2.className = 'turnin-msg ' + (passed===total?'ok':'');
    m2.textContent = passed===total ? `All ${total} quests passed. Level cleared!` : `${passed} of ${total} quests passed. The list below shows what to fix. Fix them in Excel, save, and turn it in again.`;
    if(res.calcManual){ const w=document.createElement('p'); w.className='turnin-msg err'; w.textContent='Heads up: this file was saved with Manual calculation, so some numbers may be out of date (Excel shows them with a line through them). In Excel choose Formulas, Calculation Options, Automatic. Then save and turn it in again.'; m2.after(w); }
    document.getElementById('turnin').scrollIntoView({block:'start'});
  } catch(e){ msg.className='turnin-msg err'; msg.textContent = (e && e.msg) || 'Something went wrong reading that file.'; }
}

app.addEventListener('dragover', e=>{ const d=e.target.closest('#dropzone'); if(d){ e.preventDefault(); d.classList.add('over'); } });
app.addEventListener('dragleave', e=>{ const d=e.target.closest('#dropzone'); if(d) d.classList.remove('over'); });
app.addEventListener('drop', e=>{ const d=e.target.closest('#dropzone'); if(d){ e.preventDefault(); d.classList.remove('over'); turnIn(e.dataTransfer.files[0]); } });

let dl = null; let dlTried = false;
async function getDownloads(){ if(dlTried) return dl; dlTried = true; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e){ dl = null; } return dl; }
app.addEventListener('click', async e=>{
  const sb = e.target.closest('[data-send]');
  if(sb){ sendResults(sb); return; }
  const qb = e.target.closest('[data-quiz]');
  if(qb){ const id=qb.dataset.quiz, pick=+qb.dataset.pick, x=QUIZ.find(q=>q.id===id);
    tsave._qp = tsave._qp || {}; tsave._qf = tsave._qf || {}; tsave._qp[id] = pick; if(tsave._qf[id]===undefined) tsave._qf[id] = (pick===x.a); persist();
    const n = quizFor(x.lvl).indexOf(x)+1; const el=document.getElementById('kc-'+id); el.outerHTML = quizItem(x, n);
    const sc=document.getElementById('kc-score'); if(sc) sc.textContent = quizDone(x.lvl)+'/'+quizFor(x.lvl).length; updateHud(); return; }
  const rb = e.target.closest('[data-retry]');
  if(rb){ const id=rb.dataset.retry, x=QUIZ.find(q=>q.id===id); delete (tsave._qp||{})[id]; persist();
    const el=document.getElementById('kc-'+id); el.outerHTML = quizItem(x, quizFor(x.lvl).indexOf(x)+1); return; }
  const tp = e.target.closest('[data-tpick]');
  if(tp && T && !T.done){ answerTest(+tp.dataset.tpick); return; }
  const ts = e.target.closest('[id^="t-start"]') || e.target.closest('#t-again'); if(ts){ startTest(ts.dataset.mode); route(); return; }
  if(e.target.closest('#t-quit')){ finishTest(); return; }
  const jb = e.target.closest('[data-jump]');
  if(jb){ const el = document.getElementById(jb.dataset.jump); if(el){ el.scrollIntoView({block:'start'}); const d=el.querySelector('details.walk'); if(d) d.open=true; } return; }
  const sp = e.target.closest('[data-spoil]');
  if(sp){ const a = sp.nextElementSibling; a.hidden = !a.hidden; sp.setAttribute('aria-expanded', String(!a.hidden)); sp.textContent = a.hidden?'Reveal answer':'Hide answer'; return; }
  const fb = e.target.closest('[data-file]');
  if(fb){
    const msg = fb.closest('.box').querySelector('.loot-msg');
    const name = fb.dataset.file;
    if(DATA.standalone){ const a=document.createElement('a'); a.href='files/'+encodeURIComponent(name); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = 'Downloading ' + name + '. Open it in Excel and start with the Mission sheet.'; return; }
    msg.textContent = 'Loading ' + name + '...';
    const d = await getDownloads();
    if(!d){ msg.textContent = "Downloads aren't available in this view. Ask your teacher for " + name + '.'; return; }
    try {
      const b64 = FILES[name]; if(!b64) throw new Error('missing');
      const bin = atob(b64); const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      await d.save({filename: name, data: bytes});
      msg.textContent = 'Saved ' + name + '. Open it in Excel and start with the Mission sheet.';
    } catch(err){
      const code = err && err.code;
      msg.textContent = code==='declined' ? 'Download canceled.' : code==='rate_limited' ? 'A download prompt is already open. Finish that one first.' : "Couldn't download " + name + '. Ask your teacher for a copy.';
    }
    return;
  }
  if(e.target.id==='reset-btn'){ document.getElementById('reset-confirm').hidden=false; }
  if(e.target.id==='reset-no'){ document.getElementById('reset-confirm').hidden=true; }
  if(e.target.id==='reset-yes'){ if(e.target.dataset.track==='tosa') tsave={}; else save={}; persist(); route(); }
});
route();
})();
</script>

</body>
</html>
