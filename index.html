holds 45."}, {"t": "Format the deposit as a percent", "why": "0.25 looks like a quarter of a dollar. The deposit is 25% of the weekly rate.", "task": "Format Prices!E4:E15 as Percentage with 0 decimal places.", "steps": ["Select Prices!E4:E15.", "Click the % button on the Home tab (Percent Style). It shows 0 decimals by default."]}, {"t": "Show dates in long form", "why": "The owner wants the date each item was added to read like a sentence, not 45370.", "task": "Format Prices!F4:F15 as Long Date.", "steps": ["Select Prices!F4:F15.", "Open the Number Format box on the Home tab and choose Long Date.", "If you see ####, widen column F."]}, {"t": "Wrap the notes", "why": "The notes run past the edge of the page. Wrapping keeps them inside their column.", "task": "Turn on Wrap Text for Prices!G4:G15 and make column G at least 30 wide.", "steps": ["Select Prices!G4:G15 and choose [[Home > Wrap Text]].", "Right-click the G column header, choose Column Width, type 32, and click OK."]}, {"t": "Add borders", "why": "Grid lines don't print by default. Borders do.", "task": "Add All Borders to Prices!A3:G15.", "steps": ["Select Prices!A3:G15.", "On the Home tab, open the Borders menu (next to Underline) and choose All Borders."]}, {"t": "Use a cell style for the totals", "why": "Cell styles apply a whole look in one click, and they match the workbook's theme.", "task": "Apply the Total cell style to Prices!A16:G16.", "steps": ["Select Prices!A16:G16.", "Choose [[Home > Cell Styles]] and click Total (under Titles and Headings)."]}, {"t": "Copy the header look with Format Painter", "why": "The Lessons sheet should match the Prices sheet without restyling it by hand.", "task": "Use Format Painter to copy the format of Prices!A3:G3 onto Lessons!A3:D3.", "steps": ["Select Prices!A3:G3.", "Click Format Painter (the paintbrush) on the Home tab.", "Click the Lessons tab and drag across A3:D3."], "tip": "Double-click the paintbrush to keep it on for several ranges. Press {{Esc}} to stop."}]}, {"id": "M-2", "world": "M", "track": "tosa", "name": "Table Terrace", "domain": "Formatting: tables, table styles, conditional formatting, themes", "exam": "TOSA Formatting · Productive band (551-725)", "band": "Productive", "scenario": "Bay Fitness", "story": "The gym's class schedule is a plain range that nobody can read at a glance. The manager wants full classes flagged, the emptiest classes called out for cutting, double-booked class names caught, and the whole workbook in the gym's new look.", "goal": "A schedule table with a total row, full classes in red, the five emptiest classes flagged, duplicates caught, a new theme, and a cleaned-up Notes sheet.", "files": [["TM-2_Bay_Fitness_Classes.xlsx", "Practice workbook"]], "items": ["Format as Table", "Table names", "Total row", "Table style options", "Highlight Cells Rules", "Top/Bottom Rules", "Duplicate values", "Themes", "Clear Formats"], "quests": [{"t": "Format the schedule as a table", "why": "A table adds filter buttons, banded rows, and a total row, and it grows when new classes are added.", "task": "Format Classes!A1:G41 as a table (any style) and name it tblClasses.", "steps": ["Click any cell in Classes!A1:G41 and choose [[Home > Format as Table]]. Pick any style.", "Make sure My table has headers is checked and click OK.", "On the Table tab, type tblClasses in the Table Name box and press {{Return}}."]}, {"t": "Show Fill % as a percent", "why": "0.85 is hard to read. 85% isn't.", "task": "Format Classes!G2:G41 as Percentage with 0 decimal places.", "steps": ["Select Classes!G2:G41 and click the % button on the Home tab."]}, {"t": "Add a total row", "why": "The manager wants total bookings and the average fill rate under the table, without writing formulas.", "task": "Turn on the table's Total Row. Show the Sum of Booked (F) and the Average of Fill % (G).", "steps": ["Click in the table. On the Table tab, check Total Row.", "In the total row, click the Booked cell, open its arrow, and choose Sum.", "Click the Fill % cell in the total row, open its arrow, and choose Average. Clear any total under other columns by choosing None."]}, {"t": "Change the table style options", "why": "The class names should stand out, and the stripes make this short table look busy.", "task": "On the Table tab, turn on First Column and turn off Banded Rows.", "steps": ["Click in the table.", "On the Table tab, check First Column and uncheck Banded Rows."]}, {"t": "Flag full classes", "why": "Classes over 90% full need a second time slot.", "task": "Add a Highlight Cells rule to Classes!G2:G41: Greater Than 0.9, with Light Red Fill with Dark Red Text.", "steps": ["Select Classes!G2:G41.", "Choose [[Home > Conditional Formatting > Highlight Cells Rules > Greater Than]].", "Type 0.9 (or 90%), choose Light Red Fill with Dark Red Text, and click OK."], "trap": "Type 0.9, not 90. The cells hold decimals, so 90 would never be reached."}, {"t": "Flag the five emptiest classes", "why": "The manager is cutting the five classes with the fewest bookings.", "task": "Add a Bottom 10 Items rule to Classes!F2:F41, changed to the bottom 5, with any format.", "steps": ["Select Classes!F2:F41.", "Choose [[Home > Conditional Formatting > Top/Bottom Rules > Bottom 10 Items]].", "Change 10 to 5, pick a format, and click OK."]}, {"t": "Catch duplicate class names", "why": "Two classes with the same name confuse members. The manager wants them easy to spot.", "task": "Highlight duplicate values in Classes!A2:A41.", "steps": ["Select Classes!A2:A41.", "Choose [[Home > Conditional Formatting > Highlight Cells Rules > Duplicate Values]] and click OK."]}, {"t": "Apply a new theme", "why": "A theme changes the fonts and colors of the whole workbook in one step, including the table and cell styles.", "task": "Apply any theme other than Office.", "steps": ["Choose [[Page Layout > Themes]] and click any theme except Office.", "Watch the table colors and fonts change across every sheet."]}, {"t": "Clear the messy formatting", "why": "Someone painted the Notes sheet in five colors and three fonts. The text is fine, but the formatting has to go.", "task": "Clear only the formats from Notes!A1:D20, keeping the text.", "steps": ["Select Notes!A1:D20.", "Choose [[Home > Clear > Clear Formats]] (the eraser)."], "trap": "Clear All and Delete remove the text too. Choose Clear Formats."}]}, {"id": "M-3", "world": "M", "track": "tosa", "name": "Custom Canyon", "domain": "Formatting: custom number formats, data bars, icon sets, formula rules, sparklines", "exam": "TOSA Formatting · Advanced band (726-875)", "band": "Advanced", "scenario": "Coconut Grove Concert Series", "story": "The promoters get a season report every week, and they skim it on their phones. They want revenue in thousands, attendance labeled, visual cues instead of raw numbers, weekend shows marked, and a tiny trend line for every artist.", "goal": "A skimmable report: custom formats in K and fans, data bars, arrows, a color scale, weekend shows highlighted, conditional rules in the right order, and sparklines with the high point marked.", "files": [["TM-3_Concert_Report.xlsx", "Practice workbook"]], "items": ["Custom number formats", "Thousands (K)", "Text in formats", "Data bars", "Icon sets", "Color scales", "Formula rules", "WEEKDAY", "Rule order", "Sparklines", "Sparkline markers"], "quests": [{"t": "Show revenue in thousands", "why": "$48,250 is precise. $48.3K is skimmable, and the promoters only skim.", "task": "Give Sales!F2:F31 the custom number format `$#,##0.0,\"K\"`.", "steps": ["Select Sales!F2:F31 and press {{Cmd+1}}.", "On the Number tab choose Custom. In the Type box, type `$#,##0.0,\"K\"` and click OK."], "tip": "The comma before \"K\" divides the displayed number by 1,000. The value in the cell doesn't change.", "answer": "`$#,##0.0,\"K\"`"}, {"t": "Add a word to a number format", "why": "Attendance should read 1,240 fans while staying a real number that can be added up.", "task": "Give Sales!G2:G31 the custom number format `#,##0 \"fans\"`.", "steps": ["Select Sales!G2:G31, press {{Cmd+1}}, choose Custom, type `#,##0 \"fans\"`, and click OK."], "trap": "Don't type the word into the cells. That turns the numbers into text."}, {"t": "Data bars for tickets", "why": "Bars inside the cells show which shows sold best without reading a single number.", "task": "Add data bars (any color) to Sales!D2:D31.", "steps": ["Select Sales!D2:D31.", "Choose [[Home > Conditional Formatting > Data Bars]] and pick any color."]}, {"t": "Arrows for growth", "why": "Promoters want up, flat, or down at a glance.", "task": "Add a 3 Arrows icon set to Sales!H2:H31.", "steps": ["Select Sales!H2:H31.", "Choose [[Home > Conditional Formatting > Icon Sets]] and pick 3 Arrows (Colored)."]}, {"t": "Color scale for ratings", "why": "A color scale turns the fan ratings into a heat map: green is good and red needs attention.", "task": "Add a Green - Yellow - Red color scale to Sales!E2:E31.", "steps": ["Select Sales!E2:E31.", "Choose [[Home > Conditional Formatting > Color Scales]] and pick Green - Yellow - Red."]}, {"t": "Mark weekend shows with a formula rule", "why": "Weekend shows are priced differently, so their dates should stand out.", "task": "Add a formula rule to Sales!A2:A31 that fills dates falling on Saturday or Sunday: `=WEEKDAY(A2,2)>5`.", "steps": ["Select Sales!A2:A31 with A2 as the active cell.", "Choose [[Home > Conditional Formatting > New Rule]]. Set Style to Classic, then choose Use a formula to determine which cells to format.", "Type `=WEEKDAY(A2,2)>5`, pick a fill under Format with (or Custom Format), and click OK."], "tip": "With WEEKDAY(date,2), Monday is 1 and Sunday is 7, so anything over 5 is a weekend. Write the formula for the first cell. Excel adjusts it for the rest.", "answer": "`=WEEKDAY(A2,2)>5`"}, {"t": "Fix the rule order", "why": "An artist with $600K in sales shows yellow instead of green. Both rules match, and the yellow one (300,000 or more) sits on top, so it wins.", "task": "On Summary!G2:G9, move the green rule (500,000 or more) above the yellow rule (300,000 or more).", "steps": ["Select Summary!G2:G9 and choose [[Home > Conditional Formatting > Manage Rules]].", "Select the rule Cell Value >= 500000 (green) and move it to the top with the up arrow (or drag it above the yellow rule). Click OK."], "trap": "When two rules set the same thing, like fill, the rule higher in the list wins. Put the strictest rule first."}, {"t": "Add sparklines", "why": "A tiny line next to each artist shows the four-month trend without a full chart.", "task": "Add Line sparklines in Summary!F2:F9 from the monthly numbers in Summary!B2:E9.", "steps": ["Select Summary!F2:F9.", "Choose [[Insert > Sparklines > Line]]. Data Range: B2:E9. Location: F2:F9 (already filled in). Click OK."]}, {"t": "Mark the high point", "why": "The promoters want to see each artist's best month.", "task": "Turn on the High Point marker for the sparklines.", "steps": ["Click any sparkline in F2:F9.", "On the Sparkline tab, check High Point."]}]}, {"id": "M-4", "world": "M", "track": "tosa", "name": "Format Fortress", "domain": "Formatting: whole-row rules, conditional number formats, custom styles, objects", "exam": "TOSA Formatting · Expert band (876-1000)", "band": "Expert", "scenario": "Everglades Eco Tours", "story": "The booking tracker drives every phone call the office makes. Unpaid bookings need to light up across the whole row, big balances need to jump out, group sizes need labels, and a broken rule someone left behind is slowing the sheet down.", "goal": "A self-flagging tracker: whole-row rules for unpaid and big-balance bookings, a broken rule removed, conditional and accounting-style custom formats, a short date format, a custom header style, and a labeled banner with alt text.", "files": [["TM-4_Eco_Tours_Tracker.xlsx", "Practice workbook"]], "items": ["Mixed references in rules", "Whole-row formatting", "Font rules", "Managing rules", "Format sections", "Conditional formats [>=]", "Custom date formats", "New Cell Style", "Shapes", "Alt text"], "quests": [{"t": "Light up unpaid rows", "why": "The office calls unpaid bookings first. The whole row should turn orange, not just one cell.", "task": "Add a formula rule to Tracker!A2:H61 with the formula `=$G2=\"N\"` and any fill color.", "steps": ["Select Tracker!A2:H61 with A2 as the active cell.", "Choose [[Home > Conditional Formatting > New Rule]], then Classic, then Use a formula to determine which cells to format.", "Type `=$G2=\"N\"`, choose a fill (Custom Format, Fill tab), and click OK."], "tip": "The $ locks column G, so every cell in the row checks the Paid column. The 2 stays relative, so each row checks its own row.", "trap": "Without the $, column B would check H2, column C would check I2, and so on. Only some cells would light up.", "answer": "`=$G2=\"N\"`"}, {"t": "Bold red text for big balances", "why": "Balances over $500 need a call from the manager, not a front-desk volunteer.", "task": "Add a second formula rule to Tracker!A2:H61, `=$H2>500`, that makes the text bold and red.", "steps": ["With A2:H61 still selected, add another New Rule with Use a formula.", "Type `=$H2>500`. Under Custom Format, on the Font tab, choose Bold and a red color. Click OK."], "answer": "`=$H2>500`"}, {"t": "Delete the broken rule", "why": "An old rule points at a deleted column and shows #REF!. Broken rules slow the sheet down and do nothing.", "task": "Delete the conditional formatting rule on the Tracker sheet whose formula contains #REF!.", "steps": ["Choose [[Home > Conditional Formatting > Manage Rules]] and set Show formatting rules for to This Sheet.", "Select the rule with #REF! in its formula, click the minus (Delete Rule) button, and click OK."]}, {"t": "Accounting-style negatives", "why": "Refunds show as negative balances. Accountants want them red and in parentheses.", "task": "Give Tracker!H2:H61 the custom format `$#,##0.00;[Red]($#,##0.00)`.", "steps": ["Select Tracker!H2:H61, press {{Cmd+1}}, choose Custom, type `$#,##0.00;[Red]($#,##0.00)`, and click OK."], "tip": "A number format has up to four sections separated by semicolons: positive; negative; zero; text.", "answer": "`$#,##0.00;[Red]($#,##0.00)`"}, {"t": "Label big groups with a conditional format", "why": "Groups of 8 or more need the big airboat. A number format can label them with no extra column.", "task": "Give Tracker!E2:E61 the custom format `[Blue][>=8]0\" group\";0`.", "steps": ["Select Tracker!E2:E61, press {{Cmd+1}}, choose Custom, type `[Blue][>=8]0\" group\";0`, and click OK.", "Groups of 8 or more show in blue with the word group."], "answer": "`[Blue][>=8]0\" group\";0`"}, {"t": "A short custom date", "why": "The phone list needs the weekday, like Sat, Mar 14, so callers know which day the tour is.", "task": "Give Tracker!B2:B61 the custom format `ddd, mmm d`.", "steps": ["Select Tracker!B2:B61, press {{Cmd+1}}, choose Custom, type `ddd, mmm d`, and click OK."], "tip": "ddd is the short weekday, dddd the full weekday, mmm the short month, and mmmm the full month.", "answer": "`ddd, mmm d`"}, {"t": "Create a custom cell style", "why": "Every Eco Tours sheet should use the same header look. A saved style makes that one click.", "task": "Create a cell style named Eco Header (bold, any fill) and apply it to Tracker!A1:H1.", "steps": ["Format Tracker!A1 the way you want (bold and a fill).", "With A1 selected, choose [[Home > Cell Styles > New Cell Style]]. Name it Eco Header and click OK.", "Select Tracker!A1:H1 and click Eco Header in [[Home > Cell Styles]] (under Custom)."]}, {"t": "A labeled banner with alt text", "why": "The office wants a Peak Season banner on the sheet, and screen readers need to know what it says.", "task": "Insert any shape on the Tracker sheet, type Peak Season inside it, and give it alt text.", "steps": ["Choose [[Insert > Shapes]], pick a rectangle, and drag it out to the right of the data.", "Start typing Peak Season while the shape is selected.", "Right-click the shape, choose Edit Alt Text, and type a short description, like Banner reading Peak Season."]}]}, {"id": "D-1", "world": "D", "track": "tosa", "name": "Sort Shore", "domain": "Data manipulation: sorting, filtering, first charts", "exam": "TOSA Data Manipulation · Basic band (351-550)", "band": "Basic", "scenario": "Miami Food Truck Fest", "story": "Three cashiers each sent in their own sales log, and the festival office merged them into one messy sheet. It has duplicate rows and some revenue typed as text. Sponsors want the totals and two simple charts by Friday.", "goal": "A clean vendor log: duplicates removed, revenue stored as real numbers, volunteers and vendors sorted, a vendor bar chart and a category pie for sponsors, a first PivotTable, and a Sunday-only view.", "files": [["TD-1_Food_Truck_Vendors.xlsx", "Practice workbook"]], "items": ["Remove Duplicates", "Text to numbers", "Sort", "Multi-level sort", "Bar chart", "Pie chart", "PivotTable", "AutoFilter"], "quests": [{"t": "Remove duplicate rows", "why": "When the three logs were merged, some sales got counted twice. Every total in the Summary is inflated until they're gone.", "task": "Remove the duplicate rows from Vendors!A1:F70. A row is a duplicate only if all six columns match.", "steps": ["Click any cell in the Vendors data.", "Choose [[Data > Remove Duplicates]].", "Keep all six columns checked and My data has headers checked. Click OK.", "Excel reports how many duplicates it removed. 64 unique rows should remain."]}, {"t": "Convert text to numbers", "why": "Some revenue was typed as text, and text is left out of every total. The Summary's numbers are too low until it's fixed.", "task": "Make every value in Vendors!F2:F65 (Revenue) a real number.", "steps": ["Select Vendors!F2:F65. Text numbers sit on the left side of the cell and may show a small green triangle.", "Choose [[Data > Text to Columns]] and click Finish right away. Excel converts the text to numbers.", "Another way: select one flagged cell, click the warning icon next to it, and choose Convert to Number."], "tip": "Real numbers line up on the right side of the cell. If a number sits on the left, Excel is treating it as text."}, {"t": "Sort by one column", "why": "The volunteer coordinator thanks the hardest workers first.", "task": "Sort the Volunteers sheet (A1:C21) by Hours, largest to smallest.", "steps": ["Click any cell in the Hours column on Volunteers.", "Choose [[Data > Sort Z to A]] (or the Z→A button). The rows move together."], "trap": "Don't select just the Hours column before sorting. If you do and choose Continue with the current selection, the hours get separated from the names."}, {"t": "Sort by two columns", "why": "Sponsors read the vendor log one food category at a time, biggest sale first.", "task": "Sort Vendors!A1:F65 by Category (A to Z), then by Revenue (largest to smallest).", "steps": ["Click any cell in the Vendors data and choose [[Data > Sort]].", "Sort by Category, Values, A to Z. Click + to add a level: Revenue, Values, Largest to Smallest. Click OK."]}, {"t": "Bar chart of vendor revenue", "why": "Sponsors want to see at a glance which trucks earn the most.", "task": "Create a Clustered Bar chart (horizontal bars) from Summary!A1:B9 and title it Revenue by Vendor.", "steps": ["Select Summary!A1:B9.", "Choose [[Insert > Bar > Clustered Bar]]. The bars run sideways.", "Click the chart title and type Revenue by Vendor."], "tip": "Column charts stand up and bar charts lie down. Long labels like vendor names fit better on bar charts."}, {"t": "Pie chart of categories", "why": "A pie shows each food category's share of the festival's sales.", "task": "Create a Pie chart from Summary!D1:E5 and show percentage data labels.", "steps": ["Select Summary!D1:E5 and choose [[Insert > Pie > Pie]].", "Choose [[Chart Design > Add Chart Element > Data Labels > More Data Label Options]]. Check Percentage and uncheck Value."]}, {"t": "Your first PivotTable", "why": "The office wants orders by category without writing a single formula.", "task": "Create a PivotTable on a new sheet from Vendors!A1:F65 with Category in Rows and Sum of Orders in Values. Rename the sheet Pivot.", "steps": ["Click in the Vendors data and choose [[Insert > PivotTable]]. Choose New Worksheet and click OK.", "In the PivotTable Fields pane, drag Category to Rows and Orders to Values. It shows Sum of Orders.", "Double-click the new sheet tab and rename it Pivot."], "tip": "Rows makes one line per category. Values does the math. If it says Count of Orders, click the (i) next to it and choose Sum."}, {"t": "Show only Sunday", "why": "Sunday sales decide next year's Sunday lineup, so the office wants just those rows on screen.", "task": "Turn on filters for Vendors!A1:F65 and filter Day to show only Sun.", "steps": ["Click in the Vendors data and choose [[Data > Filter]]. Arrows appear in the headers.", "Click the Day arrow, uncheck Select All, check Sun, and apply.", "Leave the filter on."], "tip": "Filtering hides rows without deleting them. Use [[Data > Clear]] to show everything again."}]}, {"id": "D-2", "world": "D", "track": "tosa", "name": "Filter Falls", "domain": "Data manipulation: import, advanced filter, chart options, PivotTables", "exam": "TOSA Data Manipulation · Productive band (551-725)", "band": "Productive", "scenario": "Café Cubano Coffee Co.", "story": "The café's suppliers send orders in a CSV file, and the owner is drowning in them. She needs rush orders on top, a report on the expensive coffee orders for her accountant, a chart that settles an argument about prices, and a supplier summary.", "goal": "A supplier workbook: orders imported and sorted by priority, an Advanced Filter report of big coffee orders, a labeled price-vs-cups scatter chart with a trendline, and a sorted PivotTable of spending by supplier and priority.", "files": [["TD-2_Cafe_Cubano_Suppliers.xlsx", "Practice workbook"], ["supplier_orders.csv", "Text file for Quest 1"]], "items": ["Import CSV", "Custom sort", "Advanced Filter", "Criteria range", "Scatter chart", "Axis titles", "Trendline", "PivotTable", "Pivot sorting", "Export"], "quests": [{"t": "Import the supplier CSV", "why": "The orders arrive as a CSV. They need to live inside the workbook so the report and PivotTable can use them.", "task": "Import supplier_orders.csv into a new sheet named Orders, with the data starting in A1 and the first row as headers.", "steps": ["Save supplier_orders.csv in the same folder as the workbook.", "Choose [[File > Import]], pick CSV file, and click Import. Select supplier_orders.csv.", "In the wizard choose Delimited, click Next, check Comma, and click Finish. Choose New Sheet and click OK.", "Rename the new sheet Orders."], "tip": "If Excel opens a Power Query preview instead of the wizard, check that the first row became the headers and click Load. The data lands on a new sheet as a table. Rename that sheet Orders.", "trap": "Double-clicking the CSV opens it as a separate workbook. Import it into this one."}, {"t": "Sort with a custom list", "why": "A to Z puts High before Low and Rush last. The owner needs Rush first, then High, Medium, and Low.", "task": "Sort Orders by Priority in this order: Rush, High, Medium, Low.", "steps": ["Click in the Orders data and choose [[Data > Sort]].", "Sort by Priority. Under Order, choose Custom List.", "Type Rush, High, Medium, Low (one per line or separated by commas), click Add, select the new list, and click OK twice."], "tip": "Custom lists work for anything with a natural order: days of the week, sizes, or school grades."}, {"t": "Pull a report with Advanced Filter", "why": "The accountant only wants orders from Isla Coffee Roasters over $200, copied to their own sheet.", "task": "On the Criteria sheet, type Isla Coffee Roasters in A2 and >200 in B2. Then use Advanced Filter to copy the matching Orders rows to the Report sheet, starting at A3.", "steps": ["On Criteria, type `Isla Coffee Roasters` in A2 and `>200` in B2. The headers in row 1 match the Orders headers.", "Click the Report sheet first, so the results can land there.", "Choose [[Data > Advanced]]. Choose Copy to another location.", "List range: select the Orders data (Orders!$A$1:$I$61). Criteria range: Criteria!$A$1:$B$2. Copy to: Report!$A$3. Click OK."], "trap": "Excel only copies filtered results to the sheet you're on. Start Advanced Filter from the Report sheet, not from Orders."}, {"t": "Scatter chart of price vs cups", "why": "The staff argue about whether raising the price lowers sales. A scatter chart shows the relationship.", "task": "Create a Scatter chart from Pricing!B1:C13, with Average Price (B) on the horizontal axis and Cups Sold (C) on the vertical axis.", "steps": ["Select Pricing!B1:C13.", "Choose [[Insert > X Y (Scatter) > Scatter]]. Excel puts the first column on the horizontal axis."]}, {"t": "Title, axis titles, and a trendline", "why": "A chart without labels can't settle an argument. The trendline shows which way cups go as price goes up.", "task": "Title the scatter chart Price vs Cups Sold. Add axis titles Average Price (horizontal) and Cups Sold (vertical), and add a Linear trendline.", "steps": ["Click the chart title and type Price vs Cups Sold.", "Choose [[Chart Design > Add Chart Element > Axis Titles]] and add Primary Horizontal (Average Price) and Primary Vertical (Cups Sold).", "Choose [[Chart Design > Add Chart Element > Trendline > Linear]]."]}, {"t": "PivotTable by supplier and priority", "why": "The owner wants spending by supplier, broken out by priority, in one grid.", "task": "Create a PivotTable on a new sheet named Pivot from the Orders data. Put Supplier in Rows, Priority in Columns, and Sum of Total in Values.", "steps": ["Click in the Orders data, choose [[Insert > PivotTable]], choose New Worksheet, and click OK.", "Drag Supplier to Rows, Priority to Columns, and Total to Values.", "Rename the sheet Pivot."]}, {"t": "Sort the PivotTable", "why": "The biggest supplier should be at the top when the owner opens the sheet.", "task": "Sort the PivotTable's suppliers by Sum of Total, largest to smallest.", "steps": ["Click the arrow on Row Labels (or Supplier) in the PivotTable.", "Under Sort, choose Descending, and in the By list choose Sum of Total. Close the menu."], "tip": "PivotTables remember this sort. When the data changes and you refresh, the order updates by itself."}, {"t": "Export the report as CSV", "why": "The accountant's software only reads CSV files.", "task": "Save the Report sheet as a CSV file named isla_report.csv, then reopen your .xlsx.", "steps": ["Press {{Cmd+S}} to save the workbook first.", "Click the Report tab. Choose [[File > Save As]], set File Format to CSV UTF-8 (.csv), name it isla_report, and click Save. Click OK on the one-sheet warning.", "Close the CSV without saving and reopen TD-2_Cafe_Cubano_Suppliers.xlsx from [[File > Open Recent]]."], "trap": "Save As switches Excel over to the CSV copy. Always save the .xlsx first, and do the CSV last."}]}, {"id": "D-3", "world": "D", "track": "tosa", "name": "Clean Data Canyon", "domain": "Data manipulation: cleanup, tables, charts that update, PivotTable grouping", "exam": "TOSA Data Manipulation · Advanced band (726-875)", "band": "Advanced", "scenario": "Bayside Books", "story": "The new point-of-sale system exports sales in one jammed-together column, with messy customer names and prices stored as text. The owner wants a clean sales table, a monthly chart that grows on its own, and a PivotTable that shows the trend by month.", "goal": "Clean, analysis-ready sales: split columns, tidy names, real amounts, a sales table, a monthly combo chart that grows as rows are added, and a PivotTable grouped by month with a royalty calculation.", "files": [["TD-3_Bayside_Books_Sales.xlsx", "Practice workbook"]], "items": ["Text to Columns", "TRIM", "PROPER", "VALUE", "Tables", "Combo chart", "Secondary axis", "Charts that grow", "Date grouping", "Calculated field"], "quests": [{"t": "Split one column into three", "why": "The export jammed date, store, and SKU into one column, like 2026-03-04;Downtown;FIC-0153. Nothing can be sorted or summed until they're apart.", "task": "Use Text to Columns to split Raw!A2:A81 at each semicolon into Date (A), Store (B), and SKU (C).", "steps": ["Select Raw!A2:A81.", "Choose [[Data > Text to Columns]]. Choose Delimited and click Next.", "Check Semicolon (uncheck anything else) and click Finish. The dates land in A, stores in B, and SKUs in C."], "trap": "Text to Columns overwrites the columns to the right. That's why B and C were left empty for you."}, {"t": "Clean names with TRIM and PROPER", "why": "Customer names came out with extra spaces and random capitals, like '  mARISOL   vega '. The loyalty mailer needs Marisol Vega.", "task": "Fill Raw!F2:F81 with each Customer (D) trimmed of extra spaces and in proper case.", "steps": ["In F2 type `=PROPER(TRIM(D2))`.", "Fill down to F81."], "tip": "TRIM removes spaces at the start and end and squeezes double spaces down to one. PROPER capitalizes the first letter of each word.", "answer": "`=PROPER(TRIM(D2))`"}, {"t": "Turn text amounts into numbers with VALUE", "why": "Amounts came through as text with spaces, so they can't be added up.", "task": "Fill Raw!G2:G81 with each Amount (E) as a real number, using VALUE and TRIM. Format G as Currency.", "steps": ["In G2 type `=VALUE(TRIM(E2))`.", "Fill down to G81 and choose Currency from the Number Format box."], "answer": "`=VALUE(TRIM(E2))`"}, {"t": "Make it a table", "why": "A table grows by itself when new sales are added, and the PivotTable can read it by name.", "task": "Format Raw!A1:G81 as a table named tblSales.", "steps": ["Click in the data and press {{Cmd+T}} (or [[Home > Format as Table]]). Make sure My table has headers is checked.", "On the Table tab, type tblSales in the Table Name box and press {{Return}}."]}, {"t": "Make the monthly summary a table", "why": "A chart built on a table grows when the table grows. That's the trick to a chart nobody has to fix each month.", "task": "Format Monthly!A1:C10 as a table named tblMonthly.", "steps": ["Click in Monthly!A1:C10 and press {{Cmd+T}}.", "Name the table tblMonthly."]}, {"t": "Combo chart with a secondary axis", "why": "Revenue is in thousands and units are in the hundreds, so they need separate scales.", "task": "From tblMonthly, create a chart with Revenue as clustered columns and Units as a line on the secondary axis. Put the legend at the bottom.", "steps": ["Select Monthly!A1:C10 and choose [[Insert > Column > Clustered Column]].", "Right-click the Units bars and choose Change Series Chart Type. Pick Line.", "Right-click the Units line, choose Format Data Series, and choose Secondary Axis.", "Choose [[Chart Design > Add Chart Element > Legend > Bottom]]."]}, {"t": "Watch the chart grow", "why": "October's numbers just came in. Because the chart reads the table, adding one row updates it with no extra work.", "task": "Type October's row directly under the table: Oct in A11, 18450 in B11, and 612 in C11.", "steps": ["Click Monthly!A11 and type Oct. Press {{Tab}}, type 18450, press {{Tab}}, type 612, and press {{Return}}.", "The table expands to row 11, and the chart adds October on its own."], "tip": "If the chart doesn't grow, the row didn't join the table. Check that the table's banding continues into row 11."}, {"t": "PivotTable grouped by month", "why": "The owner wants revenue by month straight from the daily sales.", "task": "Create a PivotTable on a new sheet named Pivot from tblSales, with Date in Rows grouped by Months and Sum of Amount in Values.", "steps": ["Click in tblSales, choose [[Insert > PivotTable]], and choose New Worksheet. The Table/Range box says tblSales. Click OK.", "Drag Date to Rows and Amount to Values. Rename the sheet Pivot.", "Right-click any date in the PivotTable, choose Group, select Months (and only Months), and click OK."], "tip": "Recent Excel versions may group dates by themselves. Open Group anyway and make sure Months is the only choice selected."}, {"t": "A royalty calculated field", "why": "Authors at the Downtown store get a 10% royalty, and the owner wants it next to revenue.", "task": "Add a calculated field named Royalty to the PivotTable, equal to Amount * 0.1.", "steps": ["Click in the PivotTable and choose [[PivotTable Analyze > Fields, Items & Sets > Calculated Field]].", "Name: Royalty. Formula: `=Amount*0.1` (double-click Amount in the field list to insert it). Click Add, then OK."]}]}, {"id": "D-4", "world": "D", "track": "tosa", "name": "Dashboard Delta", "domain": "Data manipulation: dynamic charts, bubble charts, interactive PivotTables", "exam": "TOSA Data Manipulation · Expert band (876-1000)", "band": "Expert", "scenario": "Everglades Eco Tours", "story": "Before the owner buys the second airboat, investors want one interactive dashboard. They want to compare tours, pick any tour from a dropdown to see its month-by-month revenue, and filter two PivotTables by tour and by date with one click.", "goal": "An investor dashboard: a labeled bubble chart comparing tours, a dropdown-driven chart of any tour's monthly revenue with a season-average series, and two PivotTables controlled together by one slicer and one timeline.", "files": [["TD-4_Eco_Tours_Dashboard.xlsx", "Practice workbook"]], "items": ["Bubble chart", "Labels from cells", "Dropdown selector", "XLOOKUP spill", "Dynamic chart", "Multiple series", "Show Values As", "Average in PivotTables", "Slicers", "Timelines", "Report Connections"], "quests": [{"t": "Bubble chart of the tours", "why": "Investors want to see price, popularity, and revenue for every tour in one picture.", "task": "Create a Bubble chart from Tours!B2:D7, with Avg Price (B) on the horizontal axis, Bookings (C) on the vertical axis, and Revenue (D) as the bubble size.", "steps": ["Select Tours!B2:D7 (numbers only, no headers).", "Choose [[Insert > X Y (Scatter) > Bubble]].", "Check the result: the first column is X, the second is Y, and the third is bubble size. If not, use [[Chart Design > Select Data]] to set X values to B2:B7, Y values to C2:C7, and bubble size to D2:D7."]}, {"t": "Label the bubbles from cells", "why": "Bubbles with no names mean nothing to an investor.", "task": "Add data labels to the bubbles that show the tour names from Tours!A2:A7 (Value From Cells), with no other values.", "steps": ["Click a bubble, then choose [[Chart Design > Add Chart Element > Data Labels > More Data Label Options]].", "In Label Options, check Value From Cells, select Tours!A2:A7, and click OK.", "Uncheck Y Value (and any other value boxes) so only the names show."]}, {"t": "A tour dropdown", "why": "The dashboard should show any tour the investor picks.", "task": "Make Dashboard!B2 a dropdown list that pulls from Tours!A2:A7, and pick Night Gator Spotting.", "steps": ["Click Dashboard!B2 and choose [[Data > Data Validation]]. Allow: List. Source: `=Tours!$A$2:$A$7`. Click OK.", "Use the arrow in B2 to choose Night Gator Spotting."]}, {"t": "Pull the chosen tour's months with XLOOKUP", "why": "The chart needs one column that changes whenever the dropdown changes.", "task": "In Dashboard!B5, use XLOOKUP to return the column of monthly revenue (Monthly!B2:G13) for the tour named in B2. The result spills down to B16.", "steps": ["In Dashboard!B5 type `=XLOOKUP($B$2,Monthly!$B$1:$G$1,Monthly!$B$2:$G$13)`.", "It spills 12 months down to B16. Change B2 and watch the numbers change."], "tip": "XLOOKUP searches the header row and returns the whole matching column. That's a two-way lookup in one formula.", "answer": "`=XLOOKUP($B$2,Monthly!$B$1:$G$1,Monthly!$B$2:$G$13)`"}, {"t": "A chart that follows the dropdown", "why": "This is the dashboard's centerpiece: one chart that redraws for whichever tour is picked.", "task": "Create a Line chart from Dashboard!A4:B16 and title it Monthly Revenue: Selected Tour.", "steps": ["Select Dashboard!A4:B16 and choose [[Insert > Line > Line]].", "Title it Monthly Revenue: Selected Tour.", "Change B2 to another tour. The chart redraws by itself."]}, {"t": "Add the season average as a second series", "why": "Investors want to see whether the chosen tour beats the average.", "task": "Add Dashboard!C4:C16 (Season Average) to the line chart as a second series.", "steps": ["Click the chart and choose [[Chart Design > Select Data]].", "Click + under Legend Entries. Name: =Dashboard!$C$4. Y values: =Dashboard!$C$5:$C$16. Click OK."]}, {"t": "Show each tour's share of revenue", "why": "\"Airboat made $41,000\" means little to an investor. \"Airboat brings in 31% of everything we make\" tells them where the money comes from.", "task": "Build a PivotTable from the Bookings sheet and place it on the Pivot sheet at cell A3. Put Tour in Rows and Revenue in Values. Then change Revenue to show each tour as a percent of the total (% of Column Total), so the column adds up to 100%.", "steps": ["Click the Bookings tab, then click any cell inside the data, like A2.", "Choose [[Insert > PivotTable]]. Excel selects the whole Bookings table for you.", "Under where to place the PivotTable, choose Existing Worksheet. Click in the Location box, click the Pivot tab, then click cell A3. The box fills in Pivot!$A$3. Click OK.", "In the PivotTable Fields pane, drag Tour into Rows and Revenue into Values. Each tour shows its dollar total, with a Grand Total at the bottom.", "In the Values box, click the (i) next to Sum of Revenue. Open Show data as, choose % of Column Total, and click OK.", "Check it: every tour now shows a percent, and the Grand Total shows 100%."], "tip": "Show data as changes how the numbers are displayed, not the data itself. With only one column of numbers, % of Column Total and % of Grand Total give the same result, and either one passes."}, {"t": "Average rating by guide", "why": "Investors also want to know which guides get the best reviews.", "task": "Build a second PivotTable from the Bookings sheet and place it on the Pivot sheet at cell E3. Put Guide in Rows and Rating in Values, then change it from Sum to Average.", "steps": ["Click the Bookings tab, then click any cell inside the data.", "Choose [[Insert > PivotTable]]. Choose Existing Worksheet, click in the Location box, click the Pivot tab, then click cell E3. Click OK.", "Drag Guide into Rows and Rating into Values.", "In the Values box, click the (i) next to Sum of Rating, choose Average, and click OK. Each guide now shows a rating between 1 and 5."], "trap": "Put this one at E3, not A3. Two PivotTables can't overlap."}, {"t": "One slicer for both PivotTables", "why": "When an investor clicks a tour, both PivotTables should filter together.", "task": "Insert a Tour slicer and connect it to both PivotTables on the Pivot sheet.", "steps": ["Click in the first PivotTable and choose [[PivotTable Analyze > Insert Slicer]]. Check Tour and click OK.", "Click the slicer, then choose [[Slicer > Report Connections]]. Check both PivotTables and click OK.", "Click a tour on the slicer and watch both tables change. Clear the filter when you're done."], "tip": "PivotTables built from the same data can share slicers. If one doesn't show in Report Connections, it was built from a different source."}, {"t": "A timeline for both PivotTables", "why": "Investors want to slide through the season month by month.", "task": "Insert a Date timeline and connect it to both PivotTables on the Pivot sheet.", "steps": ["Click in the first PivotTable and choose [[PivotTable Analyze > Insert Timeline]]. Check Date and click OK.", "Click the timeline, then choose [[Timeline > Report Connections]]. Check both PivotTables and click OK.", "Drag across a few months on the timeline to filter, then clear it."], "trap": "Timelines only work with real dates. If Insert Timeline is grayed out, the Date column has text in it."}]}], "coming": {}, "worlds": [{"key": "E", "dom": 1, "short": "Environment", "name": "WORKBOOK WHARF", "open": true, "blurb": "Domain 1, Environment & Methods: sheets, views, printing, protection, and macros. Each level climbs one TOSA score band."}, {"key": "F", "dom": 2, "short": "Functions", "name": "FUNCTIONS FOREST", "open": true, "blurb": "Domain 2, Calculations: from SUM to LAMBDA. Each level climbs one TOSA score band."}, {"key": "M", "dom": 3, "short": "Formatting", "name": "STYLE SUMMIT", "open": true, "blurb": "Domain 3, Formatting: number formats, styles, tables, conditional formatting, and sparklines. Each level climbs one TOSA score band."}, {"key": "D", "dom": 4, "short": "Data Manipulation", "name": "DATA DELTA", "open": true, "blurb": "Domain 4, Data Manipulation: sorting, filtering, cleanup, charts, and PivotTables, ending with an interactive dashboard. Each level climbs one TOSA score band."}], "quiz": [{"id": "f1a", "lvl": "F-1", "band": "Basic", "q": "Which formula adds every value from A1 through A5?", "c": ["`=SUM(A1,A5)`", "`=ADD(A1:A5)`", "`=TOTAL(A1:A5)`", "`=SUM(A1:A5)`"], "a": 3, "why": "The colon means through, so A1:A5 is the whole range. A comma lists separate cells, so `=SUM(A1,A5)` adds only A1 and A5."}, {"id": "f1b", "lvl": "F-1", "band": "Basic", "q": "A cell that holds a date shows ####. What's the most likely cause?", "c": ["The formula has a typo", "The formula divides by zero", "The column is too narrow to show the value", "The cell holds text instead of a number"], "a": 2, "why": "#### just means the value doesn't fit. Widen the column and the date appears."}, {"id": "f1c", "lvl": "F-1", "band": "Basic", "q": "A cell shows #DIV/0!. What happened?", "c": ["The formula divides by zero or by an empty cell", "A function name is misspelled", "A lookup didn't find a match", "The column is too narrow"], "a": 0, "why": "Dividing by 0 or by a blank cell gives #DIV/0!. Fill in the divisor, or use IFERROR to show something else."}, {"id": "f1d", "lvl": "F-1", "band": "Basic", "q": "Which formula causes a #NAME? error?", "c": ["`=SUM(B4:B7)/0`", "`=VLOOKUP(\"x\",A1:B5,2,FALSE)` with no x in the list", "`=B4+B5`", "`=SUMM(B4:B7)`"], "a": 3, "why": "#NAME? means Excel doesn't recognize a name in the formula. SUMM isn't a function."}, {"id": "f1e", "lvl": "F-1", "band": "Basic", "q": "What does `=10+2*3` return?", "c": ["36", "16", "15", "12"], "a": 1, "why": "Excel multiplies before it adds: 2*3 = 6, then 10 + 6 = 16. Write `=(10+2)*3` to get 36."}, {"id": "f1f", "lvl": "F-1", "band": "Basic", "q": "D2 holds `=B2*C2`. You copy D2 down to D3. What formula is in D3?", "c": ["`=B2*C2`", "`=B3*C2`", "`=B3*C3`", "`=C3*D3`"], "a": 2, "why": "Relative references shift by the same amount you moved the formula. One row down means B2 becomes B3 and C2 becomes C3."}, {"id": "f1g", "lvl": "F-1", "band": "Basic", "q": "Which function returns the largest number in a range?", "c": ["LARGEST", "TOP", "MAX", "HIGH"], "a": 2, "why": "MAX returns the largest value and MIN the smallest. The others aren't Excel functions."}, {"id": "f1h", "lvl": "F-1", "band": "Basic", "q": "A1:A5 holds 10, 20, the text n/a, 30, and an empty cell. What does `=COUNT(A1:A5)` return?", "c": ["5", "3", "4", "2"], "a": 1, "why": "COUNT counts only cells with numbers: 10, 20, and 30. COUNTA would return 4, because it counts text too."}, {"id": "f1i", "lvl": "F-1", "band": "Basic", "q": "B2 is exactly 600. What does `=IF(B2>=600,\"Goal\",\"Below\")` return?", "c": ["Below", "Goal", "TRUE", "An error"], "a": 1, "why": ">= means greater than or equal to, so 600 passes the test and IF returns the first result."}, {"id": "f1j", "lvl": "F-1", "band": "Basic", "q": "What does `=MIN(4,9,2,7)` return?", "c": ["2", "4", "9", "7"], "a": 0, "why": "MIN returns the smallest value in the list."}, {"id": "f2a", "lvl": "F-2", "band": "Productive", "q": "What does `=DATE(2026,3,14)` return?", "c": ["The date March 14, 2026, stored as a serial number", "The text 2026-3-14", "The number 2026", "#VALUE!, because DATE needs a text date"], "a": 0, "why": "DATE(year, month, day) builds a real date. Excel stores it as a serial number, so date math works."}, {"id": "f2b", "lvl": "F-2", "band": "Productive", "q": "Which reference stays exactly the same wherever you copy the formula?", "c": ["$A$1", "A1", "A$1", "$A1"], "a": 0, "why": "$ locks what comes after it. $A$1 locks both the column and the row. A$1 and $A1 are mixed references that lock only one."}, {"id": "f2c", "lvl": "F-2", "band": "Productive", "q": "A1 is 6 and B1 is 4. What does `=IF(AND(A1>5,B1<3),\"Yes\",\"No\")` return?", "c": ["Yes", "No", "TRUE", "FALSE"], "a": 1, "why": "AND needs every test to be TRUE. A1>5 is TRUE but B1<3 is FALSE, so AND is FALSE and IF returns No."}, {"id": "f2d", "lvl": "F-2", "band": "Productive", "q": "What does `=OR(FALSE,TRUE,FALSE)` return?", "c": ["FALSE", "1", "#VALUE!", "TRUE"], "a": 3, "why": "OR is TRUE when at least one test is TRUE."}, {"id": "f2e", "lvl": "F-2", "band": "Productive", "q": "What does `=NOT(5>3)` return?", "c": ["TRUE", "5", "3", "FALSE"], "a": 3, "why": "5>3 is TRUE, and NOT flips it to FALSE."}, {"id": "f2f", "lvl": "F-2", "band": "Productive", "q": "Which formula shows today's date (no time) and updates every day?", "c": ["`=TODAY()`", "`=NOW()`", "`=DATE()`", "`=DAY()`"], "a": 0, "why": "TODAY returns the current date. NOW also updates, but it includes the current time."}, {"id": "f2g", "lvl": "F-2", "band": "Productive", "q": "What does `=YEAR(DATE(2026,7,4))` return?", "c": ["2026", "7", "4", "46207"], "a": 0, "why": "YEAR pulls the year out of a date. MONTH and DAY work the same way."}, {"id": "f2h", "lvl": "F-2", "band": "Productive", "q": "A1:A4 holds Ana, 12, an empty cell, and B-7. What does `=COUNTA(A1:A4)` return?", "c": ["1", "3", "2", "4"], "a": 1, "why": "COUNTA counts every cell that isn't empty: Ana, 12, and B-7. COUNT would return 1."}, {"id": "f2i", "lvl": "F-2", "band": "Productive", "q": "In `=VLOOKUP(C2,Rates!$A$2:$C$7,2,FALSE)`, what does FALSE do?", "c": ["Returns FALSE when nothing matches", "Turns off the $ signs", "Searches from the bottom up", "Makes the lookup require an exact match"], "a": 3, "why": "FALSE (or 0) means exact match. Leaving it off gives an approximate match, which can quietly return the wrong row."}, {"id": "f2j", "lvl": "F-2", "band": "Productive", "q": "In `=INDEX(B2:B7,MATCH(\"Fish\",A2:A7,0))`, what does the MATCH part return?", "c": ["The position of Fish in A2:A7, such as 5", "The value next to Fish", "TRUE if Fish is in the list", "The cell address of Fish"], "a": 0, "why": "MATCH returns a position number. INDEX then returns the item at that position from B2:B7."}, {"id": "f2k", "lvl": "F-2", "band": "Productive", "q": "A1 is 85. What does `=IF(A1>=90,\"A\",IF(A1>=80,\"B\",\"C\"))` return?", "c": ["B", "A", "C", "FALSE"], "a": 0, "why": "The first test fails (85 isn't 90 or more), so Excel moves to the inner IF. 85 is 80 or more, so it returns B."}, {"id": "f3a", "lvl": "F-3", "band": "Advanced", "q": "What does `=MID(\"SPX-FIC-0153\",5,3)` return?", "c": ["FIC", "SPX", "-FI", "015"], "a": 0, "why": "MID(text, start, how many). Start at character 5 and take 3 characters: F, I, C."}, {"id": "f3b", "lvl": "F-3", "band": "Advanced", "q": "What does `=REPLACE(\"SPX-FIC-0153\",1,3,\"BAY\")` return?", "c": ["BAYSPX-FIC-0153", "BAY-FIC-0153", "BAY", "SPX-BAY-0153"], "a": 1, "why": "REPLACE swaps out 3 characters starting at position 1 and puts BAY in their place."}, {"id": "f3c", "lvl": "F-3", "band": "Advanced", "q": "What does `=EXACT(\"bay\",\"BAY\")` return?", "c": ["TRUE", "0", "#VALUE!", "FALSE"], "a": 3, "why": "EXACT is case-sensitive. A plain `=\"bay\"=\"BAY\"` would return TRUE."}, {"id": "f3d", "lvl": "F-3", "band": "Advanced", "q": "What does `=ROUND(14.986,2)` return?", "c": ["14.98", "14.99", "15", "14.9"], "a": 1, "why": "ROUND to 2 decimals looks at the third decimal (6) and rounds up."}, {"id": "f3e", "lvl": "F-3", "band": "Advanced", "q": "What does `=INT(-3.7)` return?", "c": ["-3", "3", "-4", "-3.7"], "a": 2, "why": "INT always rounds DOWN to the next whole number. For negative numbers, down means -4. TRUNC(-3.7) would return -3."}, {"id": "f3f", "lvl": "F-3", "band": "Advanced", "q": "What does `=EDATE(DATE(2026,1,31),1)` return?", "c": ["2/28/2026", "3/3/2026", "2/31/2026", "#NUM!"], "a": 0, "why": "EDATE adds whole months. February 2026 has no 31st, so it lands on the last day of the month."}, {"id": "f3g", "lvl": "F-3", "band": "Advanced", "q": "Titles are in column B. Why does `=VLOOKUP(\"Neon Mangroves\",A2:Q31,15,FALSE)` return #N/A?", "c": ["VLOOKUP only searches the first column of its range, which is A", "15 is too many columns", "FALSE should be TRUE", "Titles can't be looked up"], "a": 0, "why": "VLOOKUP can't look in any column but the first, and it can't return values to the left. INDEX/MATCH or XLOOKUP can."}, {"id": "f3h", "lvl": "F-3", "band": "Advanced", "q": "Which function searches across the top row of a table and returns a value from a row below?", "c": ["VLOOKUP", "HLOOKUP", "MATCH", "OFFSET"], "a": 1, "why": "H is for horizontal. HLOOKUP searches the first row, and VLOOKUP searches the first column."}, {"id": "f3i", "lvl": "F-3", "band": "Advanced", "q": "F2 holds the text 2026-03-14. What does `=DATEVALUE(F2)` return?", "c": ["The text unchanged", "14", "The serial number 46095, which can be formatted as a date", "#NAME?"], "a": 2, "why": "DATEVALUE turns a date stored as text into a real date serial number. Format the cell as a date to see 3/14/2026."}, {"id": "f3j", "lvl": "F-3", "band": "Advanced", "q": "`=SORT(UNIQUE(A2:A31))` shows #SPILL!. What's the fix?", "c": ["Clear the cells below the formula so the results have room", "Add $ signs to the range", "Wrap it in IFERROR", "Change SORT to SORTBY"], "a": 0, "why": "Dynamic arrays spill into the cells below. #SPILL! means something is in the way."}, {"id": "f4a", "lvl": "F-4", "band": "Advanced", "q": "`=COUNTIFS(C2:C81,\"Premium\",H2:H81,\"Active\")` counts which rows?", "c": ["Rows that are Premium AND Active", "Rows that are Premium OR Active", "Premium rows, then Active rows, added together", "Only the first matching row"], "a": 0, "why": "Every range and criteria pair in COUNTIFS has to be true for a row to count."}, {"id": "f4b", "lvl": "F-4", "band": "Advanced", "q": "What does `=SUMPRODUCT({1,2,3},{4,5,6})` return?", "c": ["32", "21", "90", "6"], "a": 0, "why": "It multiplies the pairs and adds them up: 1*4 + 2*5 + 3*6 = 4 + 10 + 18 = 32."}, {"id": "f4c", "lvl": "F-4", "band": "Advanced", "q": "For `=DSUM(Members!A1:J81,\"Monthly Fee\",Criteria!A1:B2)` to work, what must Criteria!A1:B1 hold?", "c": ["Any labels you like", "The numbers 1 and 2", "Headers that exactly match column headers in Members!A1:J81", "The word Criteria"], "a": 2, "why": "Database functions match criteria to the table by header name, so the headers must match exactly."}, {"id": "f4d", "lvl": "F-4", "band": "Advanced", "q": "In a criteria range for DSUM or DCOUNT, what does putting conditions on two separate rows mean?", "c": ["AND", "NOT", "OR", "It causes an error"], "a": 2, "why": "Conditions on the same row mean AND. Conditions on different rows mean OR."}, {"id": "f4e", "lvl": "F-4", "band": "Advanced", "q": "A list is filtered to show one coach. What does `=SUBTOTAL(9,E2:E81)` return?", "c": ["The sum of every row, hidden or not", "The count of visible rows", "The 9th value in the list", "The sum of the visible rows only"], "a": 3, "why": "SUBTOTAL ignores rows hidden by a filter. 9 means SUM."}, {"id": "f4f", "lvl": "F-4", "band": "Advanced", "q": "What does `=LET(x,5,y,2,x*y+x)` return?", "c": ["10", "7", "25", "15"], "a": 3, "why": "LET names x = 5 and y = 2, then works out 5*2 + 5 = 15."}, {"id": "f4g", "lvl": "F-4", "band": "Advanced", "q": "Which function returns a random decimal from 0 up to (but not including) 1?", "c": ["RAND", "RANDBETWEEN", "RANDARRAY(1,1,1,10)", "RANDOM"], "a": 0, "why": "RAND takes no arguments. RANDBETWEEN(bottom, top) returns whole numbers in a range."}, {"id": "f4h", "lvl": "F-4", "band": "Advanced", "q": "A report's formula is `=AVERAGE(E2:E80)` but the data runs to E81. What will Excel show?", "c": ["#REF!", "#N/A", "A green error triangle every time", "A normal-looking but wrong result"], "a": 3, "why": "A range that's too short isn't an error to Excel. Click the formula to see its range outlined, or use Trace Precedents."}, {"id": "f4i", "lvl": "F-4", "band": "Advanced", "q": "Which SUBTOTAL function number sums the visible cells and also skips rows you hid by hand?", "c": ["9", "1", "109", "101"], "a": 2, "why": "Adding 100 to a function number makes SUBTOTAL skip manually hidden rows too: 109 is SUM, 101 is AVERAGE."}, {"id": "f5a", "lvl": "F-5", "band": "Expert", "q": "In `=PMT(0.06/12,60,-50000)`, why is the rate divided by 12?", "c": ["To convert a percent to a decimal", "Loans are always 12 months", "PMT requires it to avoid #NUM!", "Monthly payments need a monthly interest rate"], "a": 3, "why": "The rate and the number of periods must use the same unit. 60 monthly payments need a monthly rate."}, {"id": "f5b", "lvl": "F-5", "band": "Expert", "q": "`=PMT(0.005,60,50000)` returns a negative number. Why?", "c": ["The loan is too large", "The rate is too low", "Excel finance functions treat money you pay out as negative", "PMT always returns negatives"], "a": 2, "why": "Money received is positive and money paid is negative. Make the loan amount negative to see a positive payment."}, {"id": "f5c", "lvl": "F-5", "band": "Expert", "q": "`=RATE(60,-1150,56000)` returns about 0.0071. What is that number?", "c": ["The annual rate", "The monthly interest rate; multiply by 12 for the annual rate", "The total interest paid", "The payment as a share of the loan"], "a": 1, "why": "RATE returns the rate per period. These are monthly periods, so multiply by 12 for the annual rate (about 8.5%)."}, {"id": "f5d", "lvl": "F-5", "band": "Expert", "q": "Why is the upfront cost added outside NPV, as in `=NPV(8%,B6:B10)+B3`?", "c": ["NPV treats its first value as arriving one period from now, and the upfront cost is paid today", "NPV can't handle negative numbers", "It's just a style choice", "B3 is text"], "a": 0, "why": "NPV discounts every value it's given, starting one period out. Money spent today shouldn't be discounted."}, {"id": "f5e", "lvl": "F-5", "band": "Expert", "q": "What does `=DATEDIF(DATE(2020,5,15),DATE(2026,11,1),\"y\")` return?", "c": ["5", "7", "65", "6"], "a": 3, "why": "\"y\" counts complete years. May 15, 2026 has passed by November 1, so it's 6."}, {"id": "f5f", "lvl": "F-5", "band": "Expert", "q": "Mon 11/23/2026 to Fri 11/27/2026, with holidays on 11/26 and 11/27. What does NETWORKDAYS return?", "c": ["5", "3", "4", "2"], "a": 1, "why": "5 weekdays, both ends included, minus 2 holidays = 3."}, {"id": "f5g", "lvl": "F-5", "band": "Expert", "q": "12/4/2026 is a Friday. What does `=WORKDAY(DATE(2026,12,4),1)` return?", "c": ["Saturday 12/5/2026", "Friday 12/4/2026", "Thursday 12/3/2026", "Monday 12/7/2026"], "a": 3, "why": "WORKDAY skips weekends, so 1 workday after Friday is Monday."}, {"id": "f5h", "lvl": "F-5", "band": "Expert", "q": "What range does `=OFFSET(C1,8,0,3,1)` refer to?", "c": ["C8:C10", "C1:C3", "K1:M1", "C9:C11"], "a": 3, "why": "Start at C1, move 8 rows down to C9, then take 3 rows by 1 column: C9:C11."}, {"id": "f5i", "lvl": "F-5", "band": "Expert", "q": "What's the main advantage of a named range like AnnualRate in a formula?", "c": ["It makes the formula readable, and it acts like an absolute reference when copied", "It calculates faster than a cell reference", "It can hold more decimals", "It hides the value from other users"], "a": 0, "why": "Names describe what a value is, and they don't shift when you copy the formula."}, {"id": "f6a", "lvl": "F-6", "band": "Expert", "q": "What does `=LAMBDA(x,x*2)(5)` return?", "c": ["5", "10", "x*2", "#CALC!"], "a": 1, "why": "LAMBDA defines a function with a parameter x. The (5) right after it calls the function with x = 5."}, {"id": "f6b", "lvl": "F-6", "band": "Expert", "q": "What does `=REDUCE(0,{1,2,3},LAMBDA(a,b,a+b))` return?", "c": ["{1,3,6}", "0", "6", "3"], "a": 2, "why": "REDUCE runs a total through the list (0+1, then +2, then +3) and returns only the final value, 6."}, {"id": "f6c", "lvl": "F-6", "band": "Expert", "q": "What does `=SCAN(0,{1,2,3},LAMBDA(a,b,a+b))` return?", "c": ["6", "1, 3, 6 as a spilled array", "{0,1,2,3}", "#VALUE!"], "a": 1, "why": "SCAN works like REDUCE but returns every step along the way: a running total."}, {"id": "f6d", "lvl": "F-6", "band": "Expert", "q": "In Microsoft 365, what does `=REGEXTEST(\"SPX-FIC-0153\",\"^SPX\")` return?", "c": ["FALSE", "TRUE", "SPX", "1"], "a": 1, "why": "^ means starts with, so the code passes the test. The REGEX functions (REGEXTEST, REGEXEXTRACT, REGEXREPLACE) are Microsoft 365 only."}, {"id": "f6e", "lvl": "F-6", "band": "Expert", "q": "You define the name TAX as `=LAMBDA(amt,amt*0.07)`. What does `=TAX(200)` return in a cell?", "c": ["#NAME?", "200.07", "14", "0.07"], "a": 2, "why": "A named LAMBDA works like a built-in function. TAX(200) runs 200*0.07 = 14."}, {"id": "f6f", "lvl": "F-6", "band": "Expert", "q": "`=IF(B2>=5000,\"Gold\",IF(B2>=10000,\"Platinum\",\"Standard\"))` never returns Platinum. Why?", "c": ["Any value of 10,000 or more already passes the first test and stops at Gold", "IF can only be nested once", "Platinum needs quotation marks", "The formula needs AND"], "a": 0, "why": "Nested IFs stop at the first TRUE. Test the largest threshold first."}, {"id": "f6g", "lvl": "F-6", "band": "Expert", "q": "What's the difference between IFNA and IFERROR?", "c": ["IFNA is faster but only works on text", "IFNA catches only #N/A, while IFERROR catches every error", "IFERROR only works with VLOOKUP", "There is no difference"], "a": 1, "why": "IFNA is the safer choice for lookups: it handles not found, but a real mistake like #DIV/0! still shows."}, {"id": "f6h", "lvl": "F-6", "band": "Expert", "q": "What does `=REGEXEXTRACT(\"tkt 412 ga\",\"[0-9]+\")` return?", "c": ["tkt", "4", "TRUE", "412"], "a": 3, "why": "[0-9]+ means one or more digits in a row, so it returns the whole run, 412. Without the + it would return only 4."}, {"id": "d1a", "lvl": "D-1", "band": "Basic", "q": "What does [[Data > Remove Duplicates]] do?", "c": ["Highlights repeated rows in red", "Hides repeated rows until you clear the filter", "Deletes rows that repeat, based on the columns you check", "Moves repeated rows to a new sheet"], "a": 2, "why": "Remove Duplicates deletes the repeats for good. Save a copy first if you might need them."}, {"id": "d1b", "lvl": "D-1", "band": "Basic", "q": "A column of numbers sits on the left side of each cell and SUM ignores them. What's the likely cause?", "c": ["The numbers are stored as text", "The column is too narrow", "Calculation is set to Manual", "The cells are merged"], "a": 0, "why": "Numbers stored as text line up on the left and are skipped by SUM. Convert them to numbers."}, {"id": "d1c", "lvl": "D-1", "band": "Basic", "q": "You select only column C and sort it, then choose Continue with the current selection. What happens?", "c": ["The whole table sorts together", "Excel asks for a second sort level", "Nothing happens", "Only column C moves, so its values no longer line up with their rows"], "a": 3, "why": "Sorting one column by itself breaks the rows apart. Click one cell in the column and sort, so the whole table moves together."}, {"id": "d1d", "lvl": "D-1", "band": "Basic", "q": "Which chart type has horizontal bars?", "c": ["Bar", "Column", "Line", "Pie"], "a": 0, "why": "In Excel, column charts stand up and bar charts lie down. Bar charts fit long labels better."}, {"id": "d1e", "lvl": "D-1", "band": "Basic", "q": "Which chart best shows each category's share of a whole?", "c": ["Pie", "Line", "Scatter", "Stock"], "a": 0, "why": "A pie shows parts of 100%. Keep it to a few slices, because too many become hard to read."}, {"id": "d1f", "lvl": "D-1", "band": "Basic", "q": "You turn on AutoFilter and show only Sun. What happens to the other rows?", "c": ["They're deleted", "They're hidden until you clear the filter", "They move to the bottom", "They turn gray"], "a": 1, "why": "Filters hide rows without deleting them. [[Data > Clear]] shows everything again."}, {"id": "d1g", "lvl": "D-1", "band": "Basic", "q": "In the PivotTable Fields pane, which area should a number go in to get a total?", "c": ["Filters", "Columns", "Values", "Rows"], "a": 2, "why": "Values does the math (Sum, Count, Average). Rows and Columns set up the labels."}, {"id": "d1h", "lvl": "D-1", "band": "Basic", "q": "You need sales sorted by Region A to Z, and inside each region by Sales from largest to smallest. How?", "c": ["Sort Sales, then sort Region in a separate step without levels", "Use [[Data > Sort]] with two levels: Region, then Sales", "Use Remove Duplicates", "Filter by Region"], "a": 1, "why": "The Sort dialog's levels run in order: the first level groups the rows, and the second sorts inside each group."}, {"id": "d2a", "lvl": "D-2", "band": "Productive", "q": "You need priorities in the order Rush, High, Medium, Low. What's the right sort?", "c": ["A to Z", "Custom List", "Z to A", "Sort by cell color"], "a": 1, "why": "A to Z would give High, Low, Medium, Rush. A custom list sorts by the order you define."}, {"id": "d2b", "lvl": "D-2", "band": "Productive", "q": "In an Advanced Filter, what must the criteria range's header row match?", "c": ["The sheet names", "The first row of results", "Nothing, because headers are optional", "The column headers of the data, exactly"], "a": 3, "why": "Advanced Filter matches each criteria header to a data column. A spelling difference matches nothing."}, {"id": "d2c", "lvl": "D-2", "band": "Productive", "q": "In a criteria range, two conditions on the SAME row mean:", "c": ["Both conditions (AND)", "Either condition (OR)", "Neither condition", "Only the first condition"], "a": 0, "why": "The same row means AND. Put conditions on separate rows to get OR."}, {"id": "d2d", "lvl": "D-2", "band": "Productive", "q": "Advanced Filter says you can only copy filtered data to the active sheet. What's the fix?", "c": ["Unprotect the workbook", "Turn off AutoFilter", "Start Advanced Filter from the destination sheet", "Copy the results by hand"], "a": 2, "why": "Excel copies results only to the sheet you're on. Click the destination sheet first, then open Advanced Filter."}, {"id": "d2e", "lvl": "D-2", "band": "Productive", "q": "Which chart shows whether two number columns are related, like price and cups sold?", "c": ["Pie", "Scatter (X Y)", "Stacked column", "Doughnut"], "a": 1, "why": "A scatter chart plots one number against another. Add a trendline to show the direction."}, {"id": "d2f", "lvl": "D-2", "band": "Productive", "q": "Where do you add axis titles and a trendline on a Mac?", "c": ["[[Home > Format]]", "[[Data > What-If Analysis]]", "[[View > Page Layout]]", "[[Chart Design > Add Chart Element]]"], "a": 3, "why": "Add Chart Element holds titles, axis titles, data labels, legend, gridlines, and trendlines."}, {"id": "d2g", "lvl": "D-2", "band": "Productive", "q": "You want suppliers down the side and priorities across the top of a PivotTable. Where does Priority go?", "c": ["Rows", "Columns", "Filters", "Values"], "a": 1, "why": "Rows run down the side and Columns run across the top. Together they make a grid."}, {"id": "d2h", "lvl": "D-2", "band": "Productive", "q": "You save a workbook as CSV. What's kept?", "c": ["Every sheet, with formatting", "The active sheet's values only, with no formatting, formulas, or charts", "Formulas and charts", "Only the charts"], "a": 1, "why": "CSV is plain text: one sheet of values separated by commas. Save the .xlsx first."}, {"id": "d3a", "lvl": "D-3", "band": "Advanced", "q": "A2 holds `Downtown;FIC-0153`. Which tool splits it into two columns at the semicolon?", "c": ["Remove Duplicates", "Find and Replace", "Text to Columns", "Consolidate"], "a": 2, "why": "Text to Columns splits by a delimiter (or a fixed width). It overwrites the columns to the right, so leave them empty."}, {"id": "d3b", "lvl": "D-3", "band": "Advanced", "q": "What does `=PROPER(TRIM(\"  mARISOL   vega \"))` return?", "c": ["Marisol Vega", "MARISOL VEGA", "Marisol   Vega", "marisol vega"], "a": 0, "why": "TRIM removes outer spaces and squeezes inner runs down to one space. PROPER capitalizes each word."}, {"id": "d3c", "lvl": "D-3", "band": "Advanced", "q": "E2 holds the text \" 24.99 \". Which formula returns the number 24.99?", "c": ["`=TEXT(E2,\"0.00\")`", "`=TRIM(E2)`", "`=VALUE(TRIM(E2))`", "`=PROPER(E2)`"], "a": 2, "why": "TRIM cleans the spaces, but its result is still text. VALUE turns it into a number."}, {"id": "d3d", "lvl": "D-3", "band": "Advanced", "q": "Why build a chart from an Excel table instead of a plain range?", "c": ["Tables make charts 3-D", "The chart grows when you add rows to the table", "Charts from tables can't be edited", "Tables hide the chart's legend"], "a": 1, "why": "A table expands as you type under it, and any chart or formula that uses it expands too."}, {"id": "d3e", "lvl": "D-3", "band": "Advanced", "q": "Revenue is in the thousands and Units are in the hundreds. How do you show both clearly in one chart?", "c": ["Two pie charts", "A stacked column chart", "Hide the Units series", "Columns for Revenue and a line for Units on a secondary axis"], "a": 3, "why": "A combo chart with a secondary axis gives each series its own scale."}, {"id": "d3f", "lvl": "D-3", "band": "Advanced", "q": "A PivotTable lists every date separately. How do you see totals by month?", "c": ["Sort the dates", "Add Date to Filters", "Right-click a date, choose Group, and select Months", "Change Sum to Count"], "a": 2, "why": "Grouping rolls daily dates up into months, quarters, or years."}, {"id": "d3g", "lvl": "D-3", "band": "Advanced", "q": "What's a PivotTable calculated field?", "c": ["A field made with a formula that uses other fields, like =Amount*0.1", "A formula typed in a cell next to the PivotTable", "A filter on calculated cells", "A number format"], "a": 0, "why": "Calculated fields live inside the PivotTable, so they update when it refreshes."}, {"id": "d3h", "lvl": "D-3", "band": "Advanced", "q": "You change the source data of a PivotTable. What do you do so the PivotTable shows the change?", "c": ["Nothing, it updates instantly", "Delete and rebuild it", "Refresh it ([[PivotTable Analyze > Refresh]])", "Press {{Cmd+Z}}"], "a": 2, "why": "PivotTables read a saved copy of the data (the cache). Refresh reloads it."}, {"id": "d4a", "lvl": "D-4", "band": "Expert", "q": "A bubble chart shows three numbers per point. What's the third?", "c": ["Bubble size", "Bubble color", "The legend", "The chart title"], "a": 0, "why": "X sets the position across, Y sets the height, and the third value sets the bubble size."}, {"id": "d4b", "lvl": "D-4", "band": "Expert", "q": "Which data label option shows names typed in a range of cells, like tour names?", "c": ["Series Name", "Category Name", "Value From Cells", "Percentage"], "a": 2, "why": "Value From Cells uses any range as the labels. Scatter and bubble charts need it, because they don't have category names."}, {"id": "d4c", "lvl": "D-4", "band": "Expert", "q": "B2 is a dropdown, and B5 holds `=XLOOKUP($B$2,Monthly!$B$1:$G$1,Monthly!$B$2:$G$13)`. What does B5 return?", "c": ["One number for January", "The tour name", "The whole column for the tour chosen in B2, spilled down", "#SPILL!, because XLOOKUP can't return columns"], "a": 2, "why": "When the lookup array is a header row, XLOOKUP returns the matching column, which spills down."}, {"id": "d4d", "lvl": "D-4", "band": "Expert", "q": "A chart is built from cells that change when a dropdown changes. What happens to the chart when you pick a new item?", "c": ["It needs a refresh", "It breaks into #REF!", "It must be rebuilt", "It redraws by itself"], "a": 3, "why": "Charts follow their cells, so a dropdown that changes the cells changes the chart. That's how a dynamic chart works."}, {"id": "d4e", "lvl": "D-4", "band": "Expert", "q": "Which Show Values As option gives each row's share of its column's total?", "c": ["% of Grand Total", "% of Column Total", "Running Total In", "Difference From"], "a": 1, "why": "% of Column Total divides each value by its column's total, so each column adds up to 100%."}, {"id": "d4f", "lvl": "D-4", "band": "Expert", "q": "One slicer should filter two PivotTables. What's required?", "c": ["Both are built from the same data source, and Report Connections checks both", "Both PivotTables are on the same sheet", "Both have the same layout", "The workbook is shared"], "a": 0, "why": "Slicers connect to PivotTables that share a data source. Report Connections chooses which ones."}, {"id": "d4g", "lvl": "D-4", "band": "Expert", "q": "Insert Timeline is grayed out. What's the most likely cause?", "c": ["The sheet is protected", "The PivotTable has no field with real dates", "There are too many rows", "Timelines need a chart"], "a": 1, "why": "Timelines only work with date fields. Text that looks like dates won't do."}, {"id": "d4h", "lvl": "D-4", "band": "Expert", "q": "A slicer and a timeline both control a PivotTable. You pick a tour on the slicer and drag across March to May on the timeline. What does the PivotTable show?", "c": ["All tours, March to May", "That tour's rows from March to May", "That tour for the whole year", "Nothing, because they cancel out"], "a": 1, "why": "Filters add up: the PivotTable keeps only rows that pass both."}, {"id": "m1a", "lvl": "M-1", "band": "Basic", "q": "A cell holds 0.25. You click the % button. What does it show?", "c": ["0.25%", "2.5%", "25", "25%"], "a": 3, "why": "Percent Style multiplies the display by 100 and adds %. The cell still holds 0.25."}, {"id": "m1b", "lvl": "M-1", "band": "Basic", "q": "You format 45 as Currency. What's stored in the cell?", "c": ["The text $45.00", "45.00 as text", "45", "4500"], "a": 2, "why": "Formats change how a value looks, not what it is. Formulas still see 45."}, {"id": "m1c", "lvl": "M-1", "band": "Basic", "q": "Which tool copies only the formatting from one range to another?", "c": ["Fill Handle", "Flash Fill", "Format Painter", "AutoFit"], "a": 2, "why": "Format Painter (the paintbrush) copies fonts, fills, borders, and number formats, but not values."}, {"id": "m1d", "lvl": "M-1", "band": "Basic", "q": "A long note runs into the next column. Which option keeps it inside its own cell on several lines?", "c": ["Wrap Text", "Merge & Center", "Shrink to Fit", "Indent"], "a": 0, "why": "Wrap Text breaks the text onto new lines inside the cell, and the row grows taller to fit."}, {"id": "m1e", "lvl": "M-1", "band": "Basic", "q": "Why should you avoid merging cells inside a data table?", "c": ["Merged cells can't hold numbers", "Merged cells break sorting, filtering, and copying", "Merging deletes formatting", "Merged cells print in gray"], "a": 1, "why": "Merge only titles. For the same look without the problems, use Center Across Selection."}, {"id": "m1f", "lvl": "M-1", "band": "Basic", "q": "Where do you find built-in looks like Title, Heading 1, Total, and Good/Bad/Neutral?", "c": ["[[Insert > Shapes]]", "[[Data > Data Tools]]", "[[Home > Cell Styles]]", "[[View > Themes]]"], "a": 2, "why": "Cell styles bundle font, fill, border, and number format, and they follow the workbook theme."}, {"id": "m1g", "lvl": "M-1", "band": "Basic", "q": "A date column shows 46115 instead of a date. What's the fix?", "c": ["Retype every date", "Widen the column", "Apply a date number format", "Use Wrap Text"], "a": 2, "why": "Dates are stored as serial numbers. A date format shows them as dates."}, {"id": "m1h", "lvl": "M-1", "band": "Basic", "q": "Which shortcut opens Format Cells on a Mac?", "c": ["{{Cmd+F}}", "{{Cmd+T}}", "{{Ctrl+F}}", "{{Cmd+1}}"], "a": 3, "why": "Cmd+1 opens Format Cells, where the Number, Alignment, Font, Border, Fill, and Protection tabs live."}, {"id": "m2a", "lvl": "M-2", "band": "Productive", "q": "You turn on a table's Total Row. What formula does Excel put under a numeric column?", "c": ["`=SUM()` of the whole column", "`=TOTAL()`", "`=SUBTOTAL()`, which ignores rows hidden by a filter", "Nothing, because you have to type it"], "a": 2, "why": "Total rows use SUBTOTAL, so the totals follow the filter. Pick Sum, Average, Count, and so on from each cell's arrow."}, {"id": "m2b", "lvl": "M-2", "band": "Productive", "q": "The cells hold 0.95, 0.80, and so on, shown as percents. Which Greater Than value flags classes over 90%?", "c": ["90", "9000", "0.9", "9"], "a": 2, "why": "Rules compare the stored value. 0.9 (or 90%) works, but 90 would never be reached."}, {"id": "m2c", "lvl": "M-2", "band": "Productive", "q": "Which rule highlights the 5 lowest values in a range?", "c": ["Highlight Cells Rules, Less Than", "Data Bars", "Duplicate Values", "Top/Bottom Rules, Bottom 10 Items, set to 5"], "a": 3, "why": "Bottom 10 Items lets you change 10 to any number. Less Than needs a fixed cutoff instead."}, {"id": "m2d", "lvl": "M-2", "band": "Productive", "q": "What does changing the workbook theme do?", "c": ["Changes only the selected cells", "Changes number formats", "Changes theme fonts and colors across every sheet, including tables and cell styles", "Deletes custom formatting"], "a": 2, "why": "Themes set the workbook's color palette and fonts. Anything formatted with theme colors updates."}, {"id": "m2e", "lvl": "M-2", "band": "Productive", "q": "You want to remove fills and fonts but keep the text. Which command?", "c": ["Clear All", "Delete", "Clear Formats", "Clear Contents"], "a": 2, "why": "Clear Formats keeps values. Clear Contents keeps formats. Clear All removes both."}, {"id": "m2f", "lvl": "M-2", "band": "Productive", "q": "Which table option makes the first column bold?", "c": ["Header Row", "Banded Columns", "Filter Button", "First Column"], "a": 3, "why": "Table Style Options on the Table tab control the header row, total row, banding, and first and last column emphasis."}, {"id": "m2g", "lvl": "M-2", "band": "Productive", "q": "Which rule catches names that appear more than once?", "c": ["Unique Values", "Text That Contains", "Duplicate Values", "Above Average"], "a": 2, "why": "Highlight Cells Rules > Duplicate Values flags every repeat. Switch it to Unique to flag one-offs instead."}, {"id": "m2h", "lvl": "M-2", "band": "Productive", "q": "You convert a range to a table. What happens when you type a new row directly under it?", "c": ["Nothing, because tables are fixed", "Excel shows an error", "The row is formatted but left out", "The table grows to include the row"], "a": 3, "why": "Tables expand automatically, along with their formatting, formulas, and anything that uses them."}, {"id": "m3a", "lvl": "M-3", "band": "Advanced", "q": "A cell holds 48250 with the format `$#,##0.0,\"K\"`. What does it show?", "c": ["$48,250.0K", "$48K", "$48.3K", "48.25"], "a": 2, "why": "Each comma after the digits divides the display by 1,000. One decimal gives 48.3."}, {"id": "m3b", "lvl": "M-3", "band": "Advanced", "q": "Why put a word like \"fans\" in the number format instead of typing it in the cell?", "c": ["It saves space", "It's required by Excel", "It makes the text bold", "The value stays a number, so it can still be added up"], "a": 3, "why": "1240 fans typed in a cell is text. As a format, the cell still holds 1240."}, {"id": "m3c", "lvl": "M-3", "band": "Advanced", "q": "Range A2:A31 is selected with A2 active. Which rule formula highlights weekend dates?", "c": ["`=WEEKDAY($A$2,2)>5`", "`=WEEKDAY(A31,2)>5`", "`=WEEKEND(A2)`", "`=WEEKDAY(A2,2)>5`"], "a": 3, "why": "Write the formula for the active cell with a relative reference. Excel shifts it for every other cell. $A$2 would test only one date."}, {"id": "m3d", "lvl": "M-3", "band": "Advanced", "q": "Two rules set a fill on the same cell. Which one shows?", "c": ["The newest rule", "The rule higher in the Manage Rules list", "The rule with the darker color", "Both colors blend"], "a": 1, "why": "Rules run top to bottom, and the higher rule wins when they conflict. Reorder them in Manage Rules."}, {"id": "m3e", "lvl": "M-3", "band": "Advanced", "q": "What's a sparkline?", "c": ["A chart that fills a whole sheet", "A conditional format arrow", "A trendline", "A tiny chart inside one cell"], "a": 3, "why": "Sparklines (Line, Column, Win/Loss) show a trend next to the data. Insert them from [[Insert > Sparklines]]."}, {"id": "m3f", "lvl": "M-3", "band": "Advanced", "q": "Which conditional format shows each value as a bar inside its cell?", "c": ["Color Scales", "Icon Sets", "Data Bars", "Sparklines"], "a": 2, "why": "Data bars compare values by bar length, right in the cells."}, {"id": "m3g", "lvl": "M-3", "band": "Advanced", "q": "In a Green - Yellow - Red color scale, which values turn green?", "c": ["The lowest", "The middle", "The highest", "Only zero"], "a": 2, "why": "The first color named goes to the highest values. Pick Red - Yellow - Green if low is good."}, {"id": "m3h", "lvl": "M-3", "band": "Advanced", "q": "What does the custom format `0.0%` do to 0.1234?", "c": ["Shows 0.1%", "Shows 12%", "Shows 12.3%", "Shows 1234%"], "a": 2, "why": "% multiplies by 100, and 0.0 keeps one decimal: 12.3%."}, {"id": "m4a", "lvl": "M-4", "band": "Expert", "q": "A2:H61 is selected. Which rule formula colors the whole row when column G says N?", "c": ["`=G2=\"N\"`", "`=$G$2=\"N\"`", "`=$G2=\"N\"`", "`=G$2=\"N\"`"], "a": 2, "why": "$G locks the column so every cell checks G. The row stays relative so each row checks itself."}, {"id": "m4b", "lvl": "M-4", "band": "Expert", "q": "A number format has sections separated by semicolons. What's their order?", "c": ["Positive; negative; zero; text", "Negative; positive; zero; text", "Text; zero; negative; positive", "Zero; positive; negative; text"], "a": 0, "why": "Positive;negative;zero;text. For example, `$#,##0.00;[Red]($#,##0.00)` shows negatives in red parentheses."}, {"id": "m4c", "lvl": "M-4", "band": "Expert", "q": "What does the format `[Blue][>=8]0\" group\";0` show for 10 and for 3?", "c": ["10 and 3 in blue", "10 group in blue, and 3", "10 group, and 3 group", "#VALUE!"], "a": 1, "why": "Conditions in brackets let a format change by value: 8 or more gets blue and the word group, and everything else gets plain 0."}, {"id": "m4d", "lvl": "M-4", "band": "Expert", "q": "Which custom format shows 3/14/2026 as Sat, Mar 14?", "c": ["`ddd, mmm d`", "`dddd, mmmm d`", "`dd, mm d`", "`d, m, yy`"], "a": 0, "why": "ddd is the short weekday and mmm the short month. Four letters give the full names."}, {"id": "m4e", "lvl": "M-4", "band": "Expert", "q": "A conditional formatting rule's formula shows #REF!. What's the best fix?", "c": ["Ignore it", "Protect the sheet", "Clear the cell values", "Delete or edit the rule in Manage Rules"], "a": 3, "why": "Broken rules do nothing useful and slow the sheet down. Set Manage Rules to This Sheet to find them."}, {"id": "m4f", "lvl": "M-4", "band": "Expert", "q": "Why create a custom cell style instead of formatting headers by hand?", "c": ["It's the only way to bold text", "Styles can't be changed later", "It shrinks the file", "One click applies the whole look, and editing the style updates every cell that uses it"], "a": 3, "why": "Modify the style once, and every cell using it changes. That keeps reports consistent."}, {"id": "m4g", "lvl": "M-4", "band": "Expert", "q": "Why add alt text to a shape or chart?", "c": ["It prints in the footer", "It names the object for formulas", "It's required to save", "Screen readers read it to people who can't see the object"], "a": 3, "why": "Alt text describes the object for accessibility. Check Accessibility f
