<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Excel Quest Strategy Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: sticky game HUD, then one "screen" at a time (title+map, level, cheat codes, exam day) in a 920px guide column. Single committed 16-bit night palette. */
:root{
  --bg:#15122b; --panel:#221d45; --panel-2:#2c2658; --ink:#f1ecff; --muted:#b4abd8; --line:#4a4185;
  --gold:#f7c548; --gold-ink:#2a1f00; --coral:#ff7a6b; --cyan:#62e0ef; --leaf:#5fd38a; --violet:#a98bff;
  --f-pixel:"Press Start 2P", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hud:"VT323", "Courier New", monospace;
  --px: 4px;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:var(--px) solid var(--line)}
.hud-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-family:var(--f-pixel);font-size:12px;color:var(--gold);text-decoration:none;letter-spacing:.04em;white-space:nowrap}
.hud-stats{font-family:var(--f-hud);font-size:22px;color:var(--muted);display:flex;gap:16px;margin-left:auto;font-variant-numeric:tabular-nums}
.hud-stats b{color:var(--ink);font-weight:400}
.hud-nav{display:flex;gap:6px;flex-wrap:wrap}
.hud-nav a{font-family:var(--f-hud);font-size:20px;text-decoration:none;color:var(--ink);padding:2px 10px;border:2px solid var(--line);background:var(--panel)}
@media (max-width:600px){.hud{position:static}.hud-in{gap:8px}.hud-nav a{font-size:18px;padding:0 8px}.hud-stats{font-size:19px;margin-left:0}}
.hud-nav a[aria-current="page"]{border-color:var(--gold);color:var(--gold)}

/* pixel frame */
.frame{background:var(--panel);box-shadow:0 0 0 var(--px) var(--line), var(--px) var(--px) 0 var(--px) #0b0918;margin:var(--px)}

/* title screen */
.title-screen{text-align:center;padding:56px 12px 40px}
.title-screen .over{font-family:var(--f-hud);font-size:24px;color:var(--cyan);letter-spacing:.12em}
.title-screen h1{font-family:var(--f-pixel);font-size:clamp(30px,8vw,64px);line-height:1.15;margin:14px 0 10px;color:var(--gold);
  text-shadow:4px 4px 0 #b4372b, 8px 8px 0 #0b0918;text-wrap:balance}
.title-screen .sub{font-family:var(--f-pixel);font-size:11px;color:var(--ink);line-height:1.9}
.cart{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.cart span{font-family:var(--f-hud);font-size:20px;padding:2px 10px;background:var(--panel-2);border:2px solid var(--line)}
.press{display:inline-block;margin-top:30px;font-family:var(--f-pixel);font-size:13px;color:var(--ink);text-decoration:none;padding:14px 18px;background:#b4372b;box-shadow:0 0 0 var(--px) #0b0918}
.press:hover{background:#cf4436}
@media (prefers-reduced-motion:no-preference){.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:.25}}}

/* how-to */
.howto{padding:20px 22px;margin-top:8px}
.howto h2,.section-h{font-family:var(--f-pixel);font-size:14px;color:var(--gold);margin:0 0 14px;line-height:1.6}
.howto ol{margin:0;padding-left:22px;display:grid;gap:6px}

/* world map */
.world{margin-top:36px;padding:22px}
.world-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.world-head h2{font-family:var(--f-pixel);font-size:15px;margin:0;line-height:1.6}
.world-1 .world-head h2{color:var(--leaf)} .world-2 .world-head h2{color:var(--violet)}
.world-head .exam{font-family:var(--f-hud);font-size:21px;color:var(--muted)}
.world p.blurb{color:var(--muted);margin:4px 0 18px;max-width:62ch}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;position:relative}
.node{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--panel-2);padding:14px;border:var(--px) solid var(--line);min-width:0;position:relative}
.node:hover{border-color:var(--gold)}
.node .num{font-family:var(--f-pixel);font-size:18px}
.world-1 .node .num{color:var(--leaf)} .world-2 .node .num{color:var(--violet)}
.node .nm{font-weight:700;line-height:1.25}
.node .dm{font-size:14px;color:var(--muted);line-height:1.35}
.node .star{position:absolute;top:10px;right:10px;font-family:var(--f-pixel);font-size:10px;color:var(--gold-ink);background:var(--gold);padding:4px 6px}
.bar{height:12px;background:#0b0918;border:2px solid var(--line);margin-top:auto}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.node .ct{font-family:var(--f-hud);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}

/* level */
.crumb{font-family:var(--f-hud);font-size:20px;color:var(--muted);margin:28px 0 8px}
.crumb a{color:var(--muted)}
.lvl-head{padding:24px 22px}
.lvl-tag{font-family:var(--f-pixel);font-size:11px;line-height:1.7}
.w1 .lvl-tag{color:var(--leaf)} .w2 .lvl-tag{color:var(--violet)}
.lvl-head h1{font-family:var(--f-pixel);font-size:clamp(20px,4.6vw,30px);line-height:1.35;color:var(--gold);margin:10px 0 12px;text-wrap:balance}
.lvl-meta{font-family:var(--f-hud);font-size:21px;color:var(--cyan);line-height:1.2}
.lvl-story{margin:14px 0 0;max-width:64ch}
.goal{margin-top:16px;padding:12px 14px;background:#0b0918;border:2px solid var(--leaf);display:grid;gap:6px;max-width:72ch}
.goal b{font-family:var(--f-pixel);font-size:10px;color:var(--leaf)}
.goal small{color:var(--muted);font-size:14px}
.why{margin:0 0 10px;color:var(--muted);font-size:16px}
.why b{font-family:var(--f-pixel);font-size:9px;color:var(--cyan);margin-right:6px}
.lvl-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:20px}
@media (max-width:700px){.lvl-grid{grid-template-columns:1fr}}
.box{padding:16px 18px;min-width:0}
.box h3{font-family:var(--f-pixel);font-size:11px;margin:0 0 12px;color:var(--gold);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--f-hud);font-size:19px;padding:0 8px;background:#0b0918;border:2px solid var(--line);color:var(--ink)}
.loot{display:grid;gap:10px}
.loot button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--gold);color:var(--gold-ink);border:0;padding:10px 12px;box-shadow:0 var(--px) 0 #a87d12;font-weight:700}
.loot button:hover{filter:brightness(1.06)} .loot button:active{transform:translateY(2px);box-shadow:0 2px 0 #a87d12}
.loot button small{font-weight:400;font-size:14px}
.loot .fname{overflow-wrap:anywhere;min-width:0}
.loot button{flex-wrap:wrap}
.loot-msg{font-size:14px;color:var(--muted);min-height:1.2em;margin:4px 0 0}
.lvl-prog{display:flex;align-items:center;gap:12px;margin-top:18px;font-family:var(--f-hud);font-size:21px;font-variant-numeric:tabular-nums}
.lvl-prog .bar{flex:1;margin:0}

/* quests */
.quests{display:grid;gap:18px;margin-top:30px}
.quest{padding:0;min-width:0}
.quests>*,.lvl-grid>*,.path>*,.cards>*{min-width:0}
.q-top{display:flex;gap:12px 14px;align-items:flex-start;padding:16px 18px 10px;flex-wrap:wrap}
@media (max-width:520px){.q-top .clear{flex-basis:100%}}
.q-num{font-family:var(--f-pixel);font-size:12px;background:#0b0918;color:var(--gold);padding:8px 8px;white-space:nowrap;line-height:1}
.q-title{flex:1;min-width:0}
.q-title h3{margin:0;font-size:20px;line-height:1.3}
.badge{display:inline-block;margin-top:6px;font-family:var(--f-hud);font-size:18px;padding:0 8px;border:2px solid currentColor}
.badge.main{color:var(--leaf)} .badge.side{color:var(--violet)}
.clear{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--f-hud);font-size:20px;white-space:nowrap;user-select:none}
.clear input{appearance:none;width:26px;height:26px;border:3px solid var(--line);background:#0b0918;margin:0;cursor:pointer;display:grid;place-content:center}
.clear input:checked{background:var(--leaf);border-color:var(--leaf)}
.clear input:checked::after{content:"";width:6px;height:12px;border:solid #0b0918;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.quest.done{box-shadow:0 0 0 var(--px) var(--leaf), var(--px) var(--px) 0 var(--px) #0b0918}
.q-body{padding:0 18px 18px}
.objective{background:var(--panel-2);padding:12px 14px;border-left:var(--px) solid var(--gold)}
.objective b{font-family:var(--f-pixel);font-size:10px;color:var(--gold);display:block;margin-bottom:6px;letter-spacing:.05em}
details.walk{margin-top:12px}
details.walk summary{cursor:pointer;font-family:var(--f-pixel);font-size:11px;color:var(--cyan);padding:8px 0;list-style:none;line-height:1.6}
details.walk summary::-webkit-details-marker{display:none}
details.walk summary::before{content:"▶ ";} details.walk[open] summary::before{content:"▼ ";}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-pixel);font-size:11px;background:var(--cyan);color:#0b0918;text-align:center;padding:6px 0;line-height:1}
.steps li>span{min-width:0}
.note{margin-top:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:16px}
.note .lbl{font-family:var(--f-pixel);font-size:9px;padding:6px 6px;line-height:1.2;white-space:nowrap}
.note.tip{background:rgba(98,224,239,.09)} .note.tip .lbl{background:var(--cyan);color:#0b0918}
.note.trap{background:rgba(255,122,107,.1)} .note.trap .lbl{background:var(--coral);color:#0b0918}
.spoil{margin-top:12px}
.spoil button{cursor:pointer;background:transparent;border:2px dashed var(--violet);color:var(--violet);font-family:var(--f-hud);font-size:20px;padding:2px 10px}
.spoil .ans{margin-top:8px;padding:10px 12px;background:rgba(169,139,255,.1);border-left:var(--px) solid var(--violet)}
.menu{display:inline;font-family:var(--f-hud);font-size:19px;background:#0b0918;color:var(--gold);padding:0 6px;border:1px solid var(--line);white-space:normal}
.menu .chev{color:var(--muted);padding:0 3px}
kbd{font-family:var(--f-hud);font-size:19px;background:var(--ink);color:#0b0918;padding:0 6px;box-shadow:0 3px 0 var(--muted);border-radius:2px;white-space:nowrap}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;background:#0b0918;color:var(--leaf);padding:2px 6px;word-break:break-word}
.lvl-nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.lvl-nav a{font-family:var(--f-pixel);font-size:11px;text-decoration:none;color:var(--ink);background:var(--panel);padding:12px 14px;box-shadow:0 0 0 var(--px) var(--line);line-height:1.6}
.lvl-nav a:hover{box-shadow:0 0 0 var(--px) var(--gold)}

/* codes + exam */
.page-h{font-family:var(--f-pixel);font-size:clamp(18px,4vw,26px);color:var(--gold);margin:36px 0 8px;line-height:1.4}
.lead{color:var(--muted);max-width:64ch;margin:0 0 20px}
.tbl-wrap{overflow-x:auto}
table.codes{border-collapse:collapse;width:100%;min-width:300px}
table.codes th,table.codes td{text-align:left;padding:9px 12px;border-bottom:2px solid var(--line);vertical-align:top}
table.codes th{font-family:var(--f-pixel);font-size:10px;color:var(--cyan)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cards .box p{margin:0}
.reset{margin-top:40px;padding:16px 18px}
.reset button{cursor:pointer;background:transparent;color:var(--coral);border:2px solid var(--coral);padding:6px 12px;font-family:var(--f-hud);font-size:20px}
.reset .confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.foot{margin-top:40px;font-size:14px;color:var(--muted)}
/* grader */
.turnin{margin-top:18px;padding:16px 18px}
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:22px 14px;border:3px dashed var(--line);background:#0b0918;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold)}
.drop b{font-family:var(--f-pixel);font-size:11px;color:var(--gold);line-height:1.6}
.drop span{color:var(--muted);font-size:15px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.turnin-msg{margin:10px 0 0;font-family:var(--f-hud);font-size:21px;min-height:1.2em}
.turnin-msg.ok{color:var(--leaf)} .turnin-msg.err{color:var(--coral)}
.grade{margin-top:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:16px}
.grade .lbl{font-family:var(--f-pixel);font-size:9px;padding:6px;line-height:1.2;white-space:nowrap;color:#0b0918}
.grade.pass{background:rgba(95,211,138,.1)} .grade.pass .lbl{background:var(--leaf)}
.grade.fail{background:rgba(247,197,72,.1)} .grade.fail .lbl{background:var(--gold)}
.fails{margin-top:12px;background:rgba(247,197,72,.08);border-left:var(--px) solid var(--gold);padding:10px 12px}
.fails b{font-family:var(--f-pixel);font-size:10px;color:var(--gold)}
.fails ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.fails li{display:grid;gap:2px}
.fails .jump{justify-self:start;background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;cursor:pointer;font-weight:700;text-align:left}
.fails li span{color:var(--ink);font-size:15px}
.quest.needs{box-shadow:0 0 0 var(--px) var(--gold), var(--px) var(--px) 0 var(--px) #0b0918}
.clear.locked{cursor:default;opacity:.9} .clear.locked input{cursor:default}
/* tracks + TOSA */
.tracks{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 0}
.tracks a{flex:1 1 220px;display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--panel);padding:12px 14px;box-shadow:0 0 0 var(--px) var(--line);font-family:var(--f-pixel);font-size:11px;line-height:1.6}
.tracks a small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.tracks a[aria-current="page"]{box-shadow:0 0 0 var(--px) var(--gold);color:var(--gold)}
.tosa-title h1{text-shadow:4px 4px 0 #1f7a8c, 8px 8px 0 #0b0918}
.world-F .world-head h2,.wF .lvl-tag{color:var(--cyan)} .world-F .node .num{color:var(--cyan)}
.world-D .world-head h2,.wD .lvl-tag{color:var(--gold)} .world-D .node .num{color:var(--gold)}
.world-E .world-head h2,.wE .lvl-tag{color:var(--leaf)} .world-E .node .num{color:var(--leaf)}
.world-M .world-head h2,.wM .lvl-tag{color:var(--coral)} .world-M .node .num{color:var(--coral)}
.world-locked{opacity:.7} .world-locked .world-head h2{color:var(--muted)}
.node.locked{border-style:dashed;opacity:.65} .node.locked .num{color:var(--muted)}
.ladder{position:relative;display:grid;grid-template-columns:35fr 20fr 17.5fr 15fr 12.5fr;gap:4px;padding-top:30px}
.rung{background:#0b0918;border:2px solid var(--line);padding:8px 8px;display:grid;gap:2px;min-width:0}
.rung b{font-family:var(--f-pixel);font-size:9px;line-height:1.5;overflow-wrap:anywhere}
.rung span{font-family:var(--f-hud);font-size:19px;color:var(--ink)}
.rung small{font-size:12px;color:var(--muted);line-height:1.3}
.r-beginner b{color:var(--muted)} .r-basic b{color:var(--leaf)} .r-productive b{color:var(--cyan)} .r-advanced b{color:var(--violet)} .r-expert b{color:var(--gold)}
.rung.here{border-color:var(--gold);background:rgba(247,197,72,.08)}
.ladder-pin{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-hud);font-size:20px;color:var(--gold);white-space:nowrap}
@media (max-width:600px){.ladder{grid-template-columns:1fr 1fr}.ladder-pin{display:none}}
.kc{margin-top:36px}
.kc-list{display:grid;gap:16px}
.kc-item{padding:16px 18px}
.kc-q{margin:0 0 12px;font-weight:700}
.kc-q .q-num{font-size:10px;display:inline-block;margin-right:8px;vertical-align:2px}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;cursor:pointer;background:var(--panel-2);border:2px solid var(--line);padding:9px 12px;color:var(--ink)}
.choice:hover:not([disabled]){border-color:var(--gold)}
.choice[disabled]{cursor:default}
.choice .ltr{font-family:var(--f-pixel);font-size:10px;background:#0b0918;color:var(--gold);padding:6px 7px;line-height:1}
.choice.right{border-color:var(--leaf);background:rgba(95,211,138,.12)} .choice.wrong{border-color:var(--coral);background:rgba(255,122,107,.12)}
.retry{cursor:pointer;background:transparent;border:2px dashed var(--violet);color:var(--violet);font-family:var(--f-hud);font-size:19px;padding:2px 10px;margin-top:10px}
button.press{border:0;cursor:pointer;color:var(--ink)}
.test-card .press{margin-top:6px}
.t-best{font-family:var(--f-hud);font-size:21px;color:var(--muted);margin:0 0 6px}
.t-best b{color:var(--gold);font-weight:400}
.t-bar{display:flex;gap:12px;align-items:center;padding:10px 14px;margin-top:12px;font-family:var(--f-hud);font-size:21px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.t-bar .bar{flex:1;margin:0;min-width:80px}
.t-bar b{color:var(--gold);font-weight:400}
.t-q{margin-top:18px}
.t-result{margin-top:12px}
.t-score{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:6px 0 10px}
.t-score b{font-family:var(--f-pixel);font-size:clamp(34px,9vw,56px);color:var(--gold);line-height:1.1}
.t-score span{font-family:var(--f-pixel);font-size:12px;color:var(--cyan)}
.t-note{font-size:14px;color:var(--muted);margin:10px 0 0}
.t-ans{margin:6px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.t-ans .lbl{font-family:var(--f-pixel);font-size:9px;padding:5px 6px;color:#0b0918}
.t-ans .lbl.no{background:var(--coral)} .t-ans .lbl.yes{background:var(--leaf)}
.t-go{margin:10px 0 0;font-size:15px}
.send{margin-top:16px;padding:14px 16px;display:grid;gap:8px;border-left:var(--px) solid var(--cyan)}
.send b{font-family:var(--f-pixel);font-size:10px;color:var(--cyan)}
.send span{color:var(--muted);font-size:15px}
.send label{display:grid;gap:4px;font-size:15px}
.send input{font:inherit;color:var(--ink);background:#0b0918;border:2px solid var(--line);padding:6px 10px;max-width:340px}
.send-btn{justify-self:start;cursor:pointer;background:var(--cyan);color:#0b0918;border:0;padding:10px 14px;font-family:var(--f-pixel);font-size:11px;box-shadow:0 var(--px) 0 #1f7a8c}
.send-msg{margin:0;font-size:15px;min-height:1.2em}
.ft{display:inline-block;font-family:var(--f-pixel);font-size:8px;padding:4px 6px;margin-left:6px;vertical-align:2px;color:#0b0918}
.ft.ok{background:var(--leaf)} .ft.no{background:var(--coral)}
.quest.bp{opacity:.85} .quest.bp .q-num{color:var(--muted)}
/* Codex (textbook) pages */
.cx-head h1{margin-bottom:8px}
.cx-toc{margin-top:20px}
.cx-toc ol{margin:0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
.cx-toc button,.cx-top button{background:none;border:0;padding:2px 0;color:var(--cyan);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.cx-sec{margin-top:22px;padding:20px 22px;scroll-margin-top:90px}
.cx-sec>p{max-width:72ch}
.cx-h{font-family:var(--f-pixel);font-size:14px;line-height:1.6;color:var(--gold);margin:0 0 14px}
.cx-list{margin:8px 0 12px;padding-left:22px;display:grid;gap:6px;max-width:72ch}
.cx-steps{margin:10px 0 14px}
.cx-tbl{margin:10px 0 14px;font-size:16px}
.cx-tbl td{min-width:90px}
.cx-tbl code{white-space:nowrap}
.cx-top{margin:14px 0 0;font-size:14px}
.note.exam{background:rgba(169,139,255,.1)} .note.exam .lbl{background:var(--violet);color:#0b0918}
.lvl-link,.cx-link{color:var(--cyan);font-weight:700;white-space:nowrap}
/* formula anatomy */
.anat{margin:16px 0;padding:14px 16px;background:#0b0918;border:2px solid var(--line)}
.anat-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.anat-top b,.anat-eval b,.anat-say b,.anat-out b{font-family:var(--f-pixel);font-size:9px;color:var(--cyan);letter-spacing:.05em}
.anat-top a{font-size:14px}
.anat-f{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:clamp(16px,3.6vw,22px);line-height:1.6;color:var(--ink);overflow-wrap:anywhere;padding:6px 0 12px;border-bottom:2px dashed var(--line)}
.tk{padding:1px 3px;border-radius:2px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tk0{background:rgba(247,197,72,.22);color:var(--gold)} .tk1{background:rgba(98,224,239,.18);color:var(--cyan)}
.tk2{background:rgba(95,211,138,.18);color:var(--leaf)} .tk3{background:rgba(255,122,107,.2);color:var(--coral)}
.tk4{background:rgba(169,139,255,.2);color:var(--violet)}
.anat-legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.anat-legend li{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:12px;align-items:baseline}
.anat-legend .tk{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:16em}
.anat-eval{margin-top:12px} .anat-eval ol{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.anat-say,.anat-out{margin:12px 0 0}
.anat-say b,.anat-out b{margin-right:8px}
@media (max-width:520px){.anat-legend li{grid-template-columns:1fr;gap:2px}}
/* signature */
.cx-sig{margin:16px 0;padding:14px 16px;background:var(--panel-2);border-left:var(--px) solid var(--gold)}
.cx-sig-f{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:clamp(15px,3.4vw,19px);color:var(--gold);overflow-wrap:anywhere;margin-bottom:6px}
.cx-req{font-family:var(--f-hud);font-size:18px;color:var(--leaf)} .cx-req.opt{color:var(--violet)}
@media (max-width:600px){
  table.cx-stack{min-width:0}
  table.cx-stack thead{display:none}
  table.cx-stack tr{display:block;padding:10px 0;border-bottom:2px solid var(--line)}
  table.cx-stack td{display:grid;grid-template-columns:7.5em 1fr;gap:10px;border:0;padding:3px 4px}
  table.cx-stack td::before{content:attr(data-l);font-family:var(--f-pixel);font-size:8px;line-height:1.6;color:var(--cyan);padding-top:4px}
  table.cx-stack td:first-child{font-weight:700}
}
.cx-used{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.cx-used b{font-family:var(--f-pixel);font-size:9px;color:var(--leaf);margin-right:4px}
.cx-used a{font-family:var(--f-hud);font-size:19px;text-decoration:none;color:var(--ink);padding:0 8px;background:#0b0918;border:2px solid var(--line)}
.cx-used a:hover{border-color:var(--gold)}
.cx-sig-l{display:block;font-family:var(--f-pixel);font-size:9px;color:var(--gold);margin-bottom:8px;letter-spacing:.05em}
.cx-search{margin-top:8px;display:grid;gap:8px}
.cx-search b{font-family:var(--f-pixel);font-size:10px;color:var(--gold)}
.cx-search input{font:inherit;color:var(--ink);background:#0b0918;border:2px solid var(--line);padding:8px 12px;width:100%;max-width:420px}
.cx-search input:focus{border-color:var(--gold);outline:none}
.cx-none{margin:0;color:var(--muted);font-size:15px}
.cx-group{margin-top:24px}
.cx-group .world-head h2{color:var(--cyan)}
.cx-card .nm{color:var(--gold)}
.cx-card[hidden],.cx-group[hidden]{display:none}
@media (max-width:600px){
  .cx-sig table.cx-stack tr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
  .cx-sig table.cx-stack td{display:block;padding:0}
  .cx-sig table.cx-stack td::before{display:none}
  .cx-sig table.cx-stack td:nth-child(3){grid-column:1 / -1}
}

.cx-study{margin-top:18px} .cx-study p{margin:0 0 6px;color:var(--muted);font-size:15px}
.cx-study .cx-used{margin-top:6px}
/* codex-integrated */
</style>

<script type="application/json" id="guide-data">{"w1": [{"id": "1-1", "world": 1, "name": "Workbook Warp Zone", "domain": "Manage worksheets and workbooks", "exam": "MO-210 Domain 1", "scenario": "Sunshine Surf Rentals", "story": "The owner is leaving for spring break and handing the shop to Kai, a seasonal manager. The workbook has to be easy for Kai to navigate, print, and share.", "files": [["L1-1_Surf_Rentals.xlsx", "Practice workbook"], ["march_walkins.csv", "Text file for Quest 1"]], "items": ["Import", "Find & Go To", "Hyperlinks", "Page Setup", "Headers & Footers", "Freeze Panes", "Views", "Properties", "Print Area", "Export", "Comments & Notes"], "quests": [{"t": "Import a text file", "task": "Import march_walkins.csv into a new worksheet. The data starts in cell A1 and the first row is headers. Rename the new sheet Walk-Ins.", "steps": ["Save march_walkins.csv in the same folder as the workbook.", "Go to [[File > Import]], choose CSV file, and click Import.", "Pick march_walkins.csv. In the wizard choose Delimited, click Next, check Comma, click Finish.", "When asked where to put the data, choose New Sheet and click OK.", "Double-click the new sheet tab and type Walk-Ins."], "tip": "Power Query works too: [[Data > Get Data (Power Query) > Text/CSV]]. Either way, the exam only cares that the data lands where it asked.", "trap": "Opening the CSV directly (double-clicking it) creates a separate workbook. The exam wants the data imported into this one.", "why": "Walk-in rentals were logged on a tablet. Kai needs them in the same workbook as the bookings."}, {"t": "Find a record", "task": "Find booking SB-1047 on the Bookings sheet and change its Status to Returned.", "steps": ["Press {{Cmd+F}} (or [[Edit > Find > Find]]).", "Type SB-1047 and press {{Return}}.", "Move across that row to the Status column (G) and type Returned."], "tip": "Use [[Edit > Find > Replace]] ({{Ctrl+H}}) when the exam says replace every instance.", "why": "That board came back this morning. The Start Here sheet counts boards that are still out, so the status has to be right."}, {"t": "Go to a named range", "task": "Navigate to the named range PeakSeason and give it a yellow fill.", "steps": ["Click the Name Box (left of the formula bar) and pick PeakSeason from the dropdown. You can also press {{Ctrl+G}} and choose it.", "With the range selected, click the [[Home > Fill Color]] arrow and choose Yellow."], "trap": "Don't select the rows by hand. If the exam watches for you to navigate to a named element, use the Name Box or Go To.", "why": "The PeakSeason range holds the spring-break bookings. Highlighting it shows Kai the busiest stretch at a glance."}, {"t": "Insert and remove hyperlinks", "task": "In Inventory!J1, insert a hyperlink with the display text Back to Start Here that links to cell A1 on the Start Here sheet. Then remove the hyperlink from 'Start Here'!A5 but keep its text.", "steps": ["Click Inventory!J1 and press {{Cmd+K}} ([[Insert > Link]]).", "Choose This Document, select Start Here, and type A1 in the cell reference box.", "Set Display to Back to Start Here and click OK.", "Go to the Start Here sheet, right-click A5, and choose Remove Hyperlink."], "trap": "Deleting the cell's contents removes the text too. The task says to keep it.", "why": "Kai should be able to jump back to Start Here from the inventory. The old link in Start Here points to a website that no longer exists."}, {"t": "Modify page setup", "task": "On the Bookings sheet, set Landscape orientation and Narrow margins, and scale it so all columns fit on one page.", "steps": ["Click the Bookings tab.", "[[Page Layout > Orientation > Landscape]].", "[[Page Layout > Margins > Narrow]].", "In the Scale to Fit group, set Width to 1 page and leave Height on Automatic."], "tip": "Fit all COLUMNS means width = 1 page. Fit the SHEET means width and height = 1 page. Read carefully.", "why": "Kai prints the booking sheet every morning for the front desk."}, {"t": "Adjust rows and columns", "task": "On the Inventory sheet, set column B to a width of 22, AutoFit column C, and set row 1 to a height of 30.", "steps": ["Right-click the column B header, choose Column Width, type 22.", "Double-click the right border of the column C header to AutoFit it.", "Right-click the row 1 header, choose Row Height, type 30."], "why": "The board types get cut off on the counter iPad, and the header row is cramped."}, {"t": "Customize headers and footers", "task": "On the Bookings sheet, add a header that shows the sheet name in the center section, and a footer that shows Page # of # in the right section.", "steps": ["On Bookings, go to [[Page Layout > Page Setup]] and open the Header/Footer tab.", "Click Customize Header. Click in the Center section, then click the Insert Sheet Name button.", "Click OK, then Customize Footer. In the Right section use Insert Page Number, type ' of ', then Insert Number of Pages.", "Click OK twice."], "tip": "You can also use [[View > Page Layout]] and click directly in the header area.", "why": "With a page count on every printout, pages that fall off the clipboard can go back in order."}, {"t": "Freeze panes", "task": "On the Bookings sheet, freeze row 1 and column A so both stay visible while you scroll.", "steps": ["Click cell B2. Freeze Panes locks everything above and to the left of the active cell.", "[[View > Freeze Panes]]."], "trap": "Freeze Top Row only locks row 1. You need both, so start from B2.", "why": "With 80 bookings, Kai needs the headers and booking IDs to stay on screen while scrolling."}, {"t": "Change views and show formulas", "task": "Switch the Bookings sheet to Page Break Preview. Then show formulas on the Inventory sheet.", "steps": ["On Bookings: [[View > Page Break Preview]].", "On Inventory: [[Formulas > Show Formulas]] (or {{Ctrl+`}})."], "tip": "Show Formulas only applies to the active sheet. Column H on Inventory has formulas, so you'll see =E2*6 and so on.", "why": "Page Break Preview shows where the printout splits. Show Formulas reminds Kai that Weekly Rate calculates itself and shouldn't be typed over."}, {"t": "Change window views", "task": "Split the Inventory window so the split sits above row 16. Then open a second window of the workbook and arrange the windows vertically.", "steps": ["On Inventory, click cell A16 and choose [[View > Split]].", "From the Mac menu bar choose [[Window > New Window]].", "Choose [[Window > Arrange]], pick Vertical, and click OK.", "Close the extra window when you're done ({{Cmd+W}} on the window titled :2)."], "trap": "Split and Freeze Panes can't both be on in the same sheet. Bookings already has frozen panes, so the split goes on Inventory.", "why": "A split keeps the first boards on screen while Kai checks boards further down the list."}, {"t": "Modify workbook properties", "task": "Set the workbook Title to Surf Rentals - Spring Break Handoff, Subject to Shop operations, and Keywords to surf, rentals, handoff.", "steps": ["[[File > Properties]] and open the Summary tab.", "Fill in Title, Subject, and Keywords, then click OK."], "why": "Good properties make the file easy to find with search on any computer."}, {"t": "Manage the Quick Access Toolbar", "side": true, "task": "Add the Sort Ascending command to the Quick Access Toolbar.", "steps": ["Excel menu: [[Excel > Preferences > Ribbon & Toolbar]].", "Click the Quick Access Toolbar tab at the top.", "Find Sort Ascending in the list on the left, click the right arrow to add it, and click Save.", "Another way: click the ... at the end of the toolbar above the ribbon and pick from the list."], "tip": "This setting belongs to Excel, not to the file, so it doesn't save in the workbook. Practice it anyway because the exam can ask for it.", "why": "Kai sorts bookings constantly, so a one-click button saves time."}, {"t": "Set the print area and print settings", "task": "Set the print area on Inventory to A1:H31 and turn on Print Gridlines. On Bookings, repeat row 1 at the top of every printed page.", "steps": ["On Inventory, select A1:H31 and choose [[Page Layout > Print Area > Set Print Area]].", "On the Page Layout tab, check Print under Gridlines.", "On Bookings, choose [[Page Layout > Print Titles]]. In Rows to repeat at top, click row 1 (it shows $1:$1). Click OK."], "why": "The inventory printout is the morning equipment checklist, and long booking printouts need their headers on every page."}, {"t": "Manage comments and notes", "task": "Add a note to Inventory!B5 that says Needs wax. Delete the existing note on Inventory!C10. Add a comment to Bookings!G2 that says Confirm return time, then reply to it with Done.", "steps": ["Right-click Inventory!B5 and choose New Note. Type Needs wax and click outside it.", "Right-click Inventory!C10 and choose Delete Note.", "Right-click Bookings!G2, choose New Comment, type Confirm return time, and click Post ({{Cmd+Return}}).", "Click the comment, type Done in the Reply box, and post it."], "trap": "Notes are the old yellow sticky notes. Comments are threaded and allow replies. The exam tests both, so read which one it asks for.", "why": "These are the handoff notes: a board that needs wax, a fixed issue to clear, and a question to confirm."}, {"t": "Inspect the workbook", "side": true, "task": "Check the workbook for accessibility issues and fix one of them.", "steps": ["[[Review > Check Accessibility]].", "Read the Inspection Results pane on the right. Click any warning to see why it matters and how to fix it.", "Fix one (for example, rename a sheet with a default name or add alt text)."], "tip": "On Windows, the exam's Inspect Workbook skill also includes Document Inspector ([[File > Info > Check for Issues]]). Mac Excel doesn't have Document Inspector, so learn what it removes: comments, personal information, hidden rows and sheets.", "why": "Check the file before it's shared so nothing hidden or hard to read goes out with it."}, {"t": "Save in other file formats", "task": "Save a copy of the Bookings sheet as a CSV file named bookings_export.csv. Export the Inventory sheet as a PDF named inventory.pdf.", "steps": ["SAVE FIRST: press {{Cmd+S}} to save your workbook as an .xlsx. Don't skip this step.", "Click the Inventory tab. Go to [[File > Save As]], set File Format to PDF, name it inventory, and click Save.", "Click the Bookings tab. Go to [[File > Save As]], set File Format to CSV UTF-8 (.csv), name it bookings_export, and click Save. Click OK on the one-sheet warning.", "Excel is now showing bookings_export.csv, not your workbook. Close it with {{Cmd+W}} and click Don't Save.", "Reopen L1-1_Surf_Rentals.xlsx from [[File > Open Recent]] and keep working there."], "trap": "Save As switches Excel over to the new file. If you didn't save the .xlsx first, your unsaved work only exists in the CSV copy, and CSV keeps just one sheet with no formatting. Always save first, and do the CSV last.", "why": "Last step: Kai gets a PDF checklist and a CSV for the booking app. Saving first protects all of your work."}], "goal": "A handoff workbook for the spring-break manager: walk-ins imported, bookings up to date, a Start Here sheet linked from inventory, printouts ready for the front desk, notes left for Kai, and a CSV for the booking app."}, {"id": "1-2", "world": 1, "name": "Cell Block Castle", "domain": "Manage data cells and ranges", "exam": "MO-210 Domain 2", "scenario": "Café Cubano Coffee Co.", "story": "The owner is applying for a loan to open a second window. The bank wants a clean Q1 sales summary and a print-ready 2026 menu.", "goal": "A finished Q1 loan packet: corrected Jan to Mar sales, a Q1 Summary that totals every item (including two new ones), a print-ready 2026 menu, a clean supplier list, and a loyalty raffle tool.", "files": [["L1-2_Cafe_Cubano.xlsx", "Practice workbook"]], "items": ["Auto Fill", "Insert/Delete Rows & Cells", "Insert Columns", "Paste Special", "Named Ranges", "Number Formats", "Wrap & Align", "Merge", "Cell Styles", "Format Painter", "Grouped Sheets", "Sparklines", "Conditional Formatting", "Clear Formats", "SEQUENCE", "RANDBETWEEN"], "quests": [{"t": "Auto Fill January's dates", "why": "January's dates never made it out of the register. The Q1 Summary's busiest-day lookup, and every date format you apply later, need them.", "task": "On the Jan sheet, fill the dates down from A4 (1/1/2026) through A34.", "steps": ["Click Jan!A4.", "Drag the fill handle (the small square at the bottom right of the cell) down to A34. You should end on 1/31/2026."], "tip": "Double-clicking the fill handle fills down to match the length of the column next to it."}, {"t": "Delete duplicate rows", "why": "A register glitch logged Feb 12 to 14 twice. Until those rows are gone, February's totals on the Q1 Summary are inflated.", "task": "On the Feb sheet, rows 18 through 20 are duplicates of rows 15 through 17. Delete rows 18 through 20.", "steps": ["Compare rows 15 to 17 with rows 18 to 20. The dates and numbers repeat.", "Drag across the row headers 18 to 20, right-click, and choose Delete.", "Check the Q1 Summary sheet. February's numbers just dropped to the real totals."], "trap": "Pressing Delete only clears the contents and leaves three blank rows. Right-click the row headers and choose Delete."}, {"t": "Delete a cell and shift left", "why": "The Feb 7 row was exported one cell to the right, so every item's sales for that day landed in the wrong column and the day's Total was overwritten.", "task": "On the Feb sheet, delete cell B10 and shift the cells left. Then copy the Total formula from F9 into F10.", "steps": ["Right-click Feb!B10 and choose Delete.", "Choose Shift cells left and click OK. The numbers slide back under the right items.", "Click F9, press {{Cmd+C}}, click F10, and press {{Cmd+V}}. F10 now totals the day again."], "trap": "Delete the cell, not the row. Deleting the row throws away the whole day."}, {"t": "Insert columns for new items", "why": "In March the café launched Guava Cheesecake and Croqueta Preparada. They need columns before you can bring in their sales.", "task": "On the Mar sheet, insert two new columns before column E (Pastelitos).", "steps": ["On Mar, drag across the column headers E and F, right-click, and choose Insert. Two blank columns appear, and Pastelitos moves to column G.", "Click H4 and look at the formula bar. The Total formula grew from B4:E4 to B4:G4 on its own, because you inserted inside the range it adds up."], "tip": "Inserting columns inside a formula's range stretches the formula. Inserting them outside the range doesn't, which is a common reason totals go wrong."}, {"t": "Paste with Transpose", "why": "The register exported the new items' March sales sideways, one row per item. The Mar sheet needs them as columns.", "task": "Copy Register Export!A3:AF4 and paste it transposed into the Mar sheet starting at E3, so the item names land in E3:F3 and their daily sales fill E4:F34.", "steps": ["Go to the Register Export sheet, select A3:AF4, and press {{Cmd+C}}.", "Go to Mar and click E3.", "Choose [[Edit > Paste Special]] ({{Ctrl+Cmd+V}}), check Transpose, and click OK.", "Check the Q1 Summary. Guava Cheesecake and Croqueta Preparada now show March sales, and H (Total) includes them."]}, {"t": "Remove conditional formatting", "why": "The last manager added a rule that turns any number over 80 red. It makes good sales days, and now the new items, look like problems in front of the bank.", "task": "Remove the conditional formatting from the Mar sheet's data, B4:G34.", "steps": ["Select Mar!B4:G34. (The old rule stretched from B4:E34 when you inserted the two columns.)", "[[Home > Conditional Formatting > Clear Rules > Clear Rules from Selected Cells]]."]}, {"t": "Paste values only", "why": "The owner approved the +5% prices. Column G calculates them, but the menu needs fixed 2026 prices that won't change if someone edits column D. The Margin column already reads from 2026 Price.", "task": "On the Menu sheet, copy G4:G23 and paste only the values into H4:H23 (2026 Price).", "steps": ["Select G4:G23 and press {{Cmd+C}}.", "Click H4 and choose [[Edit > Paste Special]] ({{Ctrl+Cmd+V}}).", "Choose Values and click OK. Column F (Margin) fills in."], "trap": "A normal paste copies the formula, and its references shift, so H would multiply the wrong column. Values pastes the results only.", "answer": "H4 should contain a plain number, 2.1, not a formula."}, {"t": "Define and use a named range", "why": "The bank asked for the average menu price. A named range makes the formula readable, and the Q1 Summary pulls this cell.", "task": "Name the range Menu!H4:H23 MenuPrices. In Menu!H24, use the name in a formula that averages the 2026 prices.", "steps": ["Select H4:H23, click the Name Box, type MenuPrices, and press {{Return}}. Or use [[Formulas > Define Name]].", "In H24 type `=AVERAGE(MenuPrices)`.", "Check the Q1 Summary. Average 2026 menu price now shows a value."], "answer": "`=AVERAGE(MenuPrices)`"}, {"t": "Apply number formats", "why": "Prices without dollar signs and margins showing as 0.775 look unfinished on a printed menu.", "task": "On the Menu sheet, apply Accounting format to D4:E24 and G4:H24, and Percentage with 1 decimal place to F4:F24.", "steps": ["Select D4:E24, hold {{Cmd}}, and select G4:H24. Choose Accounting from the Number Format box on the Home tab.", "Select F4:F24, press {{Cmd+1}}, choose Percentage, set Decimal places to 1, and click OK."]}, {"t": "Wrap text", "why": "The descriptions run off the edge of the printed menu.", "task": "Wrap the text in the Description column, Menu!C4:C23.", "steps": ["Select C4:C23.", "Click [[Home > Wrap Text]]."]}, {"t": "Alignment, orientation, and indent", "why": "Angled headers keep the narrow price columns from getting too wide to print, and indented item names read like a real menu.", "task": "On the Menu sheet, rotate the headers in A3:H3 to Angle Counterclockwise and center them. Indent the item names in A4:A23 by one level.", "steps": ["Select A3:H3. Click [[Home > Orientation]] (the angled ab button) and choose Angle Counterclockwise.", "Click [[Home > Center]].", "Select A4:A23 and click [[Home > Increase Indent]] once."]}, {"t": "Merge and unmerge", "why": "The menu title should sit centered across the whole menu. The old note in row 26 is merged, which blocks copying and sorting in those columns.", "task": "On the Menu sheet, merge and center A1:H1. Unmerge A26:C26.", "steps": ["Select A1:H1 and click [[Home > Merge & Center]].", "Click A26 and click Merge & Center again to unmerge it (or use the arrow and choose Unmerge Cells)."]}, {"t": "Cell styles and the Format Cells dialog", "why": "These finishing touches make the menu and summary look like a professional packet.", "task": "Apply the Title cell style to Menu!A1 and the Heading 3 style to 'Q1 Summary'!A4:F4. Then give the Average row (Menu!A24:H24) a thin top border, a double bottom border, and a light gray fill.", "steps": ["Click Menu!A1. Open [[Home > Cell Styles]] and choose Title.", "Select 'Q1 Summary'!A4:F4 and choose [[Home > Cell Styles > Heading 3]].", "Select Menu!A24:H24 and press {{Cmd+1}}. On the Border tab, choose the thin line and click the top edge, then choose the double line and click the bottom edge.", "On the Fill tab, pick a light gray and click OK."]}, {"t": "Format Painter", "why": "The month sheets go in the packet too, and they should match the menu's header style.", "task": "Copy the formatting from Menu!A3:H3 to the header rows of the Jan, Feb, and Mar sheets.", "steps": ["Select Menu!A3:H3.", "Double-click [[Home > Format Painter]] (paintbrush) so it stays on.", "Click Jan!A3, then Feb!A3, then Mar!A3. Each click paints the header row.", "Press {{Esc}} to turn Format Painter off."]}, {"t": "Format multiple sheets by grouping", "why": "The bank wants readable dates on all three months. Grouping does it once instead of three times, and the wider column keeps Long Date from showing ####.", "task": "Group the Jan, Feb, and Mar sheets. Apply Long Date to the dates in column A (A4:A34) and set column A to a width of 30 on all three at once. Ungroup when you're done.", "steps": ["Click the Jan tab, then {{Shift}}-click the Mar tab. The title bar shows [Group].", "Select A4:A34 and choose Long Date from the Number Format box on the Home tab.", "Right-click the column A header, choose Column Width, and type 30.", "Right-click any tab and choose Ungroup Sheets."], "trap": "If you forget to ungroup, everything you type next goes onto all three sheets. If a column ever shows ####, it isn't an error. The column is just too narrow for the value."}, {"t": "Insert sparklines", "why": "The banker wants to see at a glance which items are growing from January to March.", "task": "On the Q1 Summary sheet, insert Line sparklines in F5:F10 that show each item's Jan to Mar sales (B5:D10). Turn on the High Point marker.", "steps": ["Select 'Q1 Summary'!F5:F10.", "[[Insert > Sparklines > Line]].", "Set the Data Range to B5:D10 and click OK.", "On the Sparkline tab, check High Point."]}, {"t": "Apply built-in conditional formatting", "why": "Data bars let the bank compare Q1 totals at a glance. The owner also wants January's five busiest days flagged so she knows when to add staff.", "task": "On the Q1 Summary sheet, add blue gradient Data Bars to E5:E10. On the Jan sheet, highlight the top 5 values in F4:F34 with Green Fill with Dark Green Text.", "steps": ["Select 'Q1 Summary'!E5:E10 and choose [[Home > Conditional Formatting > Data Bars]], then a blue gradient.", "Select Jan!F4:F34 and choose [[Home > Conditional Formatting > Top/Bottom Rules > Top 10 Items]].", "Change 10 to 5, choose Green Fill with Dark Green Text, and click OK."]}, {"t": "Clear formatting", "why": "The last manager's supplier list goes in the loan packet, and right now it's unreadable.", "task": "Remove all formatting from Suppliers!A1:F15 without deleting the data.", "steps": ["Select Suppliers!A1:F15.", "[[Edit > Clear > Formats]] (or use the eraser on the Home tab and choose Clear Formats)."], "trap": "Clear All also deletes the data. You only want Formats."}, {"t": "SEQUENCE and RANDBETWEEN", "why": "The café is drawing a winner from its 12 loyalty members to celebrate the new window. The Winner cell is already built, so it shows the name as soon as you draw a ticket.", "task": "On the Loyalty Raffle sheet, enter a SEQUENCE formula in A4 that numbers the 12 members' tickets 5001 through 5012. In D4, use RANDBETWEEN to draw a winning ticket number from 5001 to 5012.", "steps": ["In 'Loyalty Raffle'!A4 type `=SEQUENCE(12,1,5001,1)` and press {{Return}}. It spills down to A15.", "In D4 type `=RANDBETWEEN(5001,5012)`. The winner's name appears in E4.", "Press {{Cmd+=}} to recalculate and draw again."], "answer": "`=SEQUENCE(12,1,5001,1)` means 12 rows, 1 column, start at 5001, step 1. `=RANDBETWEEN(5001,5012)` picks a whole number in that range."}]}, {"id": "1-3", "world": 1, "name": "Table Top Temple", "domain": "Manage tables and table data", "exam": "MO-210 Domain 3", "scenario": "Biscayne Bay Fitness", "story": "The owner is thinking about raising prices. Before she decides, she wants a clean member roster and a few answers about who pays what.", "files": [["L1-3_Bay_Fitness.xlsx", "Practice workbook"]], "items": ["Format as Table", "Table Name", "Table Styles", "Convert to Range", "Calculated Columns", "Total Row", "Filter", "Multi-level Sort"], "quests": [{"t": "Create a table from a range", "task": "Convert Members!A1:H81 into an Excel table with headers. Name it tblMembers.", "steps": ["Click any cell in A1:H81.", "[[Home > Format as Table]], choose any style, confirm the range is $A$1:$H$81 and My table has headers is checked, then click OK.", "On the Table tab, click in the Table Name box, type tblMembers, and press {{Return}}."], "tip": "{{Cmd+T}} creates a table quickly too.", "why": "As a table, the roster grows on its own when new members join, and the Pricing Review formulas can read it."}, {"t": "Apply a table style", "task": "Apply Table Style Medium 7 to tblMembers.", "steps": ["Click inside the table.", "On the Table tab, open the styles gallery and hover to find Table Style Medium 7 (the tooltip shows the name). Click it."], "why": "A banded style makes 80 rows readable for the owner."}, {"t": "Convert a table to a range", "task": "Convert the table on the Classes sheet (tblClasses) back to a normal range.", "steps": ["Click inside the Classes table.", "[[Table > Convert to Range]], then click Yes."], "trap": "The formatting stays after converting. That's normal, since only the table features go away.", "why": "The class schedule gets pasted into the weekly newsletter, and table filter buttons get in the way there."}, {"t": "Add and remove table rows and columns", "task": "In tblMembers: delete the Fax column, add a column named Annual Fee that equals Monthly Fee times 12, and add a new member at the bottom: M081, Ana, Reyes, Plus, 49, 3/2/2026, 8.", "steps": ["Right-click any cell in the Fax column and choose [[Delete > Table Columns]].", "Click the first empty cell to the right of the header row, type Annual Fee, and press {{Return}}. The table grows to include it.", "In the first data cell under Annual Fee, type `=[@[Monthly Fee]]*12` and press {{Return}}. The formula fills the whole column.", "Click the first empty row under the table and type the new member's values. The table expands automatically."], "answer": "`=[@[Monthly Fee]]*12`. The @ means this row.", "why": "Nobody has used the fax column in years. The owner needs annual fees for the review, and a member who joined after the export is missing."}, {"t": "Configure table style options", "task": "For tblMembers, turn on First Column, turn off Banded Rows, and turn on Banded Columns.", "steps": ["Click inside the table.", "On the Table tab, check First Column, uncheck Banded Rows, and check Banded Columns."], "why": "Member IDs stand out in the first column, and banded columns make the fee fields easier to scan across."}, {"t": "Insert and configure a total row", "task": "Add a Total Row to tblMembers. Show the Average of Monthly Fee and the Count of Member ID.", "steps": ["On the Table tab, check Total Row.", "In the total row, click the cell under Monthly Fee, open its dropdown, and choose Average.", "Click the cell under Member ID and choose Count."], "tip": "The total row uses SUBTOTAL(), so it updates when you filter.", "why": "The total row gives the owner the average fee and member count right at the bottom of the table."}, {"t": "Sort by multiple columns", "task": "Sort tblMembers by Plan (A to Z), then by Monthly Fee (largest to smallest).", "steps": ["Click in the table and choose [[Data > Sort]].", "First level: Plan, Values, A to Z. Click + to add a level: Monthly Fee, Values, Largest to Smallest.", "Click OK."], "trap": "Sorting one column at a time with the filter arrows doesn't create a multi-level sort. Use the Sort dialog.", "why": "Grouping members by plan with the highest fees first makes the review easy to read."}, {"t": "Filter records", "task": "Filter tblMembers to show only Premium members who joined on or after 1/1/2025.", "steps": ["Click the filter arrow on Plan, uncheck Select All, check Premium, and click Apply (or close the panel).", "Click the Join Date arrow, choose a date filter such as Is after or equal to, enter 1/1/2025, and apply it.", "Leave the filter on. This is the final view the owner will use for the email list."], "why": "Last step: the owner emails recent Premium members about the change first. The total row updates to match the filter."}], "goal": "A finished pricing review: a member table with annual fees and a total row, a filtered list of recent Premium members to email, and a Pricing Review sheet that fills in as you build the table."}, {"id": "1-4", "world": 1, "name": "Formula Forge", "domain": "Perform operations by using formulas and functions", "exam": "MO-210 Domain 4", "scenario": "Bayside Books", "story": "It's month-end at the bookstore. Reps need their commissions, the owner needs a sales summary, and the catalog has to be cleaned up for the new website.", "files": [["L1-4_Bayside_Books.xlsx", "Practice workbook"]], "items": ["$Absolute", "Mixed Refs", "Structured Refs", "SUM/AVERAGE/MIN/MAX", "COUNT family", "IF", "SORT", "UNIQUE", "LEFT/MID/RIGHT", "UPPER/LOWER/LEN", "CONCAT", "TEXTJOIN"], "quests": [{"t": "Absolute references", "task": "On the Commission sheet, calculate each rep's commission in C5:C14 by multiplying their sales by the rate in B2. Write one formula and fill it down.", "steps": ["In C5 type `=B5*$B$2`.", "Fill down to C14."], "tip": "Press {{Cmd+T}} while your cursor is in a reference to cycle through $B$2, B$2, $B2, and B2.", "trap": "Without the $ signs, C6 would point to B3, which is empty, and every result would be 0.", "answer": "`=B5*$B$2`", "why": "Commissions feed the Month-End Report's total payout and revenue after commissions."}, {"t": "Mixed references", "task": "On the Commission sheet, fill the price-by-quantity grid F5:J10 using one formula that multiplies the price in column E by the quantity in row 4.", "steps": ["In F5 type `=$E5*F$4`.", "Fill right to J5, then fill F5:J5 down to row 10."], "answer": "`=$E5*F$4` locks the column for price and the row for quantity.", "why": "Staff use this chart to quote book clubs and schools for bulk orders."}, {"t": "Structured references", "task": "In tblSales on the Sales sheet, fill the Total column with Qty times Price. On the Summary sheet, put the total revenue in B3 using a structured reference.", "steps": ["Click Sales!F2 and type `=[@Qty]*[@Price]`. The column fills itself.", "In Summary!B3 type `=SUM(tblSales[Total])`."], "answer": "`=[@Qty]*[@Price]` and `=SUM(tblSales[Total])`", "why": "Sales totals drive the report's revenue number."}, {"t": "AVERAGE, MAX, MIN", "task": "On the Summary sheet, find the average order quantity (B4), the largest order quantity (B5), and the lowest price (B6) from tblSales.", "steps": ["B4: `=AVERAGE(tblSales[Qty])`", "B5: `=MAX(tblSales[Qty])`", "B6: `=MIN(tblSales[Price])`"], "why": "The owner tracks typical order size and the cheapest title on hand."}, {"t": "COUNT, COUNTA, COUNTBLANK", "task": "On the Summary sheet, use the Survey sheet to count the ratings given (B8), the customers who responded (B9), and the ratings left blank (B10).", "steps": ["B8: `=COUNT(Survey!B2:B31)` counts numbers only.", "B9: `=COUNTA(Survey!A2:A31)` counts anything that isn't empty.", "B10: `=COUNTBLANK(Survey!B2:B31)` counts empty cells."], "tip": "COUNT means numbers. COUNTA means not empty. Mixing them up is the classic mistake.", "why": "The report turns these counts into a survey response rate."}, {"t": "Conditional logic with IF", "task": "On the Catalog sheet, fill F2:F31 so it shows Reorder when Stock is below 10 and OK otherwise.", "steps": ["In F2 type `=IF(E2<10,\"Reorder\",\"OK\")` and fill down."], "answer": "`=IF(E2<10,\"Reorder\",\"OK\")`", "why": "The report counts how many titles need reordering."}, {"t": "Sort with SORT()", "task": "In Summary!D3, use SORT to list Catalog!B2:E31 sorted by Stock (the 4th column) from lowest to highest.", "steps": ["In D3 type `=SORT(Catalog!B2:E31,4,1)`. The results spill into D3:G32, with the lowest stock first."], "trap": "A #SPILL! error means something is blocking the output range. Clear it.", "answer": "`=SORT(Catalog!B2:E31,4,1)`. Use 1 for ascending and -1 for descending.", "why": "Sorted lowest stock first, this becomes the reorder priority list."}, {"t": "Unique values with UNIQUE()", "task": "In Summary!I3, list each genre from Catalog!D2:D31 only once.", "steps": ["In I3 type `=UNIQUE(Catalog!D2:D31)`."], "why": "The website's genre menu needs each genre listed once."}, {"t": "LEFT, MID, RIGHT", "task": "SKUs look like FIC-2019-0153. On the Catalog sheet, pull out the category code (G), the year (H), and the item number (I).", "steps": ["G2: `=LEFT(A2,3)`", "H2: `=MID(A2,5,4)` means start at the 5th character and take 4.", "I2: `=RIGHT(A2,4)`", "Fill all three down to row 31."], "why": "The website stores category, year, and item number in separate fields."}, {"t": "UPPER, LOWER, LEN", "task": "On the Catalog sheet, show the author's name in capitals (J), the title length in characters (K), and the genre in lowercase (M).", "steps": ["J2: `=UPPER(C2)`", "K2: `=LEN(B2)`", "M2: `=LOWER(D2)`", "Fill down to row 31."], "why": "The website shows author names in capitals and lowercase genre codes, and cuts titles longer than 25 characters. The report counts how many are too long."}, {"t": "CONCAT and TEXTJOIN", "task": "On the Catalog sheet, build a display name in L2:L31 that reads like Title by Author. In Summary!B13, join the first five titles (Catalog!B2:B6) with a comma and a space between them.", "steps": ["L2: `=CONCAT(B2,\" by \",C2)`, then fill down.", "Summary!B13: `=TEXTJOIN(\", \",TRUE,Catalog!B2:B6)`"], "tip": "TEXTJOIN's TRUE argument skips empty cells. CONCAT has no separator option.", "why": "Display names go on the website, and the first five titles become this month's staff picks in the newsletter."}], "goal": "A completed month-end close: commissions paid, a bulk-order price chart, sales and survey stats, a reorder list, website-ready catalog fields, and a Month-End Report that fills in from your formulas."}, {"id": "1-5", "world": 1, "name": "Chart Canyon", "domain": "Manage charts", "exam": "MO-210 Domain 5", "scenario": "Miami Food Truck Fest", "story": "The festival is pitching next year's sponsors. Every chart in this workbook goes into the sponsorship packet, which is also posted online.", "files": [["L1-5_Food_Truck_Fest.xlsx", "Practice workbook"]], "items": ["Insert Chart", "Chart Sheets", "Select Data", "Switch Row/Column", "Chart Elements", "Quick Layout", "Chart Styles", "Alt Text"], "quests": [{"t": "Create a chart", "task": "Create a Clustered Column chart from Sales!A1:E7.", "steps": ["Select A1:E7.", "[[Insert > Column > Clustered Column]]."], "why": "Sponsors want to see what each truck sells month by month."}, {"t": "Create a chart sheet", "task": "Move that chart to its own chart sheet named Sales Chart.", "steps": ["Click the chart.", "[[Chart Design > Move Chart]].", "Choose New sheet, type Sales Chart, and click OK."], "why": "On its own sheet, the chart becomes a full page in the packet."}, {"t": "Switch rows and columns", "task": "On the Sales Chart sheet, switch rows and columns so the trucks run along the horizontal axis.", "steps": ["Click the chart.", "[[Chart Design > Switch Row/Column]]."], "why": "With trucks on the axis, each sponsor can find their truck right away."}, {"t": "Add a data series", "task": "The line chart on the Attendance sheet only shows Saturday. Add the Sunday series (C1:C7).", "steps": ["Click the line chart and choose [[Chart Design > Select Data]].", "Click + under Legend Entries (Series). Set Name to =Attendance!$C$1 and Y values to =Attendance!$C$2:$C$7.", "Click OK."], "tip": "Or select C1:C7, copy it, click the chart, and paste.", "why": "Sponsors pay per visitor, so the chart needs the whole weekend."}, {"t": "Add and modify chart elements", "task": "On the Attendance chart, add the chart title Weekend Attendance, add axis titles Month and Visitors, add data labels to the Sunday series only, and move the legend to the bottom.", "steps": ["[[Chart Design > Add Chart Element > Chart Title > Above Chart]], then type the title.", "[[Add Chart Element > Axis Titles]]: add Primary Horizontal (Month) and Primary Vertical (Visitors).", "Click the Sunday line once to select only that series, then [[Add Chart Element > Data Labels > Above]].", "[[Add Chart Element > Legend > Bottom]]."], "trap": "If you add data labels without selecting a series first, every series gets them.", "why": "A chart without titles and labels can't stand alone in a packet."}, {"t": "Apply a chart layout and style", "task": "On the Sales Chart sheet, apply Quick Layout 3 and chart Style 8.", "steps": ["Click the chart.", "[[Chart Design > Quick Layout > Layout 3]].", "In the Chart Styles gallery, hover to find Style 8 and click it."], "why": "These give the sales chart a finished, consistent look."}, {"t": "Add alt text", "task": "Add this alt text to the chart on the Sales Chart sheet: Column chart comparing monthly sales of four food trucks from January to June.", "steps": ["Right-click the chart and choose Edit Alt Text.", "Type the description in the pane. Leave Mark as decorative unchecked."], "tip": "Alt text is what screen readers announce. The exam checks that the exact text you typed is there.", "why": "The packet is posted online, so screen-reader users need a description."}, {"t": "June market share pie", "task": "On the Sales sheet, create a Pie chart of June sales by truck (B1:E1 and B7:E7) and add percentage data labels.", "steps": ["Select B1:E1, hold {{Cmd}}, and select B7:E7.", "[[Insert > Pie > Pie]].", "[[Chart Design > Add Chart Element > Data Labels > More Data Label Options]], check Percentage, and uncheck Value."], "why": "Sponsors asked which truck led the final month."}], "goal": "A sponsor-ready chart set: a sales chart on its own sheet, a fully labeled weekend attendance chart, and a June market share pie, all accessible for the website."}], "w2": [{"id": "2-1", "world": 2, "name": "Vault of Settings", "domain": "Manage workbook options and settings", "exam": "MO-211 Domain 1 (10-15%)", "scenario": "Everglades Eco Tours", "story": "Seasonal guides start next week. They'll log bookings in this workbook, so it has to pull live prices, run fast, and be impossible to break.", "files": [["L2-1_Eco_Tours.xlsx", "Practice workbook"], ["L2-1_Tour_Prices.xlsx", "Second workbook (prices)"]], "items": ["Macro Security", "External References", "Copy Macros", "Read-Only", "Protect Sheet", "Unlock Ranges", "Protect Structure", "Calculation Options"], "quests": [{"t": "Enable macros", "side": true, "task": "Know where Mac Excel's macro security setting lives and what happens when you open a macro-enabled file.", "steps": ["[[Excel > Preferences > Security]] (on newer macOS the menu item is called Settings).", "Under Macro Security, review the options. The usual exam answer is Disable all macros with notification.", "When you open an .xlsm file with that setting, Excel asks whether to enable macros. Click Enable Macros."], "tip": "Turn on the Developer tab now. You need it in Level 2-3: [[Excel > Preferences > Ribbon & Toolbar]], then check Developer.", "why": "Staff will open macro-enabled files, so everyone needs to know what the security prompt means."}, {"t": "Reference data in another workbook", "task": "Open both files. In L2-1_Eco_Tours.xlsx, fill Bookings!E2:E61 with each tour's price looked up from the Prices sheet in L2-1_Tour_Prices.xlsx. Then fill Bookings!F2:F61 with Guests times Unit Price.", "steps": ["Open L2-1_Tour_Prices.xlsx and L2-1_Eco_Tours.xlsx.", "In Bookings!E2 type `=VLOOKUP(A2,` and switch to the Prices workbook (use the Window menu). Select A2:C7, press {{Cmd+T}} to make it absolute, then type `,3,FALSE)` and press {{Return}}.", "Fill E2 down to E61.", "In F2 type `=D2*E2` and fill down."], "answer": "`=VLOOKUP(A2,[L2-1_Tour_Prices.xlsx]Prices!$A$2:$C$7,3,FALSE)`", "trap": "If you close the price workbook, the formula shows the full file path. That's normal for an external link.", "why": "Prices change in one master workbook, so bookings should never have a price typed in by hand."}, {"t": "Copy a macro between workbooks", "task": "Record a macro named FormatHeader in L2-1_Eco_Tours that bolds row 1 and fills it light green. Save it as L2-1_Eco_Tours.xlsm. Then copy the macro module into L2-1_Tour_Prices and save that file as .xlsm too.", "steps": ["Select row 1 on Bookings. Choose [[Developer > Record Macro]], name it FormatHeader, set Store macro in to This Workbook, and click OK.", "Press {{Cmd+1}} to open Format Cells. On the Font tab, set Font style to Bold. On the Fill tab, pick a light green. Click OK, then click [[Developer > Stop Recording]].", "[[File > Save As]] and choose Excel Macro-Enabled Workbook (.xlsm).", "[[Developer > Visual Basic]]. In the Project pane, drag Module1 from the Eco_Tours project onto the Tour_Prices project.", "If dragging doesn't work, right-click Module1, choose Export File, then select the Tour_Prices project and use [[File > Import File]].", "Save Tour_Prices as an .xlsm file."], "trap": "Row 1 is already bold, so {{Cmd+B}} would turn bold OFF. Setting Bold in Format Cells always turns it on. Also, if you save as .xlsx, Excel throws away the macro. Always choose .xlsm.", "why": "Both workbooks should use the same header look, and staff can rerun the macro when they add a sheet."}, {"t": "Configure calculation options", "task": "Set the workbook to calculate manually. Change a guest count, watch the Total stay the same, then calculate the workbook.", "steps": ["[[Formulas > Calculation Options > Manual]].", "Change any value in Bookings column D. The total in column F doesn't update.", "Press {{Cmd+=}} (Calculate Now) and watch it update."], "tip": "The same setting is also under [[Excel > Preferences > Calculation]]. Exam tasks may also ask for iterative calculation, which is in that same pane.", "why": "The linked prices make the file slow to recalculate while staff enter a full day. They'll press Calculate when they're done."}, {"t": "Protect worksheets and cell ranges", "task": "On the Bookings sheet, let staff edit only the guest details in B2:D61. Unlock that range, then protect the sheet with the password eco. Allow users to select unlocked cells and format columns.", "steps": ["Select B2:D61 and press {{Cmd+1}}. On the Protection tab, uncheck Locked and click OK.", "[[Review > Protect Sheet]]. Not on your Review tab? Use the menu bar at the top of the screen instead: [[Tools > Protection > Protect Sheet]]. Type eco as the password. If your school Mac blocks passwords, leave it blank. The grader accepts that.", "Check Select unlocked cells and Format columns, and make sure Select locked cells is unchecked. Click OK and confirm the password."], "trap": "Every cell is Locked by default. Locking does nothing until the sheet is protected, so unlock first and protect second.", "why": "Guides should only change guest details, never prices or totals."}, {"t": "Protect workbook structure", "task": "Protect the workbook structure with the password vault so nobody can add, delete, rename, or move sheets.", "steps": ["[[Review > Protect Workbook]]. Not on your Review tab? Use the menu bar instead: [[Tools > Protection > Protect Workbook]].", "Check Structure, type vault, and click OK. Confirm the password. If your school Mac blocks passwords, leave it blank. The grader accepts that.", "Test it: right-click a sheet tab. Insert, Delete, and Rename should be grayed out."], "why": "The sheets are part of the system, so nobody should rename, delete, or move them."}, {"t": "Restrict editing", "task": "Make L2-1_Eco_Tours open as Read-only recommended, with the password to modify set to tours2026.", "steps": ["Go to [[File > Passwords]]. If your build doesn't have it, try [[Review > Protect Workbook]] or the options in the Save As dialog.", "Leave Password to open EMPTY. Type tours2026 only in Password to modify, and check Read-only recommended.", "Click OK, re-enter the password, and save."], "trap": "Password to open encrypts the whole file, so nobody can open it without the password, and the grader can't read it either. This task only uses Password to modify.", "tip": "On Windows this lives in [[File > Info > Protect Workbook]] (Always Open Read-Only, Mark as Final, Restrict Access). Learn the idea, since the menus differ.", "why": "This is the last step before handoff: the file opens read-only unless the person knows the password."}, {"t": "Switch Excel back to Automatic", "task": "Save L2-1_Eco_Tours and turn it in first. Then close it, open a new blank workbook, and set Calculation Options back to Automatic so the next workbook you open recalculates normally.", "steps": ["Press {{Cmd+S}}, then turn the workbook in to the grader. The manual-calculation quest is checked in this file, so it has to be saved as Manual.", "Close the workbook with {{Cmd+W}}.", "Press {{Cmd+N}} to open a new blank workbook.", "Choose [[Formulas > Calculation Options > Automatic]].", "Test it: type `=1+1` in A1. If it shows 2 with no line through it, Excel is back to normal. Close the blank workbook without saving."], "trap": "Excel uses one calculation setting for every open workbook, and it takes that setting from the first file you open. Skip this step and the next level's numbers can show with a line through them and stop updating.", "tip": "In Microsoft 365, a line through a number means the value is stale: it hasn't been recalculated since something changed. Press {{Cmd+=}} to calculate once, or switch back to Automatic.", "why": "Manual calculation doesn't stay in this file. It follows you into the next workbook you open, so Excel itself has to go back to Automatic before you move on."}], "goal": "A workbook that's safe to hand to new staff: prices linked to the master price list, a shared header macro, manual calculation for speed, only guest details editable, sheets that can't be renamed or deleted, and a read-only prompt on open."}, {"id": "2-2", "world": 2, "name": "Format Fortress", "domain": "Manage and format data", "exam": "MO-211 Domain 2 (30-35%)", "scenario": "Little Havana Bakery", "story": "Holiday catering season starts in three weeks. The order log, staff list, and customer list all need to be ready before the rush.", "files": [["L2-2_Little_Havana_Bakery.xlsx", "Practice workbook"]], "items": ["Flash Fill", "Fill Series", "RANDARRAY", "Custom Number Formats", "Data Validation", "Subtotals", "Group/Outline", "Remove Duplicates", "Custom CF Rules", "CF with Formulas", "Manage Rules"], "quests": [{"t": "Flash Fill", "task": "On the Staff sheet, use Flash Fill to split each Full Name into First (B) and Last (C), then build a lowercase email in D like maria.lopez@lhbakery.com.", "steps": ["In B2 type the first name from A2. Click B3 and choose [[Data > Flash Fill]].", "Do the same in C2 and C3 for last names.", "In D2 type the email exactly as it should look, all lowercase. Click D3 and run Flash Fill."], "trap": "Flash Fill types plain values, not formulas, so it won't update if a name changes. Check a few rows, because it guesses from your example.", "why": "The scheduling app needs first names, last names, and work emails in separate columns."}, {"t": "Advanced Fill Series", "task": "On the Holiday Plan sheet, fill A2:A13 with a Growth series that starts at 1000 with a step of 1.05. Then fill C2:C21 with weekday-only dates starting at 1/5/2026.", "steps": ["Select A2:A13 (A2 already holds 1000). Choose [[Home > Fill > Series]].", "Under Type choose Growth, set Step value to 1.05, and click OK.", "Select C2:C21 (C2 holds 1/5/2026). Open [[Home > Fill > Series]] again, choose Date, Weekday, step 1, and click OK."], "answer": "A13 should be about 1710.34. C21 should be 1/30/2026.", "why": "The holiday plan needs weekly order goals that grow 5% a week, and delivery days that skip weekends."}, {"t": "Generate data with RANDARRAY", "task": "In 'Holiday Plan'!E2, generate a 10-row by 3-column block of random whole numbers between 50 and 150 (10 days by 3 shifts).", "steps": ["In E2 type `=RANDARRAY(10,3,50,150,TRUE)`.", "Peak Shift Load in I2 shows the biggest number in the block. Press {{Cmd+=}} to run a new what-if."], "answer": "The arguments are rows, columns, min, max, and whole numbers (TRUE).", "why": "The owner wants to see what the busiest shift could look like. Peak Shift Load reads this block."}, {"t": "Create custom number formats", "task": "Change how four columns LOOK without changing the numbers in them. Phones get dashes, quantities say doz, amounts show dollars with a dash for $0, and dates show the weekday. Each one uses the same move: select the range, press {{Cmd+1}}, click Custom, and type a code.", "steps": ["Phones: select Staff!E2:E31, press {{Cmd+1}}, click Custom in the Category list, delete what's in the Type box, and type `(000) 000-0000`. Click OK. 3056246981 now shows as (305) 624-6981.", "Quantities: select Orders!F2:F101, {{Cmd+1}}, Custom, and type `0 \"doz\"` (include the quote marks). 18 now shows as 18 doz.", "Amounts: select Orders!G2:G101, {{Cmd+1}}, Custom, and type `$#,##0.00;[Red]($#,##0.00);\"-\"`. 324 shows as $324.00, and the orders worth 0 show a dash. A negative amount would show red in parentheses.", "Dates: select Orders!B2:B101, {{Cmd+1}}, Custom, and type `ddd, mmm d`. 9/2/2026 now shows as Wed, Sep 2.", "Click any changed cell and look at the formula bar. It still holds the plain number. Only the display changed."], "tip": "The semicolons split a format into sections: positive;negative;zero;text. Words go in \"quotes\", colors go in [Brackets], and 0 means show a digit here.", "why": "The scheduling app needs phone numbers formatted, and the order log should read in dozens and dollars."}, {"t": "Configure data validation", "task": "On the Orders sheet, make E2:E101 a dropdown list that pulls from Products!A2:A9. Restrict F2:F101 to whole numbers from 1 to 200, with the input message title Quantity, the message Enter 1-200 dozen, and a Stop error alert.", "steps": ["Select E2:E101 and choose [[Data > Data Validation]]. Set Allow to List and Source to `=Products!$A$2:$A$9`. Click OK.", "Select F2:F101 and open Data Validation again. Allow: Whole number, between 1 and 200.", "On the Input Message tab, enter the title and message. On the Error Alert tab, set Style to Stop. Click OK."], "why": "During the rush, staff can't mistype a product or enter 2,000 dozen."}, {"t": "Remove duplicate records", "task": "Remove the duplicate rows from Customers!A1:D41. A row counts as a duplicate only if all four columns match.", "steps": ["Click inside the data and choose [[Data > Remove Duplicates]].", "Keep all columns checked and My data has headers checked. Click OK."], "answer": "Excel removes 6 duplicates and keeps 34 unique rows.", "why": "Duplicate customers mean duplicate holiday mailers."}, {"t": "Custom conditional formatting rule", "task": "On the Orders sheet, format any Amount in G2:G101 greater than 500 with bold dark green text and a light green fill. Build the rule yourself instead of using a preset.", "steps": ["Select G2:G101 and choose [[Home > Conditional Formatting > New Rule]].", "Style: Classic. Choose Format only cells that contain, then Cell Value, greater than, 500.", "From the Format with list choose custom format. Set Bold, a dark green font, and a light green fill. Click OK."], "why": "Big orders need a manager's sign-off, so they should stand out."}, {"t": "Conditional formatting with a formula", "task": "Highlight the whole row in Orders!A2:H101 whenever Status (column H) is Late.", "steps": ["Select A2:H101 with A2 as the active cell.", "[[Home > Conditional Formatting > New Rule]], Classic, Use a formula to determine which cells to format.", "Type `=$H2=\"Late\"`, pick a light red fill, and click OK."], "trap": "The $ locks column H so every cell in the row checks Status. Leave the row number unlocked so each row checks itself.", "answer": "`=$H2=\"Late\"`", "why": "Late orders need a phone call today, so the whole row should be impossible to miss."}, {"t": "Manage conditional formatting rules", "task": "The Scores sheet already has three rules on B2:B21. Change the green rule's threshold from 80 to 90, delete the Duplicate Values rule, and move the red rule to the top.", "steps": ["Select B2:B21 and choose [[Home > Conditional Formatting > Manage Rules]].", "Double-click the Cell Value > 80 rule, change 80 to 90, and click OK.", "Select the duplicate-values rule and click the minus (-) button.", "Select the < 50 rule and use the up arrow to move it to the top. Click OK."], "why": "The kiosk inspection checklist uses the wrong threshold and a rule nobody needs."}, {"t": "Subtotals and outline groups", "task": "The Orders sheet is sorted by Region. Insert subtotals that SUM the Amount at each change in Region. Collapse the outline to level 2. On the Staff sheet, group columns B:D.", "steps": ["Click in Orders data and choose [[Data > Subtotals]].", "At each change in: Region. Use function: Sum. Add subtotal to: Amount. Click OK.", "Click the 2 button at the top left of the outline to show only the subtotals.", "On Staff, select columns B:D and choose [[Data > Group]]. A collapse bracket appears above the columns."], "trap": "Subtotals only works on a range, not a table. If your data is a table, convert it to a range first.", "tip": "Do this quest last. Subtotals inserts rows, which makes other tasks harder to check.", "why": "The delivery drivers get one subtotal per region. Grouping hides the helper columns so the staff directory stays clean."}], "goal": "A holiday catering system that's ready to run: a staff directory for the scheduling app, a growth and staffing plan, an order log with dropdowns and readable formats, late orders flagged, a clean customer list, and delivery-route subtotals."}, {"id": "2-3", "world": 2, "name": "Function Dungeon", "domain": "Create advanced formulas and macros", "exam": "MO-211 Domain 3 (25-30%)", "scenario": "Magic City Sneaker Exchange", "story": "The owner has to decide whether to take an expansion loan. Every quest builds part of the evidence, and the Decision sheet pulls it all together.", "files": [["L2-3_Sneaker_Exchange.xlsx", "Practice workbook"]], "items": ["IFS", "SWITCH", "LET", "AND/OR/NOT", "*IFS family", "XLOOKUP", "VLOOKUP/HLOOKUP", "INDEX/MATCH", "TODAY/NOW", "WEEKDAY/WORKDAY", "Consolidate", "Goal Seek", "Scenario Manager", "PMT/NPER", "FILTER", "SORTBY", "Auditing", "Macros"], "quests": [{"t": "IFS", "task": "On the Inventory sheet, fill K2:K41 with a tier: Grail if Price is 300 or more, Heat if it's 150 or more, and Everyday otherwise.", "steps": ["Write your formula in K2 and fill it down. Stuck? Reveal the answer below."], "answer": "`=IFS(G2>=300,\"Grail\",G2>=150,\"Heat\",TRUE,\"Everyday\")`", "trap": "IFS stops at the first true test, so check the largest value first. TRUE at the end acts as the else.", "why": "Tiers decide which shelf a pair goes on and how it's marketed."}, {"t": "SWITCH", "task": "Fill Inventory!J2:J41 with the full condition name based on the code in E: DS = Deadstock, VNDS = Very Near Deadstock, U = Used, anything else = Unknown.", "steps": ["Write your formula in J2 and fill it down. Stuck? Reveal the answer below."], "answer": "`=SWITCH(E2,\"DS\",\"Deadstock\",\"VNDS\",\"Very Near Deadstock\",\"U\",\"Used\",\"Unknown\")`", "why": "Customers don't know what VNDS means. The website needs the full words."}, {"t": "LET", "task": "In Inventory!L2:L41, calculate the profit margin (Price minus Cost, divided by Price) using LET to name the cost c and the price p. Format it as a percentage.", "steps": ["Write your formula in L2, fill it down, and apply Percent Style. Stuck? Reveal the answer below."], "answer": "`=LET(c,F2,p,G2,(p-c)/p)`", "tip": "LET takes name, value pairs, and the final argument is the calculation. It makes long formulas readable.", "why": "Margin shows which pairs actually make money."}, {"t": "TODAY and NOW", "task": "In Brands!B1, show the current date and time. In Inventory!M2:M41, calculate Days Listed: if Sold (I) is blank, use today minus Listed (H). Otherwise use Sold minus Listed.", "steps": ["Brands!B1: `=NOW()`", "Inventory!M2: `=IF(I2=\"\",TODAY()-H2,I2-H2)`, then fill down and format as General (a number)."], "trap": "If M shows dates like 2/14/1900, change the format to General.", "why": "Days Listed shows what's sitting too long, and the report stamp shows how current t
