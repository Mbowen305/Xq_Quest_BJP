lags objects without it."}, {"id": "m4h", "lvl": "M-4", "band": "Expert", "q": "A rule uses `=$H2>500` and should make the text bold and red. Where do you set that?", "c": ["Custom Format, Font tab", "Format with: Light Red Fill", "[[Home > Font Color]]", "Cell Styles"], "a": 0, "why": "Custom Format opens Format Cells for the rule, where you can set the font, border, fill, and number format."}, {"id": "e1a", "lvl": "E-1", "band": "Basic", "q": "You want rows 1 and column A to stay visible while you scroll. Which cell do you select before Freeze Panes?", "c": ["A1", "B2", "A2", "B1"], "a": 1, "why": "Freeze Panes freezes everything above and to the left of the selected cell."}, {"id": "e1b", "lvl": "E-1", "band": "Basic", "q": "Three sheets are selected (grouped), and you type in A1. What happens?", "c": ["Only the first sheet changes", "Excel blocks typing", "Only the last sheet changes", "All three sheets get the entry"], "a": 3, "why": "Grouped sheets get every edit. Click a single tab to ungroup when you're done."}, {"id": "e1c", "lvl": "E-1", "band": "Basic", "q": "Can you undo deleting a sheet with {{Cmd+Z}}?", "c": ["Yes, always", "No, sheet deletes can't be undone", "Only within 10 seconds", "Only if the sheet was empty"], "a": 1, "why": "Deleting a sheet is permanent. Close without saving if you delete the wrong one."}, {"id": "e1d", "lvl": "E-1", "band": "Basic", "q": "How do you show a hidden column F again?", "c": ["Double-click column G", "Press {{Cmd+Z}} twice", "Use Freeze Panes", "Select columns E and G, right-click, and choose Unhide"], "a": 3, "why": "Select the columns on both sides of the hidden one, then Unhide."}, {"id": "e1e", "lvl": "E-1", "band": "Basic", "q": "You set the zoom to 125% on one sheet. What happens to the others?", "c": ["They keep their own zoom", "They change too", "They change only when printed", "Excel asks"], "a": 0, "why": "Zoom is saved per sheet, and it doesn't change the printout."}, {"id": "e1f", "lvl": "E-1", "band": "Basic", "q": "Where do you switch a sheet to Landscape?", "c": ["[[View > Zoom]]", "[[Home > Format]]", "[[Data > Sort]]", "[[Page Layout > Orientation]]"], "a": 3, "why": "Orientation is a page setup setting, saved separately for each sheet."}, {"id": "e1g", "lvl": "E-1", "band": "Basic", "q": "Which file format keeps a workbook with no macros in Excel's standard form?", "c": [".xlsm", ".csv", ".txt", ".xlsx"], "a": 3, "why": ".xlsx is the default. .xlsm holds macros, and .csv holds one sheet of values only."}, {"id": "e1h", "lvl": "E-1", "band": "Basic", "q": "Where can you change a workbook's AutoRecover and default save settings on a Mac?", "c": ["[[Home > Format]]", "[[Excel > Settings]] (Preferences), then Save", "[[Data > Options]]", "[[View > Custom Views]]"], "a": 1, "why": "On a Mac, app options live under the Excel menu, in Settings (called Preferences on older versions)."}, {"id": "e2a", "lvl": "E-2", "band": "Productive", "q": "Headers print only on page 1. What fixes it?", "c": ["Print Titles: Rows to repeat at top", "Freeze Panes", "A header in the page header", "Print Area"], "a": 0, "why": "Freeze Panes is only for the screen. Print Titles repeats rows on every printed page."}, {"id": "e2b", "lvl": "E-2", "band": "Productive", "q": "You want only A1:F121 to print. Which feature?", "c": ["Print Titles", "Set Print Area", "Hide column G", "Page Break Preview"], "a": 1, "why": "Print Area limits what prints without hiding anything on screen."}, {"id": "e2c", "lvl": "E-2", "band": "Productive", "q": "What does `&P of &N` show in a footer?", "c": ["The file path", "Page number of total pages", "Print date", "Sheet name"], "a": 1, "why": "&P is the current page and &N is the number of pages. &A is the sheet name and &D is the date."}, {"id": "e2d", "lvl": "E-2", "band": "Productive", "q": "A wide sheet spills one column onto extra pages. Which setting fixes the width only?", "c": ["Width: 1 page, Height: Automatic", "Width: 1 page, Height: 1 page", "Landscape and 50% zoom", "Narrow margins only"], "a": 0, "why": "Height on 1 page would squeeze every row onto one sheet of paper. Automatic lets it run long."}, {"id": "e2e", "lvl": "E-2", "band": "Productive", "q": "You add manual page breaks, then set Fit to 1 page wide. What happens to the breaks?", "c": ["Excel keeps them", "Excel deletes the sheet", "They turn into print titles", "Excel ignores them while Fit To is on"], "a": 3, "why": "Fit To scaling overrides manual breaks. Use Adjust to a percentage if you need both."}, {"id": "e2f", "lvl": "E-2", "band": "Productive", "q": "Which view shows margins, headers, and footers as they'll print, while you edit?", "c": ["Normal", "Full Screen", "Page Layout", "Freeze Panes"], "a": 2, "why": "Page Layout view shows each page with its header and footer. Page Break Preview shows where the pages split."}, {"id": "e2g", "lvl": "E-2", "band": "Productive", "q": "Where do you set a workbook's Title and Author on a Mac?", "c": ["[[Home > Cell Styles]]", "[[Insert > Header & Footer]]", "[[Review > Notes]]", "[[File > Properties]]"], "a": 3, "why": "File, Properties, Summary holds the title, subject, author, and keywords."}, {"id": "e2h", "lvl": "E-2", "band": "Productive", "q": "Gridlines show on screen but not on paper. What turns them on for printing?", "c": ["Borders only", "[[Page Layout]], Gridlines, Print", "[[View > Gridlines]]", "Print Titles"], "a": 1, "why": "View gridlines and print gridlines are separate settings. Check Print under Gridlines on the Page Layout tab."}, {"id": "e3a", "lvl": "E-3", "band": "Advanced", "q": "You protect a sheet, and nobody can type anywhere, not even in the input cells. What was missed?", "c": ["A password", "Unlocking the input cells before protecting", "Saving as .xlsm", "Protecting the workbook"], "a": 1, "why": "Every cell starts Locked. Unlock the inputs (Format Cells, Protection) first, then protect the sheet."}, {"id": "e3b", "lvl": "E-3", "band": "Advanced", "q": "What does Protect Workbook (Structure) prevent?", "c": ["Adding, deleting, renaming, moving, hiding, and unhiding sheets", "Typing in cells", "Opening the file", "Printing"], "a": 0, "why": "Structure protection guards the sheets. Protect Sheet guards the cells."}, {"id": "e3c", "lvl": "E-3", "band": "Advanced", "q": "Which password stops a file from opening at all?", "c": ["Password to open", "Password to modify", "Protect Sheet password", "Protect Workbook password"], "a": 0, "why": "Password to open encrypts the file. Password to modify still lets people open it read-only."}, {"id": "e3d", "lvl": "E-3", "band": "Advanced", "q": "What's the quickest way to name A2:B5 PlanRates?", "c": ["Type PlanRates in the Name Box and press {{Return}}", "Rename the sheet", "Insert a note", "Use Format Painter"], "a": 0, "why": "The Name Box, to the left of the formula bar, names a selection instantly. Formulas, Define Name works too."}, {"id": "e3e", "lvl": "E-3", "band": "Advanced", "q": "Where do you add a message that pops up when someone clicks a cell?", "c": ["A note", "Data Validation, Input Message tab", "Header & Footer", "Alt text"], "a": 1, "why": "Input messages appear when the cell is selected. Error alerts appear when bad data is typed."}, {"id": "e3f", "lvl": "E-3", "band": "Advanced", "q": "A hyperlink should jump to Rates!A1 in the same workbook. Which option in the Insert Hyperlink dialog?", "c": ["This Document", "Web Page", "E-mail Address", "File"], "a": 0, "why": "This Document lists the sheets and named ranges in the workbook."}, {"id": "e3g", "lvl": "E-3", "band": "Advanced", "q": "What's the difference between a note and a comment in Microsoft 365?", "c": ["There's none", "Notes are simple sticky notes. Comments are threaded conversations people can reply to", "Comments print and notes don't", "Notes need OneDrive"], "a": 1, "why": "Threaded comments are for discussion, especially when co-authoring. Notes are the classic yellow annotations."}, {"id": "e3h", "lvl": "E-3", "band": "Advanced", "q": "Several people edit one workbook at the same time. Where must it be saved?", "c": ["On OneDrive or SharePoint", "On a USB drive", "On the desktop", "As a .csv file"], "a": 0, "why": "Co-authoring needs a cloud location. The same goes for Version History and AutoSave."}, {"id": "e4a", "lvl": "E-4", "band": "Expert", "q": "You record a macro and save as .xlsx. What happens to the macro?", "c": ["It's kept", "It turns into a formula", "It moves to the Personal Macro Workbook", "It's removed, because .xlsx can't hold macros"], "a": 3, "why": "Save macro workbooks as .xlsm (Excel Macro-Enabled Workbook)."}, {"id": "e4b", "lvl": "E-4", "band": "Expert", "q": "While recording, you click another sheet's tab. What does the macro do when you run it later?", "c": ["Nothing different", "It stops working", "It also jumps to that sheet", "It deletes that sheet"], "a": 2, "why": "The recorder captures every click, including sheet changes. Start on the right sheet and stay there."}, {"id": "e4c", "lvl": "E-4", "band": "Expert", "q": "Where do you turn on the Developer tab on a Mac?", "c": ["[[View > Developer]]", "[[Excel > Settings > Ribbon & Toolbar]]", "[[Insert > Developer]]", "It's always on"], "a": 1, "why": "Check Developer under Main Tabs in Ribbon & Toolbar."}, {"id": "e4d", "lvl": "E-4", "band": "Expert", "q": "How do you make a button on the sheet run a macro?", "c": ["Insert a shape and type the macro name", "Add a hyperlink", "Draw a Button (form control) from the Developer tab and pick the macro in Assign Macro", "Use Data Validation"], "a": 2, "why": "Any button or shape can be linked with Assign Macro. The Developer Button opens that dialog automatically."}, {"id": "e4e", "lvl": "E-4", "band": "Expert", "q": "What does Inspect Document look for before you share a file?", "c": ["Spelling errors", "Broken formulas only", "Macros only", "Hidden data and personal information, like comments, hidden sheets, and author names"], "a": 3, "why": "Inspect Document finds hidden content you may not want to share, and can remove it."}, {"id": "e4f", "lvl": "E-4", "band": "Expert", "q": "Which file type should you save a reusable blank layout as, so each use starts a fresh copy?", "c": [".xltx (Excel Template)", ".xlsx", ".csv", ".pdf"], "a": 0, "why": "Opening a template creates a new untitled workbook, so the original layout is never overwritten."}, {"id": "e4g", "lvl": "E-4", "band": "Expert", "q": "Check Accessibility flags a merged title. What's an accessible way to keep it centered?", "c": ["Merge it again", "Unmerge it and use Center Across Selection", "Delete the title", "Use a bigger font"], "a": 1, "why": "Center Across Selection looks the same as a merge but keeps the cells separate."}, {"id": "e4h", "lvl": "E-4", "band": "Expert", "q": "Microsoft 365 workbooks can be automated in Excel on the web with which tool?", "c": ["Flash Fill", "Goal Seek", "Office Scripts", "Sparklines"], "a": 2, "why": "Office Scripts (TypeScript-based) automate Excel on the web, while VBA macros run in desktop Excel. Office Scripts aren't in Excel for Mac, so this one is exam-only."}], "exam": [["THE FORMAT", "35 questions in 60 minutes. Expect a mix of multiple choice, interactive questions, and tasks done inside Excel. It isn't open book."], ["IT ADAPTS", "Every candidate gets a different set of questions. Right answers bring harder questions, and harder questions late in the test usually mean you're doing well. Don't panic when it gets tough."], ["THE SCORE", "One score from 1 to 1000. 351 passes and earns a diploma. 551 and up (Productive, Advanced, Expert) also earns a digital badge. The certification is valid for 3 years."], ["MAC SETUP", "The exam runs in Chrome or Firefox, not Safari. Use a laptop or desktop, since tablets and phones aren't allowed. Bring a photo ID. Check the browser with your teacher before test day."], ["CHECK CALCULATION FIRST", "Before any in-Excel task, make sure Excel is on [[Formulas > Calculation Options > Automatic]]. Numbers with a line through them mean Excel is in Manual calculation and the results are stale."], ["RETAKES", "You can retake the exam after 24 hours, and each attempt uses a new set of questions. Use the Practice Test here to find the levels to review first."]]}, "standalone": true, "form": {"base": "https://docs.google.com/forms/d/e/1FAIpQLSdrtwMxnUhOmbwENvMODNbVU8aNaQgTdEnN0NHd84FQ8Sca-g/viewform", "fields": ["1596578564", "1197020711", "1664961936", "1160269506", "999641579", "16206990"]}, "salt": "XQ-Belen-2026-k7Fq2Lr9"}</script>

<script>
/* Excel Quest grader core: reads a saved .xlsx/.xlsm in the browser (JSZip). Nothing leaves the page. */
const XQC = (function(){
  const NS = '*';
  const q = (el, name) => el ? Array.from(el.getElementsByTagNameNS(NS, name)) : [];
  const q1 = (el, name) => el ? (el.getElementsByTagNameNS(NS, name)[0] || null) : null;
  const kids = (el, name) => el ? Array.from(el.children).filter(c=>c.localName===name) : [];
  const attr = (el, a) => el ? el.getAttribute(a) : null;
  const parse = s => new DOMParser().parseFromString(s, 'application/xml');
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const rid = el => el ? (el.getAttributeNS(RNS,'id') || el.getAttribute('r:id')) : null;
  const BUILTIN_FMT = {0:'General',1:'0',2:'0.00',3:'#,##0',4:'#,##0.00',9:'0%',10:'0.00%',11:'0.00E+00',14:'m/d/yyyy',15:'d-mmm-yy',16:'d-mmm',17:'mmm-yy',18:'h:mm AM/PM',20:'h:mm',22:'m/d/yyyy h:mm',
    37:'#,##0 ;(#,##0)',38:'#,##0 ;[Red](#,##0)',39:'#,##0.00;(#,##0.00)',40:'#,##0.00;[Red](#,##0.00)',
    41:'_(* #,##0_);_(* (#,##0);_(* "-"_);_(@_)',42:'_("$"* #,##0_);_("$"* (#,##0);_("$"* "-"_);_(@_)',
    43:'_(* #,##0.00_);_(* (#,##0.00);_(* "-"??_);_(@_)',44:'_("$"* #,##0.00_);_("$"* (#,##0.00);_("$"* "-"??_);_(@_)',49:'@'};
  const BUILTIN_STYLE = {'15':'Title','16':'Heading 1','17':'Heading 2','18':'Heading 3','19':'Heading 4','25':'Total'};

  function colNum(letters){ let n=0; for(const ch of letters) n = n*26 + (ch.charCodeAt(0)-64); return n; }
  function colLet(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }
  function splitRef(ref){ const m=/^\$?([A-Z]+)\$?(\d+)$/.exec(ref); return m?{c:colNum(m[1]), r:+m[2]}:null; }
  function parseRange(rg){ rg = rg.replace(/\$/g,'').replace(/^.*!/,''); const [a,b]=rg.split(':');
    if(/^\d+$/.test(a)) return {c1:1,r1:+a,c2:16384,r2:+(b||a)};
    if(/^[A-Z]+$/.test(a)) return {c1:colNum(a),r1:1,c2:colNum(b||a),r2:1048576};
    const A=splitRef(a), B=b?splitRef(b):A; return {c1:Math.min(A.c,B.c),r1:Math.min(A.r,B.r),c2:Math.max(A.c,B.c),r2:Math.max(A.r,B.r)}; }
  function sqrefRanges(sq){ return (sq||'').trim().split(/\s+/).filter(Boolean).map(parseRange); }
  function covers(o, i){ return o.c1<=i.c1 && o.r1<=i.r1 && o.c2>=i.c2 && o.r2>=i.r2; }
  function intersects(a,b){ return !(a.c2<b.c1||b.c2<a.c1||a.r2<b.r1||b.r2<a.r1); }
  function cellsIn(rg){ const R=parseRange(rg), out=[]; for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) out.push(colLet(c)+r); return out; }
  const rgbOf = el => el ? (el.getAttribute('rgb')||'').slice(-6).toUpperCase() : '';
  function resolve(base, target){
    if(!target) return null; if(target.startsWith('/')) return target.slice(1);
    const parts = base.split('/'); parts.pop();
    for(const seg of target.split('/')){ if(seg==='..') parts.pop(); else if(seg!=='.') parts.push(seg); }
    return parts.join('/');
  }
  // shift relative refs in a shared formula from master to target cell
  function shiftFormula(f, dr, dc){
    if(!dr && !dc) return f;
    let out='', inStr=false;
    const re = /(\$?)([A-Z]{1,3})(\$?)(\d+)(?![\d(A-Za-z_!])/y;
    for(let i=0;i<f.length;){
      const ch=f[i];
      if(ch==='"'){ inStr=!inStr; out+=ch; i++; continue; }
      if(!inStr && (i===0 || !/[A-Za-z0-9_.\]]/.test(f[i-1]))){
        re.lastIndex=i; const m=re.exec(f);
        if(m){ const c = m[1] ? m[2] : colLet(colNum(m[2])+dc); const r = m[3] ? m[4] : String(+m[4]+dr);
          out += m[1]+c+m[3]+r; i = re.lastIndex; continue; }
      }
      out+=ch; i++;
    }
    return out;
  }

  async function load(buf){
    const zip = await JSZip.loadAsync(buf);
    const files = Object.keys(zip.files);
    const cache = {};
    const read = async p => { if(!p) return null; if(p in cache) return cache[p]; const f = zip.file(p); cache[p] = f ? await f.async('string') : null; return cache[p]; };
    const readX = async p => { const s = await read(p); return s ? parse(s) : null; };
    async function relsOf(path){ const dir = path.split('/'); const name = dir.pop(); const rp = (dir.length?dir.join('/')+'/':'') + '_rels/' + name + '.rels';
      const x = await readX(rp); const map = {}; q(x,'Relationship').forEach(r=>map[r.getAttribute('Id')] = {target: resolve(path, r.getAttribute('Target')), type:(r.getAttribute('Type')||'').split('/').pop(), external: r.getAttribute('TargetMode')==='External'}); return map; }

    const wbPath = 'xl/workbook.xml';
    const wbX = await readX(wbPath); const wbRels = await relsOf(wbPath);
    const sst = []; const sstX = await readX('xl/sharedStrings.xml');
    if(sstX) q(sstX,'si').forEach(si=>sst.push(q(si,'t').map(t=>t.textContent).join('')));
    const st = await readX('xl/styles.xml');
    const numFmts = {}; q(st,'numFmt').forEach(n=>numFmts[n.getAttribute('numFmtId')] = n.getAttribute('formatCode'));
    const fonts = Array.from(q1(st,'fonts').children).map(f=>({b:!!q1(f,'b') && attr(q1(f,'b'),'val')!=='0', i:!!q1(f,'i') && attr(q1(f,'i'),'val')!=='0',
       name:attr(q1(f,'name'),'val')||'', sz:attr(q1(f,'sz'),'val')||'', color:rgbOf(q1(f,'color'))}));
    const fills = Array.from(q1(st,'fills').children).map(f=>{ const p=q1(f,'patternFill'); return {type:p?(p.getAttribute('patternType')||'none'):'none', fg:rgbOf(p&&q1(p,'fgColor')), fgTheme:p&&q1(p,'fgColor')?q1(p,'fgColor').getAttribute('theme'):null}; });
    const side = (b,n)=>{ const e=q1(b,n); return e?(e.getAttribute('style')||''):''; };
    const borders = Array.from(q1(st,'borders').children).map(b=>({top:side(b,'top'),bottom:side(b,'bottom'),left:side(b,'left'),right:side(b,'right')}));
    const styleNames = {}; q(st,'cellStyle').forEach(c=>styleNames[c.getAttribute('xfId')] = BUILTIN_STYLE[c.getAttribute('builtinId')] || c.getAttribute('name'));
    const xfs = Array.from(q1(st,'cellXfs').children).map(x=>{ const a=q1(x,'alignment'), pr=q1(x,'protection'); const id=x.getAttribute('numFmtId')||'0';
      return {fmt: numFmts[id] || BUILTIN_FMT[id] || '', fmtId:+id, font:fonts[+(x.getAttribute('fontId')||0)], fill:fills[+(x.getAttribute('fillId')||0)],
        border:borders[+(x.getAttribute('borderId')||0)], styleName: styleNames[x.getAttribute('xfId')||'0'] || 'Normal',
        h:a?a.getAttribute('horizontal'):null, rot:a?+(a.getAttribute('textRotation')||0):0, indent:a?+(a.getAttribute('indent')||0):0, wrap:a?(a.getAttribute('wrapText')==='1'||a.getAttribute('wrapText')==='true'):false,

  // ================= M-2 Table Terrace =================

    W => { const t=tbl(W); if(!t) return F('Make the table first.'); if(!t.totals) return F('Turn on Total Row (Table tab).');

  const LM3 = [

    W => { const S=W.sheets.Sales; if(typeof val(S,'G2')!=='number') return F('Sales!G2 is text now. Undo, and put the word in the number format instead.');
      const bad=firstBad(cellsIn('G2:G31'), r=>/fans/i.test(fmtOf(S,r))); return bad ? F(`Sales!${bad} needs the custom format #,##0 "fans".`) : P(); },
    W => rulesOn(W.sheets.Sales,'D2:D31').some(c=>c.type==='dataBar') ? P() : F('Add data bars to Sales!D2:D31.'),
    W => { const r=rulesOn(W.sheets.Sales,'H2:H31').find(c=>c.type==='iconSet'); if(!r) return F('Add an icon set to Sales!H2:H31.'); return /arrow/i.test(r.iconSet) ? P() : F(`That icon set is ${r.iconSet}. Use 3 Arrows.`); },
    W => { const r=rulesOn(W.sheets.Sales,'E2:E31').find(c=>c.type==='colorScale'); if(!r) return F('Add a color scale to Sales!E2:E31.');
      if(r.scaleN!==3) return F('Use a 3-color scale: Green - Yellow - Red.'); const hi=r.scaleColors[2]||'', lo=r.scaleColors[0]||'';
      const g=c=>parseInt(c.slice(2,4)||'0',16)>parseInt(c.slice(0,2)||'0',16); return g(hi) && !g(lo) ? P() : F('High ratings should be green and low ones red. Pick Green - Yellow - Red.'); },
    W => { const r=rulesOn(W.sheets.Sales,'A2:A31').find(c=>c.type==='expression'); if(!r) return F('Add a formula rule to Sales!A2:A31.');
      const f=fnorm(r.formula[0]); if(!/WEEKDAY\(\$?A2,2\)>5/.test(f) && !/WEEKDAY\(\$?A2,2\)>=6/.test(f)) return F(`The rule formula is =${r.formula[0]}. Use =WEEKDAY(A2,2)>5, written for the first cell, A2.`);
      return r.dxf && (r.dxf.hasFill || r.dxf.fill) ? P() : F('Give the weekend rule a fill color.'); },
    W => { const rs=rulesOn(W.sheets.Summary,'G2:G9').filter(c=>c.type==='cellIs'); const g=rs.find(c=>+c.formula[0]===500000), y=rs.find(c=>+c.formula[0]===300000);

    W => { const sp=W.sheets.Summary.sparks; if(!sp.length) return F('Add Line sparklines in Summary!F2:F9.');
      const at=new Set(sp.map(s=>s.at.replace(/\$/g,''))); const bad=firstBad(cellsIn('F2:F9'), r=>at.has(r)); if(bad) return F(`Summary!${bad} has no sparkline. Location range: F2:F9.`);
      const s2=sp.find(s=>s.at.replace(/\$/g,'')==='F2'); if(!/B2:E2$/.test(s2.f.replace(/\$/g,''))) return F(`The F2 sparkline uses ${s2.f}. The data range should be B2:E9.`);
      return sp.every(s=>s.type==='line') ? P() : F('Use Line sparklines.'); },

  const LM4 = [
    W => { const r=rowRule(W, /G2="N"/); if(!r){ const loose=rulesOn(trk(W),'A2:H61').concat(trk(W).cf).find(c=>c.type==='expression' && /G\$?2="N"/.test(fnorm(c.formula[0])));
        if(loose && !/\$G2/.test(fnorm(loose.formula[0]))) return F(`The rule uses =${loose.formula[0]}. Lock the column with $: =$G2="N".`);

    W => { const S=sg(W); const n=S.comments.concat(S.threads).find(c=>c.ref==='B7'); if(!n) return F('Add a note to Signup!B7.'); return /today/i.test(n.text) ? P() : F('The note should say Start date can\'t be before today.'); },
    W => sg(W).protect && sg(W).protect.on ? P() : F('Protect the Signup sheet (Review, Protect Sheet).'),
    W => { const n=Object.keys(W.names).find(k=>lc(k)==='planrates'); if(!n) return F('Name Rates!A2:B5 PlanRates.'); return /Rates!\$?A\$?2:\$?B\$?5$/i.test(W.names[n].replace(/'/g,'')) ? P() : F(`PlanRates refers to ${W.names[n]}. It should be Rates!$A$2:$B$5.`); },
    W => { const R=W.sheets.Rates; const left=Object.keys(R.cells).find(r=>/premuim/i.test(String(R.cells[r].v||''))); if(left) return F(`Rates!${left} still says Premuim. Use Replace All on the Rates sheet.`);

    W => { const c=allCharts(W).find(c=>c.sheet==='Summary'); if(!c) return F('The chart on Summary is missing. Start from a fresh copy.'); return (c.descr||'').split(/\s+/).filter(Boolean).length>=3 ? P() : F('Add alt text to the chart that describes it in a few words (right-click, Edit Alt Text).'); },
    W => { const S=W.sheets.Summary; if(S.merges.some(m=>{ const R=parseRange(m); return R.r1===1; })) return F('Summary!A1:F1 is still merged. Turn Merge & Center off.');

</script>
<script type="application/json" id="codex-data">[{"id": "grammar", "title": "Formula Grammar", "tag": "CODEX · CHAPTER 0", "sub": "How Excel reads every formula", "lead": "Every formula in Excel follows the same grammar, the way every English sentence follows rules about subjects and verbs. Once you know the grammar, a new function is just a new word, not a new language. This chapter covers the rules that every world uses. The Codex entries after it go deep on each family of functions.", "sections": [{"id": "g-equals", "h": "1. The equals sign", "blocks": [{"t": "p", "x": "A cell holds one of two things. A **constant** is a value you typed, like 412, Coffee, or 3/2/2026. A **formula** is an instruction that Excel works out for you. Every formula starts with `=`. The equals sign tells Excel: don't store what I typed, calculate it and show me the answer."}, {"t": "p", "x": "The cell shows the answer. The formula bar, the long box above the column letters, shows the formula itself. When you're not sure which one a cell holds, click it and look at the formula bar. To see every formula on a sheet at once, press {{Ctrl+`}} (Show Formulas). Press it again to switch back."}, {"t": "ex", "f": "=G4-H4", "parts": [["=", "Starts every formula"], ["G4", "Monday's Total Sales"], ["-", "Subtract"], ["H4", "Monday's Expenses"]], "eval": [], "say": "Take whatever is in G4 and subtract whatever is in H4.", "out": "Monday's profit. G4 is 605 and H4 is 408, so the cell shows 197.", "from": "F-1"}, {"t": "p", "x": "**Why use cell addresses instead of numbers?** `=G4-H4` and `=605-408` both show 197 today. But when Yami fixes a typo in G4, the first formula updates by itself and the second one is wrong forever. Type a number straight into a formula only when it will never change, like the 12 in 12 months a year. Anything that could change, like a tax rate or a commission rate, belongs in its own cell."}, {"t": "p", "x": "You can see both ways in Excel Quest. In @@F-1@@ the 7% sales tax is typed into the formula (`=G4*0.07`). That works until the state changes the rate. In @@1-4@@ the commission rate lives in B2, so one edit to B2 updates every rep at once."}, {"t": "trap", "x": "Without the `=`, Excel stores what you typed as plain text. `SUM(C4:F4)` with no equals sign just shows the words SUM(C4:F4). A space before the `=` does the same thing."}]}, {"id": "g-refs", "h": "2. Addresses, ranges, and sheet names", "blocks": [{"t": "p", "x": "A **reference** tells Excel where to find a value. Every reference is built from a column letter and a row number, and the symbols around them change what it points to."}, {"t": "table", "head": ["You write", "It means", "Example from the guide"], "rows": [["`C10`", "One cell: column C, row 10", "Sunday's coffee sales in @@F-1@@"], ["`C4:F4`", "A range. The colon means \"through,\" so this is C4, D4, E4, and F4", "`=SUM(C4:F4)`"], ["`B2:E9`", "A block. Name the top-left cell, a colon, then the bottom-right cell", "The sparkline data in @@M-3@@"], ["`C:C`", "All of column C, top to bottom", "Handy, but slow in big workbooks (see section 11)"], ["`4:4`", "All of row 4", "Rarely needed in formulas"], ["`C4,E4`", "Two separate references. Inside a function, the comma starts a new argument", "`=SUM(C4,E4)` adds just those two cells"], ["`Week!G4:G10`", "A range on another sheet. The `!` separates the sheet name from the address", "`=AVERAGE(Week!G4:G10)` in @@F-1@@"], ["`'Staff Notes'!A1`", "A sheet name with a space (or a symbol) goes inside single quotes", "The renamed sheet in @@E-1@@"], ["`[L2-1_Tour_Prices.xlsx]Prices!$A$2:$C$7`", "A range in a different workbook. The file name goes in square brackets", "The external lookup in @@2-1@@"], ["`tblSales[Total]`", "A structured reference: the Total column of the table named tblSales", "`=SUM(tblSales[Total])` in @@1-4@@"], ["`MenuPrices`", "A named range: a name that stands for an address", "`=AVERAGE(MenuPrices)` in @@1-2@@"]]}, {"t": "p", "x": "You almost never have to type sheet or workbook names yourself. Start the formula, click the other sheet's tab (or switch to the other workbook), and select the cells. Excel writes the reference for you, quotes and brackets included. That's also the safest way, because Excel can't misspell a sheet name."}, {"t": "ex", "f": "=AVERAGE(Week!G4:G10)", "parts": [["AVERAGE(", "The function: find the typical value"], ["Week!", "Look on the Week sheet, not this one"], ["G4:G10", "G4 through G10: the Total Sales for Monday to Sunday"]], "eval": [], "say": "Average the seven daily totals on the Week sheet.", "out": "The typical day's sales, shown on the Closeout sheet. It updates whenever a number on the Week sheet changes.", "from": "F-1"}, {"t": "tip", "x": "When the other workbook is closed, Excel shows its full location, like `'/Users/you/Desktop/[L2-1_Tour_Prices.xlsx]Prices'!$A$2:$C$7`. That's normal. Open the file again and the path disappears."}, {"t": "exam", "x": "TOSA often shows a reference and asks what it points to. Remember: `!` means a sheet, `[ ]` means a workbook, and `' '` wraps a name that has spaces."}]}, {"id": "g-ops", "h": "3. Operators and the order Excel does math", "blocks": [{"t": "p", "x": "An **operator** is a symbol that does something to the values around it. Excel has three kinds: math, joining text, and comparing."}, {"t": "table", "head": ["Operator", "What it does", "Example", "Result"], "rows": [["`+` `-` `*` `/`", "Add, subtract, multiply, divide", "`=G4*0.07`", "7% of G4"], ["`^`", "Raise to a power", "`=1.05^12`", "About 1.7959 (5% growth, 12 times)"], ["`%`", "Divide by 100", "`=G4*7%`", "Same as `=G4*0.07`"], ["`&`", "Join text together", "`=B2&\" by \"&C2`", "Title by Author (the same job CONCAT does in @@1-4@@)"], ["`=` `<>`", "Equal to, not equal to", "`=K2=\"Y\"`", "TRUE or FALSE"], ["`>` `<` `>=` `<=`", "Greater than, less than, or equal to", "`=G4>=600`", "TRUE if G4 is 600 or more"]]}, {"t": "p", "x": "When a formula has more than one operator, Excel doesn't just go left to right. It follows an order, like PEMDAS in math class. Things on the same level go left to right."}, {"t": "table", "head": ["Order", "Operator", "Name"], "rows": [["1", "`( )`", "Parentheses"], ["2", "`-` in front of a value", "Negative sign"], ["3", "`%`", "Percent"], ["4", "`^`", "Exponent"], ["5", "`*` and `/`", "Multiply and divide"], ["6", "`+` and `-`", "Add and subtract"], ["7", "`&`", "Join text"], ["8", "`=` `<>` `>` `<` `>=` `<=`", "Compare"]]}, {"t": "ex", "f": "=D2*(1-E2)", "parts": [["D2", "The list price"], ["*", "Multiply"], ["(1-E2)", "1 minus the discount, worked out first because of the parentheses"]], "eval": [], "say": "Multiply the list price by whatever is left after the discount.", "out": "A $20 book with a 0.25 discount: 20 × 0.75 = 15.", "from": "F-3"}, {"t": "p", "x": "Take away the parentheses and you get `=D2*1-E2`. Excel multiplies first, so that's 20 × 1 = 20, then subtracts 0.25. The answer is $19.75, and there's no error message to warn you. The parentheses aren't decoration. They change the answer."}, {"t": "trap", "x": "`=-2^2` gives **4** in Excel, not -4. Excel applies the negative sign (level 2) before the exponent (level 4), so it squares -2. If you want negative 4, write `=-(2^2)`."}, {"t": "trap", "x": "Comparisons always happen last. `=A1+5>10` means \"is A1 plus 5 greater than 10?\" The answer is TRUE or FALSE, not a number."}, {"t": "tip", "x": "When you're not sure what Excel will do first, add parentheses. Extra parentheses never change a correct formula, and they make it easier to read."}]}, {"id": "g-types", "h": "4. Data types: what can live in a cell", "blocks": [{"t": "p", "x": "Every value in Excel has a **type**, and the type decides what a formula can do with it. Most formula mistakes in the real world are type mistakes: a number stored as text, or a date that's really just words."}, {"t": "table", "head": ["Type", "Examples", "How to spot it", "What formulas do with it"], "rows": [["Number", "412, 0.07, -50", "Lines up on the right side of the cell", "Math, SUM, AVERAGE, COUNT"], ["Text", "Coffee, SPX-FIC-0153, 00412", "Lines up on the left", "Join it, cut it apart, compare it. Inside a formula, text always goes in \"double quotes\""], ["Logical", "TRUE, FALSE", "Centered, in capitals", "The answer to a comparison. IF, AND, OR, and NOT run on these"], ["Date or time", "3/2/2026, 6:30 PM", "Right side, like a number, because it is one", "Date math: add days, subtract dates"], ["Error", "#N/A, #DIV/0!", "Starts with #", "Spreads to every formula that uses it (see section 10)"]]}, {"t": "p", "x": "**Dates are numbers in disguise.** Excel counts days, starting with January 1, 1900 as day 1. March 2, 2026 is stored as 46083. The date format just makes 46083 look like a date. That's why date math works: in @@F-2@@, `=G2+H2` adds a number of days to a start date to get a due date, and `=J2-I2` subtracts two dates to get the days in between."}, {"t": "ex", "f": "=G2+H2", "parts": [["G2", "The Start Date. It shows 3/2/2026, but the cell really holds 46083"], ["+", "Add"], ["H2", "The number of days rented, like 3"]], "eval": ["Excel reads G2 as the number 46083", "46083 + 3 = 46086", "The Short Date format shows 46086 as 3/5/2026"], "say": "Start with the rental date and count forward the number of days rented.", "out": "The due date, 3/5/2026.", "from": "F-2"}, {"t": "p", "x": "**Times are fractions of a day.** 0.5 is noon, 0.25 is 6 AM, and 0.75 is 6 PM. So 46083.75 is 6 PM on March 2, 2026. NOW() returns the date and the time together. TODAY() returns just the date."}, {"t": "p", "x": "**Formats change how a value looks, never what it is.** Format 0.25 as a percent and the cell shows 25%, but the formula bar still says 0.25. Format 46083 as Long Date and you see Monday, March 2, 2026. The Style Summit world (M-1 to M-4) is all about this."}, {"t": "trap", "x": "**Text that looks like a number** is the classic trap. A space after the digits, an apostrophe in front, or a CSV import can turn 412 into text. It sits on the left side of the cell, SUM skips it, and COUNT ignores it, so your totals come out too low with no error. Fix it with Text to Columns or Convert to Number (@@D-1@@) or with VALUE (@@D-3@@)."}, {"t": "p", "x": "One odd detail worth knowing for the exam: plain math operators try to convert text, but functions like SUM don't. If A1 holds the text \"5\", `=A1+1` gives 6, but `=SUM(A1,1)` gives 1 when A1 is a cell reference, because SUM skips text in cells."}, {"t": "p", "x": "**TRUE and FALSE act like 1 and 0 in math.** `=TRUE+TRUE` gives 2. FILTER uses this trick in @@2-3@@: `(B2:B41=\"Nike\")*(G2:G41>200)` multiplies two lists of TRUE/FALSE answers. Only TRUE × TRUE gives 1, so only rows that pass both tests survive. That's why `*` means AND inside FILTER, and `+` means OR."}, {"t": "p", "x": "**Empty cells** count as 0 in math and as \"\" (empty text) in comparisons. That's why `J2=\"\"` is how @@F-2@@ asks \"is the Returned date blank?\""}]}, {"id": "g-anatomy", "h": "5. The anatomy of a function", "blocks": [{"t": "p", "x": "A **function** is a named calculation that Excel already knows, like SUM or VLOOKUP. Every function has the same shape: its name, an opening parenthesis, the **arguments** (the inputs) separated by commas, and a closing parenthesis."}, {"t": "sig", "s": "IF(logical_test, [value_if_true], [value_if_false])", "args": [["logical_test", "required", "A comparison that comes out TRUE or FALSE, like `G4>=600`"], ["value_if_true", "optional", "What to show when the test is TRUE. Text goes in quotes: `\"Goal\"`. Excel lets you skip it, but you'll almost always fill it in"], ["value_if_false", "optional", "What to show when the test is FALSE. Leave it off and Excel shows FALSE"]]}, {"t": "p", "x": "This line is called the function's **signature**. Excel shows it in a small box under the cell as soon as you type `=IF(`, and the argument you're working on turns bold. Learning to read a signature means you can use a function you've never seen before."}, {"t": "p", "x": "**Read the hint exactly as Excel shows it.** Excel's hint for IF is `IF(logical_test, [value_if_true], [value_if_false])`. Both answers are in brackets, because Excel accepts an IF without them. But an IF with no value_if_true can't show your answer when the test is TRUE, so in practice you always fill in the first two. The brackets tell you what Excel will accept, not what your task needs."}, {"t": "ex", "f": "=IF(G4>=600,\"Goal\",\"Below\")", "parts": [["IF(", "The function name and its opening parenthesis"], ["G4>=600", "logical_test: is Monday's total 600 or more?"], ["\"Goal\"", "value_if_true: the word to show when the test is TRUE"], ["\"Below\"", "value_if_false: the word to show when it's FALSE"]], "eval": [], "say": "If G4 is at least 600, show Goal. Otherwise, show Below.", "out": "Each argument fills one slot in the signature above, in order, separated by commas.", "from": "F-1"}, {"t": "table", "head": ["In a signature", "It means"], "rows": [["A plain name, like `logical_test`", "Required. Leave it out and Excel refuses the formula"], ["A name in `[square brackets]`", "Optional. Leave it out and Excel uses a default value"], ["`...` at the end", "You can keep adding more of the same, like `SUM(number1, [number2], ...)`"], ["Empty parentheses, like `TODAY()`", "The function takes no arguments, but you still have to type the parentheses"]]}, {"t": "p", "x": "An argument can be a value (412, \"Premium\", TRUE), a reference or range (C4:F4), a name (PlanRates), or a whole other function. That last one is called nesting, and it gets its own section next."}, {"t": "p", "x": "**Skipping an optional argument in the middle.** To use a later optional argument but skip an earlier one, leave an empty spot between the commas. In `=XLOOKUP(B3,A2:A41,C2:C41,,2)`, the two commas in a row skip if_not_found so the formula can set match_mode to 2. For most functions an empty spot means \"use the default,\" but check the result."}, {"t": "tip", "x": "Press {{Shift+F3}}, or click the fx button next to the formula bar, to open the **Formula Builder**. It shows one box per argument, a plain-English description of each, and the result as you build. It's the best way to learn a new function."}, {"t": "tip", "x": "Type `=` and the first few letters of a function name. Excel shows a list of matching functions. Use the arrow keys to pick one and press {{Tab}} to accept it with its opening parenthesis."}, {"t": "trap", "x": "Text in a formula needs straight double quotes: `\"Goal\"`. Curly quotes (“Goal”) copied from Google Docs, Word, or a website aren't the same character. Excel either refuses the formula or shows #NAME?."}, {"t": "p", "x": "Your Mac separates arguments with commas. Excel in some other countries (France, where Tosa started, is one) uses semicolons instead, so you may see `=IF(G4>=600;\"Goal\";\"Below\")` in a screenshot. The grammar is the same. Only the separator changed."}]}, {"id": "g-nest", "h": "6. Nesting: functions inside functions", "blocks": [{"t": "p", "x": "Any argument can be another function. Excel works from the **inside out**: it calculates the innermost function first, then hands that result to the function around it, like a set of nested boxes."}, {"t": "ex", "f": "=PROPER(TRIM(D2))", "parts": [["PROPER(", "Second: capitalize the first letter of each word"], ["TRIM(", "First: remove the extra spaces"], ["D2", "The messy customer name"]], "eval": ["D2 holds `\" TOmás rOJaS \"`", "TRIM(D2) runs first and gives `\"TOmás rOJaS\"`", "PROPER gets that result and gives `\"Tomás Rojas\"`"], "say": "Trim the spaces off D2, then put the result in proper case.", "from": "D-3"}, {"t": "ex", "f": "=IF(J2=\"\",0,IF(J2>I2,J2-I2,0))", "parts": [["J2=\"\"", "Test 1: is the Returned date blank?"], ["0", "If it's blank, the board is still out. Show 0"], ["IF(J2>I2,J2-I2,0)", "Otherwise, run a second IF: if it came back after the due date, show the days late. If not, 0"]], "eval": [], "say": "If the board isn't back yet, 0. Otherwise, if it came back after the due date, the number of days late. Otherwise, 0.", "from": "F-2"}, {"t": "p", "x": "The second IF sits in the value_if_false spot of the first one. Read a nested IF from the outside in, the way Excel asks the questions: the first test that comes out TRUE wins, and Excel stops there. That's why the order of the tests matters so much. In @@F-6@@ a tier formula checks 5,000 before 10,000, so Bayfront Live's $12,450 stops at Gold and never reaches Platinum."}, {"t": "steps", "items": ["Write the inside piece by itself in a spare cell and check that it gives the right answer.", "Write the outside function in another cell, pointing at the spare cell instead of the inside piece.", "Once both work, copy the inside formula from the formula bar (without its `=`) and paste it over the spare cell's address.", "Delete the spare cell. You built a nested formula one checked piece at a time."]}, {"t": "tip", "x": "As you type, Excel colors each pair of parentheses and briefly bolds the matching one when you type a closing parenthesis. Every `(` needs a `)`. If Excel complains about the formula, count them."}, {"t": "trap", "x": "A misplaced parenthesis often gives a wrong answer with **no error**. `=ROUND(D2*(1-E2),2)` rounds the sale price. `=ROUND(D2,2)*(1-E2)` rounds the list price and then applies the discount, so you get prices like 14.9925. Both formulas run, and only one is right."}, {"t": "exam", "x": "MO-211 says \"nested functions\" by name. TOSA Expert asks you to \"combine functions into complex formulas\" and to debug them. Both expect you to read a nested formula and predict what it returns."}]}, {"id": "g-copy", "h": "7. Copying formulas: relative, absolute, and mixed references", "blocks": [{"t": "p", "x": "Here's a secret about references: Excel doesn't really store \"C4.\" It stores directions from the formula's own cell. `=SUM(C4:F4)` in G4 really means \"the four cells to my left.\" Copy it to G5 and the same directions now point to C5:F5. This is called a **relative reference**, and it's why one formula can fill a whole column."}, {"t": "p", "x": "Sometimes a reference must not move, like a single rate cell or a lookup table. A dollar sign locks the part right after it."}, {"t": "table", "head": ["You write", "Fill it down", "Fill it right", "Use it for"], "rows": [["`B2`", "Row changes", "Column changes", "Most formulas: each row works on its own data"], ["`$B$2`", "Stays B2", "Stays B2", "One fixed cell or table, like a rate or a lookup range"], ["`$B2`", "Row changes", "Stays column B", "Locks the column only"], ["`B$2`", "Stays row 2", "Column changes", "Locks the row only"]]}, {"t": "ex", "f": "=B5*$B$2", "parts": [["B5", "This rep's sales. Relative, so it moves to B6, B7, and so on"], ["$B$2", "The commission rate. Absolute, so every row uses B2"]], "eval": [], "say": "Multiply this row's sales by the one commission rate in B2.", "from": "1-4"}, {"t": "ex", "f": "=$E5*F$4", "parts": [["$E5", "The price. Column E is locked, and the row moves down"], ["F$4", "The quantity. Row 4 is locked, and the column moves across"]], "eval": [], "say": "Multiply this row's price by this column's quantity.", "out": "One formula fills the whole price-by-quantity grid. This is a **mixed reference**.", "from": "1-4"}, {"t": "p", "x": "**The one-question test:** before you fill a formula, ask \"when this formula moves, which part has to stay still?\" Lock that part, and only that part."}, {"t": "tip", "x": "While your cursor is inside a reference in the formula bar, press {{Cmd+T}} to cycle through `$B$2`, `B$2`, `$B2`, and `B2`."}, {"t": "trap", "x": "In @@F-2@@, a VLOOKUP without `$` on the rate table slides down one row each time it's filled. By row 41 it's searching an empty range and shows #N/A."}, {"t": "p", "x": "**Names and tables don't slide.** A named range like PlanRates or AnnualRate always points to the same cells, so it acts like an absolute reference. Structured references go by meaning instead of position: `[@Qty]` means \"the Qty in this row,\" and `tblSales[Total]` always means the whole Total column, even after the table grows."}, {"t": "p", "x": "**Copying and moving are different.** Copying a formula shifts its relative references. Cutting and pasting it ({{Cmd+X}}) moves it with its references unchanged. To copy a formula exactly as it is, copy its text from the formula bar instead of copying the cell. That's what the TOSA framework means by \"copy formulas without changing references.\""}]}, {"id": "g-criteria", "h": "8. Criteria: conditions written as text", "blocks": [{"t": "p", "x": "Excel writes conditions in two different ways, and mixing them up is one of the most common mistakes on both exams."}, {"t": "p", "x": "**In IF, the test is a formula.** You write the whole comparison, with no quotes around it: `=IF(G4>=600,\"Goal\",\"Below\")`."}, {"t": "p", "x": "**In the IF-family functions, the condition is a criteria string.** COUNTIF, COUNTIFS, SUMIF, SUMIFS, AVERAGEIF, AVERAGEIFS, MAXIFS, and MINIFS check every cell in a range for you. So you write only the part that comes after the cell, in quotes: `\">=600\"`."}, {"t": "table", "head": ["Criteria", "Matches", "Notes"], "rows": [["`\"Premium\"` or a cell like `A4`", "Cells equal to Premium", "Not case-sensitive: premium and PREMIUM match too"], ["`\">=600\"`", "600 or more", "The operator goes inside the quotes"], ["`\"<>Y\"`", "Anything except Y", "Blank cells count as \"not Y\""], ["`\"<>\"`", "Any cell that isn't blank", "Used in @@2-3@@ to count only sold pairs"], ["`\"\"`", "Blank cells", "Also matches formulas that return \"\""], ["`\">\"&B1`", "Greater than whatever is in B1", "Join the operator to the cell with `&`"], ["`\">=\"&DATE(2025,1,1)`", "On or after January 1, 2025", "Dates work like numbers"], ["`\"Nike*\"`", "Starts with Nike", "`*` means any number of any characters"], ["`\"*Jordan*\"`", "Contains Jordan anywhere", "Stars on both sides"], ["`\"???\"`", "Exactly three characters", "`?` means exactly one character"], ["`\"~*\"`", "A real asterisk", "`~` turns off the wildcard meaning"]]}, {"t": "ex", "f": "=COUNTIFS(Members!C2:C81,\"Premium\",Members!H2:H81,\"Active\")", "parts": [["Members!C2:C81,\"Premium\"", "Pair 1: the Plan column must say Premium"], ["Members!H2:H81,\"Active\"", "Pair 2: the Status column must say Active"]], "eval": [], "say": "Count the members whose plan is Premium and whose status is Active.", "out": "A row counts only when every pair is true.", "from": "F-4"}, {"t": "trap", "x": "`\">B1\"` doesn't mean \"greater than B1.\" Everything inside the quotes is text, so Excel compares against the letters B1. Write `\">\"&B1` so Excel joins the operator to the value in B1."}, {"t": "trap", "x": "**The argument order flips.** In `SUMIF(range, criteria, [sum_range])` the range you add up comes **last**. In `SUMIFS(sum_range, criteria_range1, criteria1, ...)` it comes **first**. The same flip applies to AVERAGEIF and AVERAGEIFS. The exam loves this."}, {"t": "p", "x": "**Criteria ranges** are a third style, used by DSUM, DCOUNT, and Advanced Filter (@@F-4@@, @@D-2@@). You type the conditions into cells under headers that exactly match the table's headers. Conditions on the same row mean AND. Conditions on different rows mean OR."}, {"t": "p", "x": "Wildcards also work in lookups. XLOOKUP needs match_mode 2 to read `*` and `?` as wildcards. VLOOKUP with FALSE and MATCH with 0 read them automatically."}]}, {"id": "g-arrays", "h": "9. Dynamic arrays: one formula, many cells", "blocks": [{"t": "p", "x": "Most functions return one value. **Dynamic array functions** return a whole list or grid: SORT, SORTBY, UNIQUE, FILTER, SEQUENCE, and RANDARRAY, plus XLOOKUP when it returns a full column. You type the formula in one cell and the results **spill** into the cells below and to the right. A thin blue border marks the spill range."}, {"t": "ex", "f": "=SORT(UNIQUE(Import!I2:I31))", "parts": [["UNIQUE(Import!I2:I31)", "First: list each genre code once"], ["SORT(", "Second: put that list in A to Z order"]], "eval": [], "say": "List every genre code once, in alphabetical order.", "out": "One formula in A7 fills as many cells as there are genres, and it updates when the data changes.", "from": "F-3"}, {"t": "p", "x": "Only the first cell actually holds the formula. Click any other cell in the spill range and the formula bar shows the formula grayed out. To point at the whole spill range from somewhere else, add `#` to the first cell's address: `=COUNTA(Genres!A7#)` counts the genres, and still works when the list grows."}, {"t": "p", "x": "**Array math** is the idea underneath. `B2:B41=\"Nike\"` doesn't give one answer. It gives 40 answers, a TRUE or FALSE for each row. Functions like FILTER and SUMPRODUCT are built to work with those lists. In @@F-4@@, `=SUMPRODUCT(Members!E2:E81,Members!F2:F81)` multiplies 80 pairs of numbers and adds up the 80 results, with no helper column."}, {"t": "trap", "x": "#SPILL! means something is in the way: a value, a merged cell, or the edge of the sheet. Clear the cells where the results need to go. Dynamic arrays also can't spill inside an Excel table, so put them outside the table."}, {"t": "p", "x": "In older files you may see an `@` in front of a reference, like `=@A2:A10`. It means \"just the one value from this row,\" which is how Excel worked before dynamic arrays. You'll rarely need to type it yourself."}]}, {"id": "g-errors", "h": "10. Errors: what each one is telling you", "blocks": [{"t": "p", "x": "An error isn't Excel being broken. It's Excel telling you exactly what kind of problem it found. Learn to read the message and most fixes take seconds."}, {"t": "table", "head": ["You see", "It means", "Usual causes", "How to fix it", "Seen in"], "rows": [["`####`", "Not an error. The column is too narrow", "A long date or number, or a negative date", "Widen the column", "@@F-1@@"], ["`#NAME?`", "Excel doesn't recognize a word in the formula", "A misspelled function (SUMM), text missing its quotes, a name that doesn't exist, curly quotes", "Fix the spelling or add quotes", "@@F-1@@"], ["`#DIV/0!`", "You divided by zero or by an empty cell", "A count that's 0, a blank input", "Fill in the input, or test for 0 first with IF", "@@F-1@@, @@F-4@@"], ["`#N/A`", "A lookup couldn't find the value", "A typo, an extra space, a number stored as text, a lookup range that slid", "Check the lookup value and the `$` signs. IFNA can show a friendlier result", "@@F-3@@, @@F-6@@"], ["`#REF!`", "The formula points at a cell that's gone", "A deleted row, column, or sheet. A formula copied so far that its reference falls off the sheet", "Undo the delete, or rewrite the reference", "This section"], ["`#VALUE!`", "A value is the wrong type", "Text used in math (`=\"abc\"+1`), a date DATEVALUE can't read, a range where one value belongs", "Clean the data with VALUE and TRIM, or fix the argument", "@@D-3@@"], ["`#SPILL!`", "A dynamic array can't spill", "Something in the way, or the formula is inside a table", "Clear the cells, or move the formula", "@@F-3@@"], ["`#CALC!`", "Excel can't finish the calculation", "A LAMBDA with nothing to work on, FILTER with no matches and no if_empty value", "Call the LAMBDA, or add if_empty", "@@F-6@@"], ["`#NUM!`", "A number is impossible or out of range", "RATE can't find an answer, a result too big for Excel", "Check the inputs and their signs", "@@F-5@@"], ["`#NULL!`", "Two ranges were supposed to cross and don't", "A space where a comma or colon should be: `=SUM(A1:A5 B1:B5)`", "Use a comma or a colon", "Rare"]]}, {"t": "p", "x": "**Errors spread.** When one cell shows an error, every formula that uses that cell shows an error too. In @@F-1@@, one #NAME? in Tips!B10 broke B11 and every share in column C. Always fix the first error in the chain, not the last one. Trace Precedents (@@2-3@@) draws arrows back to where the problem started."}, {"t": "ex", "f": "=SUMM(B4:B7)", "parts": [["SUMM(", "Not a real function, so Excel can't read it"], ["B4:B7", "The hours worked. This part was fine all along"]], "eval": ["Excel looks up the name SUMM in its list of functions and finds nothing, so B10 shows #NAME?", "B11 divides the tips by B10, so B11 gets the error too", "Every share in column C uses B11, so the whole column fails"], "say": "Add up B4 through B7, once SUMM is spelled SUM.", "out": "Retype it as `=SUM(B4:B7)` and the whole chain fixes itself. One typo, one fix.", "from": "F-1"}, {"t": "p", "x": "**What deleting does to formulas.** This is one of the most tested ideas at the TOSA Basic level, and it trips up a lot of people."}, {"t": "list", "items": ["Delete a row **inside** a range and the range shrinks. `=SUM(C4:C10)` becomes `=SUM(C4:C9)` and keeps working.", "Delete a row that holds a **single cell** a formula points to and that reference becomes #REF!. `=Rates!B3*2` turns into `=Rates!#REF!*2` when row 3 of Rates is deleted.", "Delete a whole **sheet** that a formula uses and every reference to it becomes #REF!.", "Insert a row **inside** a range and the range grows to include it.", "Insert a row **right below** the last row of a range and the range usually doesn't grow. The new row gets left out of the total, with no error. Tables (@@1-3@@, @@D-3@@) solve this, because a table grows by itself.", "**Clearing** a cell (the {{Delete}} key) isn't the same as **deleting** it. A cleared cell is just empty, so formulas keep pointing at it and treat it as 0."]}, {"t": "p", "x": "**Hiding errors.** `IFERROR(value, value_if_error)` catches every error. `IFNA(value, value_if_na)` catches only #N/A. Catch only the error you expect. If you wrap everything in IFERROR, a real mistake like a #DIV/0! gets hidden as a 0, and nobody ever finds it."}, {"t": "trap", "x": "The most dangerous formula is one with **no error** and a wrong answer. In @@F-4@@, an average that stops one row early and a rate that divides by the header row both look perfectly normal. Click into formulas and check their ranges, especially in reports other people will trust."}]}, {"id": "g-calc", "h": "11. When Excel calculates", "blocks": [{"t": "p", "x": "In **Automatic** calculation, the normal setting, every change makes Excel recalculate every formula that depends on it. In **Manual** calculation, nothing updates until you press {{Cmd+=}}. On a Mac, Microsoft 365 draws a line through numbers that are out of date. The setting covers every open workbook, and it comes from the first workbook you opened (@@2-1@@)."}, {"t": "p", "x": "**Volatile functions** recalculate after every change anywhere in the workbook, even when their inputs didn't change: TODAY, NOW, RAND, RANDBETWEEN, RANDARRAY, OFFSET, and INDIRECT. That's why the @@F-4@@ raffle redraws every time you press {{Cmd+=}}, and why TODAY shows tomorrow's date tomorrow."}, {"t": "ex", "f": "=IF(I2=\"\",TODAY()-H2,I2-H2)", "parts": [["I2=\"\"", "Has the pair sold? A blank Sold date means no"], ["TODAY()-H2", "Not sold: today's date minus the Listed date. TODAY is volatile"], ["I2-H2", "Sold: the Sold date minus the Listed date. This never changes"]], "eval": [], "say": "If the pair hasn't sold, count the days from when it was listed until today. If it has, count the days until it sold.", "out": "On October 26, 2026, a pair listed September 25 shows 31. Tomorrow it shows 32, even though nobody touched the file.", "from": "2-3"}, {"t": "p", "x": "**Faster formulas.** TOSA Expert asks you to \"optimize formula performance.\" In a big workbook, these habits keep Excel quick:"}, {"t": "list", "items": ["Point at the real data or a table, not whole columns like `C:C`, in functions that do a lot of work.", "Use LET to work out a repeated piece once and reuse its name, instead of repeating the same calculation three times in one formula.", "When the same lookup is needed in several formulas, do it once in a helper column and point at that column.", "Use INDEX instead of OFFSET when either one can do the job. INDEX isn't volatile."]}]}, {"id": "g-debug", "h": "12. Reading and debugging any formula", "blocks": [{"t": "p", "x": "When a formula gives an answer you don't trust, don't retype it. Take it apart:"}, {"t": "steps", "items": ["Click the cell and click into the formula bar. Excel outlines each reference on the sheet in the same color it uses in the formula, so a range that's one row short is easy to spot.", "Read it aloud, the way every Codex entry does. If you can't say what a piece does, that's the piece to check.", "Select one piece of the formula in the formula bar and press {{Fn+F9}} to see just that piece's value. Press {{Esc}} afterward so you don't save the change.", "Use [[Formulas > Trace Precedents]] to see what feeds the cell and [[Formulas > Trace Dependents]] to see what it feeds.", "Press {{Shift+F3}} to open the Formula Builder. It shows each argument in its own box, with the current value of each one, so you can find the piece that goes wrong.", "Press {{Ctrl+`}} to show every formula on the sheet and look for the one that doesn't match its neighbors. A green triangle in a cell's corner often marks exactly that."]}, {"t": "ex", "f": "=AVERAGE(Members!E2:E80)", "parts": [["AVERAGE(", "Average the values in the range"], ["Members!E2:E80", "The range stops at row 80, but the members go down to row 81"]], "eval": ["Click Analytics!B10, then click into the formula bar", "Excel draws a colored box around Members!E2:E80. The last member, in row 81, sits just outside the box", "Change E80 to E81 and press {{Return}}"], "say": "Average every Monthly Fee from row 2 down to row 80, which is one member short.", "out": "No error ever appeared. Only reading the range showed the problem. The fix is `=AVERAGE(Members!E2:E81)`.", "from": "F-4"}, {"t": "tip", "x": "A Watch Window ([[Formulas > Watch Window]]) keeps an eye on an important cell, like a total, while you edit somewhere else in the workbook (@@2-3@@)."}]}, {"id": "g-exam", "h": "On the exams", "blocks": [{"t": "p", "x": "**MOS (Certiport)** grades the finished file. In most tasks any correct formula passes, but some tasks name the function to use. When a task says \"use COUNTIFS,\" use COUNTIFS, even if another formula gives the same number. Read references and cell addresses in the task twice."}, {"t": "p", "x": "**TOSA** mixes tasks in Excel with multiple-choice questions about formulas. Expect questions like: what does this formula return, which reference stays fixed when it's copied, what does this error mean, and which formula has a bug. Every one of those comes straight from this chapter. If you can read a formula aloud and predict its answer before Excel does, you're ready for them."}, {"t": "ex", "f": "=ROUND(14.567,1)*2", "parts": [["ROUND(14.567,1)", "Inside first: round 14.567 to 1 decimal place"], ["*2", "Then multiply the rounded result by 2"]], "eval": ["ROUND(14.567,1) gives 14.6", "14.6 × 2 = 29.2"], "say": "Round 14.567 to one decimal, then double it.", "out": "A TOSA-style question: \"What does this formula return?\" The answer is 29.2. If you picked 29.1, you multiplied first and rounded second, which is the opposite of how Excel reads the parentheses."}]}], "kw": "AVERAGE COUNTA COUNTIFS DATE IF IFERROR IFNA NOW PROPER ROUND SORT SUM SUMIF SUMIFS SUMM SUMPRODUCT TODAY TRIM UNIQUE XLOOKUP Formula Grammar How Excel reads every formula"}, {"id": "sum-stats", "title": "SUM, AVERAGE, MAX, MIN", "tag": "CODEX · MATH AND COUNTING", "sub": "The four everyday summary functions", "lead": "These four functions turn a column of numbers into one useful number: the total, the typical value, the biggest, and the smallest. They're the first functions anyone learns, and they show up inside almost every other formula in the guide. They all share one rule: they look only at numbers and quietly skip text and blank cells.", "sections": [{"id": "ss-sum", "h": "SUM: add it all up", "blocks": [{"t": "sig", "s": "SUM(number1, [number2], ...)", "args": [["number1", "required", "A number, a cell, or a range to add"], ["number2, ...", "optional", "More numbers, cells, or ranges, up to 255 of them"]]}, {"t": "p", "x": "SUM adds every number it's given. Give it a range and it adds every number inside. Give it several ranges separated by commas and it adds them all. It ignores text and empty cells, so a column header inside the range won't break it."}, {"t": "ex", "f": "=SUM(C4:F4)", "parts": [["SUM(", "Add up everything inside the parentheses"], ["C4:F4", "Monday's Coffee, Pastries, Sandwiches, and Drinks sales"]], "eval": [], "say": "Add Monday's four sales columns.", "out": "Monday's Total Sales. Filled down, it becomes `=SUM(C5:F5)`, `=SUM(C6:F6)`, and so on.", "from": "F-1"}, {"t": "tip", "x": "[[Home > AutoSum]] (the Σ button) writes the SUM for you and guesses the range. Always check its guess before pressing {{Return}}. It stops at the first blank cell, so a gap in the data can make it pick the wrong range."}, {"t": "trap", "x": "SUM skipping text is a feature until it hides a mistake. If a number was stored as text, SUM leaves it out without any warning. See section 4 of %%grammar|Formula Grammar%%."}]}, {"id": "ss-avg", "h": "AVERAGE: the typical value", "blocks": [{"t": "sig", "s": "AVERAGE(number1, [number2], ...)", "args": [["number1", "required", "A number, a cell, or a range"], ["number2, ...", "optional", "More numbers or ranges"]]}, {"t": "p", "x": "AVERAGE adds the numbers and divides by how many numbers there are. The key word is numbers. Blank cells and text aren't counted at all, but a 0 is a real number, so it counts and pulls the average down."}, {"t": "ex", "f": "=AVERAGE(tblSales[Qty])", "parts": [["AVERAGE(", "Add the numbers, then divide by how many there are"], ["tblSales[Qty]", "The Qty column of the sales table"]], "eval": [], "say": "Find the average order quantity in the sales table.", "out": "The typical order size. Because it points at the table column, new orders are included automatically.", "from": "1-4"}, {"t": "trap", "x": "**Blank and zero aren't the same.** If a café is closed Sunday and the cell is blank, AVERAGE uses 6 days. Type 0 in that cell and AVERAGE uses 7, so the average drops. Decide which one you mean before you fill in the cell."}, {"t": "tip", "x": "For a typical value that big outliers can't drag around, MEDIAN works the same way but returns the middle value instead."}]}, {"id": "ss-maxmin", "h": "MAX and MIN: the extremes", "blocks": [{"t": "sig", "s": "MAX(number1, [number2], ...)", "args": [["number1", "required", "A number, a cell, or a range"], ["number2, ...", "optional", "More numbers or ranges"]]}, {"t": "p", "x": "MAX returns the largest number and MIN returns the smallest. Both skip text and blanks. Because dates are numbers, MAX of a date column gives the latest date and MIN gives the earliest."}, {"t": "ex", "f": "=MAX(Rentals!N2:N41)", "parts": [["MAX(", "Find the biggest number"], ["Rentals!N2:N41", "The Days Late column on the Rentals sheet"]], "eval": [], "say": "Find the longest delay in the Days Late column.", "out": "The worst late return of the season, for the owner's report.", "from": "F-2"}, {"t": "ex", "f": "=MIN(tblSales[Price])", "parts": [["MIN(", "Find the smallest number"], ["tblSales[Price]", "Every price in the sales table"]], "eval": [], "say": "Find the lowest price in the sales table.", "out": "The cheapest item sold.", "from": "1-4"}, {"t": "trap", "x": "MAX of a range with no numbers at all returns 0, not an error. A 0 can look like a real answer, so check that the range actually has data."}, {"t": "p", "x": "To find the biggest value that matches a condition, like the highest Nike price, use MAXIFS and MINIFS in %%conditional|the conditional family%%."}]}, {"id": "ss-compare", "h": "Which one to use", "blocks": [{"t": "table", "head": ["You want", "Use", "Counts blanks?", "Counts zeros?"], "rows": [["The total", "`SUM`", "No (adds nothing)", "Yes (adds 0)"], ["The typical value", "`AVERAGE`", "No", "Yes, and they pull it down"], ["The biggest or latest", "`MAX`", "No", "Yes"], ["The smallest or earliest", "`MIN`", "No", "Yes, and a stray 0 often wins"], ["A total that skips hidden or filtered rows", "`SUBTOTAL(9, ...)`", "No", "Yes"]]}, {"t": "p", "x": "SUBTOTAL is covered in %%sumproduct-subtotal%%."}]}, {"id": "ss-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-210 Domain 4 names SUM, AVERAGE, MAX, and MIN directly, usually with structured references to a table column (@@1-4@@). TOSA Basic lists SUM, AVERAGE, MAX, and IF as the first functions you need to pass. A common TOSA question shows a range with a blank and a zero and asks what AVERAGE returns."}]}], "group": "Math and Counting", "levels": ["1-2", "1-4", "F-1", "F-2"], "kw": "AVERAGE MAX MIN SUBTOTAL SUM SUM, AVERAGE, MAX, MIN The four everyday summary functions"}, {"id": "counting", "title": "COUNT, COUNTA, COUNTBLANK", "tag": "CODEX · MATH AND COUNTING", "sub": "Three ways to count cells", "lead": "Counting sounds simple until you ask what counts. A number? Any value at all? An empty cell? Excel has a different function for each question, and mixing them up is one of the most common mistakes on both exams. To count only the cells that match a condition, like \"Premium\" members, jump to %%conditional|COUNTIF and COUNTIFS%%.", "sections": [{"id": "ct-count", "h": "COUNT: cells with numbers", "blocks": [{"t": "sig", "s": "COUNT(value1, [value2], ...)", "args": [["value1", "required", "A cell or range to count"], ["value2, ...", "optional", "More cells or ranges"]]}, {"t": "p", "x": "COUNT counts the cells that hold numbers. Dates and times count too, because they're numbers underneath. Text, blanks, TRUE/FALSE, and errors are left out."}, {"t": "ex", "f": "=COUNT(Week!G4:G10)", "parts": [["COUNT(", "Count the cells that hold numbers"], ["Week!G4:G10", "The seven daily totals"]], "eval": [], "say": "Count how many days have a total.", "out": "7. This fixed the #DIV/0! in Closeout!B7, which was dividing by an empty cell.", "from": "F-1"}, {"t": "trap", "x": "In @@F-2@@ the rental IDs are text, so `=COUNT(Rentals!A2:A41)` returns 0. Use COUNTA for text."}]}, {"id": "ct-counta", "h": "COUNTA: cells that aren't empty", "blocks": [{"t": "sig", "s": "COUNTA(value1, [value2], ...)", "args": [["value1", "required", "A cell or range to count"], ["value2, ...", "optional", "More cells or ranges"]]}, {"t": "p", "x": "COUNTA (count all) counts every cell that isn't empty: numbers, text, dates, TRUE/FALSE, even errors. Use it to count records, like how many rentals were logged, when the column you're counting holds text."}, {"t": "ex", "f": "=COUNTA(Rentals!A2:A41)", "parts": [["COUNTA(", "Count every cell that isn't empty"], ["Rentals!A2:A41", "The rental ID column, starting below the header"]], "eval": [], "say": "Count every rental ID that's been logged.", "out": "The number of rentals, even though every ID is text.", "from": "F-2"}, {"t": "trap", "x": "A cell that looks empty might not be. A single space, or a formula that returns `\"\"`, counts as not empty. If COUNTA comes out higher than you expect, click a few \"empty\" cells and check the formula bar."}, {"t": "trap", "x": "Start the range below the header. In @@F-4@@, `COUNTA(Members!H1:H81)` counted the header too, so the active rate divided by 81 instead of 80."}]}, {"id": "ct-blank", "h": "COUNTBLANK: empty cells", "blocks": [{"t": "sig", "s": "COUNTBLANK(range)", "args": [["range", "required", "One range to check. Unlike COUNT, it takes just one"]]}, {"t": "p", "x": "COUNTBLANK counts the empty cells in a range. A formula that returns `\"\"` counts as blank here, which is the opposite of COUNTA. A cell with a space in it doesn't count as blank."}, {"t": "ex", "f": "=COUNTBLANK(Survey!B2:B31)", "parts": [["COUNTBLANK(", "Count the empty cells"], ["Survey!B2:B31", "The rating column of the survey"]], "eval": [], "say": "Count the customers who skipped the rating question.", "out": "How many ratings were left blank.", "from": "1-4"}, {"t": "tip", "x": "COUNT plus COUNTBLANK should equal the size of a column of numbers. If they don't add up, some cells hold text that looks like a number."}]}, {"id": "ct-compare", "h": "Which one to use", "blocks": [{"t": "table", "head": ["You want to count", "Use", "Example"], "rows": [["Numbers and dates", "`COUNT`", "Returned dates in @@F-2@@: `=COUNT(Rentals!J2:J41)`"], ["Anything that isn't empty", "`COUNTA`", "Rental IDs in @@F-2@@"], ["Empty cells", "`COUNTBLANK`", "Skipped ratings in @@1-4@@"], ["Cells that match a condition", "`COUNTIF` / `COUNTIFS`", "Premium members in @@F-4@@"], ["Visible rows only, after a filter", "`SUBTOTAL(2, ...)` or `SUBTOTAL(3, ...)`", "See %%sumproduct-subtotal%%"]]}, {"t": "p", "x": "A quick way to remember: COUNT means numbers. COUNTA means **A**nything. COUNTBLANK means nothing."}]}, {"id": "ct-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "MO-210 names COUNT, COUNTA, and COUNTBLANK together. Read the task's wording carefully: \"how many customers responded\" (COUNTA on names) is a different question from \"how many ratings were given\" (COUNT on ratings). TOSA Basic tests COUNT, and TOSA Productive adds COUNTA. Expect a question with mixed text and numbers that asks what each function returns."}]}], "group": "Math and Counting", "levels": ["1-4", "F-1", "F-2"], "kw": "COUNT COUNTA COUNTBLANK SUBTOTAL COUNT, COUNTA, COUNTBLANK Three ways to count cells"}, {"id": "rounding", "title": "ROUND, INT, and friends", "tag": "CODEX · MATH AND COUNTING", "sub": "Changing a number's precision for real", "lead": "Number formats can make 14.9925 look like $14.99, but the cell still holds 14.9925, and every formula that uses it gets the long version. The rounding functions actually change the value. Use them when the rounded number is the real answer, like a price that has to be in cents.", "sections": [{"id": "rd-round", "h": "ROUND: to a set number of places", "blocks": [{"t": "sig", "s": "ROUND(number, num_digits)", "args": [["number", "required", "The value to round, often a whole calculation"], ["num_digits", "required", "How many decimal places to keep. 2 means cents, 0 means whole numbers, and a negative number rounds to the left of the decimal point"]]}, {"t": "p", "x": "ROUND looks at the first digit you're dropping. If it's 5 or more, it rounds up. Otherwise it rounds down. The num_digits argument decides where the cut happens."}, {"t": "table", "head": ["Formula", "Result", "What happened"], "rows": [["`=ROUND(14.567,2)`", "14.57", "Kept 2 decimals. The dropped 7 rounded up"], ["`=ROUND(14.567,1)`", "14.6", "Kept 1 decimal"], ["`=ROUND(14.567,0)`", "15", "Whole number"], ["`=ROUND(1567,-1)`", "1570", "Nearest ten"], ["`=ROUND(1567,-3)`", "2000", "Nearest thousand"]]}, {"t": "ex", "f": "=ROUND(D2*(1-E2),2)", "parts": [["ROUND(", "Round the result of the calculation inside"], ["D2*(1-E2)", "The sale price: list price times what's left after the discount"], ["2", "Keep 2 decimal places, which means whole cents"]], "eval": [], "say": "Work out the sale price, then round it to the cent.", "out": "A price the website can show, like 14.99 instead of 14.9925.", "from": "F-3"}, {"t": "trap", "x": "**Formatting isn't rounding.** Format a cell to 2 decimals and it only looks rounded. Add up a column of \"looks rounded\" prices and the total can be off by a cent or two from what's on screen. The exam tests this difference directly."}]}, {"id": "rd-int", "h": "INT: down to a whole number", "blocks": [{"t": "sig", "s": "INT(number)", "args": [["number", "required", "The value to turn into a whole number"]]}, {"t": "p", "x": "INT always rounds **down** to the next whole number. For positive numbers, that just chops off the decimals: 14.99 becomes 14. For negative numbers, down means further from zero: -14.2 becomes -15."}, {"t": "ex", "f": "=INT(O2)", "parts": [["INT(", "Round down to a whole number"], ["O2", "The sale price, already rounded to cents"]], "eval": [], "say": "Take the whole-dollar part of the sale price.", "out": "The \"from $14\" ad price. 14.99 becomes 14, never 15.", "from": "F-3"}]}, {"id": "rd-family", "h": "The rest of the family", "blocks": [{"t": "p", "x": "You don't need these for the practice levels, but they come up in exam questions, and seeing them side by side makes the differences clear."}, {"t": "table", "head": ["Formula", "14.567 becomes", "-14.567 becomes", "Rule"], "rows": [["`ROUND(x,0)`", "15", "-15", "Nearest whole number"], ["`INT(x)`", "14", "-15", "Always down"], ["`ROUNDUP(x,0)`", "15", "-15", "Always away from zero"], ["`ROUNDDOWN(x,0)`", "14", "-14", "Always toward zero"], ["`TRUNC(x)`", "14", "-14", "Chop off the decimals"]]}, {"t": "p", "x": "ROUNDUP and ROUNDDOWN take the same two arguments as ROUND. A business example: shipping is charged per started pound, so a 3.2-pound box is billed as `=ROUNDUP(3.2,0)`, which is 4 pounds."}, {"t": "tip", "x": "RANDBETWEEN in @@1-2@@ already gives whole numbers, so it never needs INT. RAND gives decimals, and `=INT(RAND()*100)` is an old way to get a whole number from 0 to 99."}]}, {"id": "rd-exam", "h": "On the exams", "blocks": [{"t": "exam", "x": "TOSA Advanced lists ROUND and INT by name. Expect questions about negative numbers with INT, and about the difference between formatting a value and rounding it. MOS doesn't list rounding functions, but rounded results often appear inside other tasks."}]}], "group": "Math and Counting", "levels": ["F-3"], "kw": "INT RAND ROUND ROUNDDOWN ROUNDUP TRUNC ROUND, INT, and friends Changing a number's precision for real"}, {"id": "logic", "title": "IF, IFS, SWITCH, AND, OR, NOT", "tag": "CODEX · LOGIC", "sub": "Formulas that make decisions", "lead": "Logic functions let a workbook make a call by itself: Refund or Hold, Goal or Below, Platinum or Gold. Every one of them runs on TRUE and FALSE. IF picks a result based on one test, IFS and SWITCH pick from many, and AND, OR, and NOT combine tests into one.", "sections": [{"id": "lg-if", "h": "IF: one test, two results", "blocks": [{"t": "sig", "s": "IF(logical_test, [value_if_true], [value_if_false])", "args": [["logical_test", "required", "Anything that comes out TRUE or FALSE, usually a comparison like `G4>=600`"], ["value_if_true", "optional", "The result when the test is TRUE: a number, \"text in quotes\", a cell, or another formula. Excel's hint shows it in brackets, but an IF without it is rarely useful"], ["value_if_false", "optional", "The result when the test is FALSE. Leave it out and the cell shows FALSE"]]}, {"t": "p", "x": "IF asks one yes-or-no question and gives one of two answers. The answers don't have to be words. They can be numbers, cell references, or whole calculations, which is what makes IF so powerful."}, {"t": "ex", "f": "=IF(E2<10,\"Reorder\",\"OK\")", "parts": [["E2<10", "The test: is stock below 10?"], ["\"Reorder\"", "Shown when the test is TRUE"], ["\"OK\"", "Shown when it's FALSE"]], "eval": [], "say": "If stock is under 10, show Reorder. Otherwise, show OK.", "out": "A reorder flag for every book in the catalog.", "from": "1-4"}, {"t": "trap", "x": "Watch the edges. `E2<10` treats exactly 10 as OK. `G4>600` treats a day of exactly $600 as Below. Read the task for \"or more\" or \"at least\" (use `>=`) and \"more than\" (use `>`)."}, {"t": "tip", "x": "A result of `\"\"` (two quotes with nothing between) shows a blank cell. `=IF(I2=\"\",\"\",WEEKDAY(I2,2))` in @@2-3@@ leaves unsold pairs blank instead of showing a meaningless weekday."}]}, {"id": "lg-nested", "h": "Nested IF: more than two results", "blocks": [{"t": "p", "x": "For three or more results, put a second IF in the value_if_false slot of the first. Excel asks the questions in order and stops at the first TRUE, so the order of the tests is part of the logic."}, {"t": "ex", "f": "=IF(B2>=10000,\"Platinum\",IF(B2>=5000,\"Gold\",\"Standard\"))", "parts": [["B2>=10000", "Test 1, the strictest: 10,000 or more?"], ["\"Platinum\"", "If test 1 is TRUE, stop here"], ["IF(B2>=5000,\"Gold\",\"Standard\")", "If test 1 is FALSE, ask test 2. Gold at 5,000 or more, otherwise Standard"]], "eval": [], "say": "If sales are 10,000 or more, Platinum. Otherwise, if they're 5,000 or more, Gold. Otherwise, Standard.", "out": "Bayfront Live, with $12,450 in sales, gets Platinum. In the broken version the 5,000 test came first, so Bayfront Live stopped at Gold.", "from": "F-6"}, {"t": "trap", "x": "With \"greater than\" tiers, test the **biggest** threshold first. With \"less than\" tiers, test the smallest first. Either way, the strictest test goes first."}]}, {"id": "lg-ifs", "h": "IFS: many tests, no nesting", "blocks": [{"t": "sig", "s": "IFS(logical_test1, value_if_true1, [logical_test2, value_if_true2], ...)", "args": [["logical_test1", "required", "The first test"], ["value_if_true1", "required", "The result if the first test is TRUE"], ["logical_test2, value_if_true2, ...", "optional", "More test-and-result pairs, up to 127"]]}, {"t": "p", "x": "IFS does the same job as a nested IF, written as a flat list of pairs. It checks each test in order and returns the result for the first one that's TRUE. There's no value_if_false, so if every test is FALSE, IFS returns #N/A. The fix is a last test of `TRUE`, which is always true, so it works as \"everything else.\""}, {"t": "ex", "f": "=IFS(G2>=300,\"Grail\",G2>=150,\"Heat\",TRUE,\"Everyday\")", "parts": [["G2>=300,\"Grail\"", "Pair 1: 300 or more is a Grail"], ["G2>=150,\"Heat\"", "Pair 2: otherwise, 150 or more is Heat"], ["TRUE,\"Everyday\"", "Pair 3: everything else is Everyday"]], "eval": [], "say": "300 or more is Grail, 150 or more is Heat, and anything else is Everyday.", "out": "A price tier for every sneaker.", "from": "2-3"}]}, {"id": "lg-switch", "h": "SWITCH: match a value to a result", "blocks": [{"t": "sig", "s": "SWITCH(expression, value1, result1, [default_or_value2, result2], ...)", "args": [["expression", "required", "The value to check, usually a cell like `E2`"], ["value1, result1", "required", "If the expression equals value1, return result1"], ["default_or_value2, result2, ...", "optional", "More value-and-result pairs. One argument left over at the end, with no result after it, is the default: what to show when nothing matches"]]}, {"t": "p", "x": "SWITCH is for exact matches against a list of codes, like a condition code that should become a full name. It's shorter than IFS because you write the cell once instead of in every test. It can't do comparisons like `>=`, only \"equals.\""}, {"t": "ex", "f": "=SWITCH(E2,\"DS\",\"Deadstock\",\"VNDS\",\"Very Near Deadstock\",\"U\",\"Used\",\"Unknown\")", "parts": [["E2", "The condition code to check"], ["\"DS\",\"Deadstock\"", "DS becomes Deadstock"], ["\"VNDS\",\"Very Near Deadstock\"", "VNDS becomes Very Near Deadstock"], ["\"U\",\"Used\"", "U becomes Used"], ["\"Unknown\"", "The default: any other code"]], "eval": [], "say": "Turn the condition code in E2 into its full name, or Unknown if it isn't on the list.", "from": "2-3"}, {"t": "trap", "x": "The default is the odd one out. It's a single argument at the end with no partner. Leave it off and an unmatched code shows #N/A."}]}, {"id": "lg-andor", "h": "AND, OR, and NOT: combining tests", "blocks": [{"t": "sig", "s": "AND(logical1, [logical2], ...)", "args": [["logical1", "required", "A test that comes out TRUE or FALSE"], ["logical2, ...", "optional", "More tests. OR takes the same arguments"]]}, {"t": "p", "x": "**AND** is TRUE only when every test is TRUE. **OR** is TRUE when at least one test is TRUE. **NOT** flips a single test: `NOT(K2=\"Y\")` is TRUE when K2 is anything except Y. On their own, these three just show TRUE or FALSE. Put them in the logical_test spot of an IF to turn them into a decision."}, {"t": "ex", "f": "=IF(AND(J2<>\"\",N2=0,NOT(K2=\"Y\")),\"Refund\",\"Hold\")", "parts": [["J2<>\"\"", "Tes
